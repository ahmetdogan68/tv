<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070b14;color:#fff;font-family:Arial;display:flex;height:100vh;overflow:hidden}
#left{width:200px;background:#0b1120;border-right:2px solid #1e2d4a;display:flex;flex-direction:column}
#mid{width:200px;background:#101a2e;border-right:2px solid #1e2d4a;display:flex;flex-direction:column}
#rightMain{width:340px;background:#0e1424;border-right:2px solid #1e2d4a;display:flex;flex-direction:column}
#playerArea{flex:1;background:#000;display:flex;flex-direction:column;position:relative}
#logoTop{padding:10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #1e2d4a;background:#080e1e}
#logoTop img{width:34px;height:34px;border-radius:6px;background:#000}
#logoTop h1{color:#ff0a16;font-size:14px;letter-spacing:1px}
.tabs{display:flex;padding:6px;gap:4px;border-bottom:1px solid #1e2d4a}
.tab{flex:1;padding:7px;background:#1a2744;border-radius:5px;text-align:center;cursor:pointer;font-size:10px}
.tab.active{background:#ff0a16}
.box{margin:6px;padding:8px;background:#151d32;border-radius:6px;border:1px solid #1e2d4a;display:none}
.box.active{display:block}
.btn{width:100%;padding:8px;background:#ff0a16;color:#fff;border:none;border-radius:5px;font-weight:bold;cursor:pointer;margin-top:4px;font-size:11px}
input{width:100%;padding:7px;border-radius:5px;border:1px solid #1e2d4a;background:#060a14;color:#fff;margin-top:4px;font-size:11px}
.mainCat{padding:8px;background:#151d32;margin:3px 0;border-radius:6px;cursor:pointer;border:1px solid #1e2d4a;display:flex;justify-content:space-between;font-size:11px}
.mainCat.active{background:#ff0a16}
#groupList{flex:1;overflow-y:auto;padding:5px}
.group{padding:8px;background:#151d32;margin:3px 0;border-radius:6px;cursor:pointer;font-size:11px;border:1px solid #1e2d4a;display:flex;justify-content:space-between}
.group.active{background:#ff0a16;font-weight:bold}
#subGroupList{flex:1;overflow-y:auto;padding:5px}
.subGroup{padding:8px;background:#1a2744;margin:3px 0;border-radius:6px;cursor:pointer;font-size:11px;border:1px solid #1e2d4a}
.subGroup.active{background:#ff0a16}
#channelList{flex:1;overflow-y:auto;padding:5px}
.ch{padding:6px;background:#1a2340;margin:3px 0;border-radius:6px;cursor:pointer;border:1px solid #1e2d4a;display:flex;gap:6px;align-items:center}
.ch.active{background:#ff0a16}
.ch img{width:32px;height:32px;border-radius:4px;background:#000;object-fit:contain}
.ch.info{flex:1;overflow:hidden}
.ch.n{font-size:11px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch.e{font-size:9px;color:#8aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ch.active.e{color:#fff}
#player{flex:1;width:100%;background:#000}
#bar{padding:8px;background:#0b1120;display:flex;justify-content:space-between;font-size:11px;border-top:1px solid #1e2d4a}
#resInfo{padding:6px 10px;background:#151d32;font-size:10px;color:#8aa;display:flex;justify-content:space-between;border-top:1px solid #1e2d4a}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070b14;z-index:10}
#empty img{width:180px}
#settingsPanel{position:absolute;top:0;right:0;bottom:0;width:300px;background:#0b1120;border-left:2px solid #ff0a16;z-index:20;transform:translateX(100%);transition:.3s;padding:10px;display:flex;flex-direction:column}
#settingsPanel.open{transform:translateX(0)}
</style>
</head>
<body>

<div id="left">
<div id="logoTop"><img src="logo.png" onerror="this.src='https://via.placeholder.com/32/ff0a16/fff?text=M'"><h1>MIRTI TV</h1><button onclick="toggleSettings()" style="margin-left:auto;background:#1a2744;border:none;color:#fff;padding:4px 8px;border-radius:4px;cursor:pointer">⚙️</button></div>
<div class="tabs"><div class="tab active" onclick="setMain('Tümü')" data-cat="Tümü">Tümü</div><div class="tab" onclick="setMain('Canlı')" data-cat="Canlı">CANLI</div><div class="tab" onclick="setMain('Film')" data-cat="Film">FİLM</div><div class="tab" onclick="setMain('Dizi')" data-cat="Dizi">DİZİ</div></div>
<div id="groupList"></div>
<div id="savedLists" style="padding:5px;border-top:1px solid #1e2d4a;max-height:90px;overflow-y:auto"></div>
</div>

<div id="mid">
<div style="padding:8px;background:#151d32;font-size:11px;font-weight:bold;border-bottom:1px solid #1e2d4a" id="midTitle">GRUP DETAYI</div>
<div id="subGroupList"></div>
<input id="search" placeholder="🔍 Kanal ara..." style="margin:5px;width:95%">
</div>

<div id="rightMain">
<div style="padding:8px;background:#ff0a16;font-size:11px;font-weight:bold;display:flex;justify-content:space-between"><span id="chTitle">KANALLAR</span><span id="chCnt">0</span></div>
<div id="channelList"></div>
</div>

<div id="playerArea">
<div id="empty"><img src="logo.png" onerror="this.style.display='none'"><h2 style="margin-top:12px;color:#ff0a16;letter-spacing:3px">MIRTI TV</h2><p style="margin-top:6px;font-size:11px;color:#5a6a8a">Ayarlardan liste yükle, logo köşeye küçülecek</p><button class="btn" style="width:160px;margin-top:12px" onclick="toggleSettings()">⚙️ AYARLARI AÇ</button></div>
<video id="player" controls autoplay playsinline></video>
<div id="bar"><span id="now">Hazır</span><span id="nowGroup" style="color:#8aa"></span></div>
<div id="resInfo"><span id="resText">Çözünürlük: -</span><span id="epgText">EPG: Bekleniyor</span><span id="bitrate">-</span></div>

<div id="settingsPanel">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>⚙️ AYARLAR - YÜKLEME</b><button onclick="toggleSettings()" style="background:#ff0a16;border:none;color:#fff;padding:4px 10px;border-radius:4px;cursor:pointer">X</button></div>
<div class="tabs" style="border:none"><div class="tab active" onclick="openTab(0)">URL</div><div class="tab" onclick="openTab(1)">XTREAM</div><div class="tab" onclick="openTab(2)">DOSYA</div></div>
<div class="box active" id="b0"><input id="urlInput" placeholder="https://...m3u"><button class="btn" onclick="loadUrl()">YÜKLE + KAYDET</button><div id="epgStatus" style="font-size:9px;color:#8aa;margin-top:6px">EPG: epgshare01 otomatik</div></div>
<div class="box" id="b1"><input id="xHost" placeholder="http://host:port"><input id="xUser" placeholder="Kullanıcı"><input id="xPass" placeholder="Şifre"><button class="btn" onclick="loadXtream()">XTREAM GİRİŞ</button></div>
<div class="box" id="b2"><label for="fileInput" style="display:block;text-align:center;color:#ff0a16;border:1px dashed #ff0a16;padding:10px;border-radius:6px;cursor:pointer">📁 DOSYA SEÇ (.m3u/.txt)</label><input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" style="display:none"></div>
<input id="epgUrlInput" placeholder="EPG XML https://epgshare01.online/..." value="https://epgshare01.online/epgshare01/epg_ripper_TR1.xml" style="margin-top:10px"><button class="btn" style="background:#1a2744" onclick="loadEPG(document.getElementById('epgUrlInput').value)">EPG YÜKLE</button>
</div>
</div>

<script>
let all=[]; let epg={}; let hls=null; let mainCat='Tümü'; let activeGroup='Tümü'; let activeSub='Tümü';
let saved=JSON.parse(localStorage.getItem('MIRTI_FINAL_LOGO')||'{}'); let currentList=''; const video=document.getElementById('player');
const EPG_DEFAULT='https://epgshare01.online/epgshare01/epg_ripper_TR1.xml';

function toggleSettings(){ document.getElementById('settingsPanel').classList.toggle('open'); }
function openTab(i){document.querySelectorAll('#settingsPanel.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));document.querySelectorAll('.box').forEach((b,idx)=>b.classList.toggle('active',idx===i));}
function catOf(n,g){ let s=(n+' '+g).toLowerCase(); if(s.includes('film')||s.includes('movie')||s.includes('sinema'))return 'Film'; if(s.includes('dizi')||s.includes('series')||s.includes('sezon')||s.includes('bolum')||s.includes('bölüm'))return 'Dizi'; return 'Canlı'; }
function parseM3U(text){
const lines=text.split(/\r?\n/); const out=[]; let tmp={name:'',group:'Genel',sub:'Genel',logo:'',tvgId:'',tvgName:''}; let epgFrom=''; let head=text.slice(0,1000); let m=head.match(/x-tvg-url="([^"]+)"/)||head.match(/url-tvg="([^"]+)"/); if(m) epgFrom=m[1];
for(let i=0;i<lines.length;i++){ let l=lines[i].trim(); if(!l)continue; if(l.startsWith('#EXTINF')){ tmp.name=l.split(',').pop().trim()||''; let gM=l.match(/group-title="([^"]+)"/)||l.match(/group-title='([^']+)'/); tmp.group=gM?gM[1].trim():'Genel'; if(tmp.group.includes('|')){ let parts=tmp.group.split('|'); tmp.group=parts[0].trim(); tmp.sub=parts[1]?parts[1].trim():'Genel'; }else tmp.sub='Genel'; tmp.logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||''; tmp.tvgId=(l.match(/tvg-id="([^"]+)"/)||[])[1]||''; tmp.tvgName=(l.match(/tvg-name="([^"]+)"/)||[])[1]||''; }else if(!l.startsWith('#')&&l.startsWith('http')){ if(!tmp.name) tmp.name='Kanal '+(out.length+1); out.push({name:tmp.name,group:tmp.group,sub:tmp.sub,logo:tmp.logo,tvgId:tmp.tvgId,tvgName:tmp.tvgName||tmp.name,cat:catOf(tmp.name,tmp.group),url:l}); tmp={name:'',group:'Genel',sub:'Genel',logo:'',tvgId:'',tvgName:''}; } }
return {channels:out, epgFrom};
}
async function fetchProxy(url){ const proxies=[url,'https://corsproxy.io/?'+encodeURIComponent(url),'https://api.allorigins.win/raw?url='+encodeURIComponent(url)]; for(let p of proxies){ try{ let r=await fetch(p); if(r.ok){ let t=await r.text(); if(t.length>100) return t; } }catch(e){} } throw 'CORS'; }
async function loadUrl(){ let url=document.getElementById('urlInput').value.trim(); if(!url)return alert('URL gir'); try{ let txt=await fetchProxy(url); let res=parseM3U(txt); if(res.channels.length){ all=res.channels; currentList=url.split('/').pop().slice(0,20); saveAuto(); apply(); loadEPG(res.epgFrom||EPG_DEFAULT); toggleSettings(); } }catch{ alert('CORS - Dosya indir'); } }
async function loadXtream(){ let host=document.getElementById('xHost').value.trim().replace(/\/$/,''); let u=document.getElementById('xUser').value.trim(); let p=document.getElementById('xPass').value.trim(); if(!host||!u||!p)return alert('Bilgileri gir'); let m3u=`${host}/get.php?username=${u}&password=${p}&type=m3u_plus&output=mpegts`; try{ let txt=await fetchProxy(m3u); let res=parseM3U(txt); if(res.channels.length){ all=res.channels; currentList='Xtream-'+u; saveAuto(); apply(); loadEPG(res.epgFrom||EPG_DEFAULT); toggleSettings(); } }catch{ alert('Xtream CORS'); } }
function saveAuto(){ if(!all.length)return; let name=currentList||'Liste '+(Object.keys(saved).length+1); saved[name]=all; localStorage.setItem('MIRTI_FINAL_LOGO',JSON.stringify(saved)); renderSaved(); }
function renderSaved(){ const box=document.getElementById('savedLists'); box.innerHTML=''; Object.keys(saved).forEach(k=>{ let d=document.createElement('div'); d.style.cssText='padding:5px;background:#151d32;margin:2px 0;border-radius:5px;cursor:pointer;font-size:10px;display:flex;justify-content:space-between;border:1px solid #1e2d4a'+(k===currentList?';background:#ff0a16':''); d.innerHTML=`<span>📁 ${k} (${saved[k].length})</span><span onclick="delList('${k}')" style="color:#ff0a16">✕</span>`; d.onclick=()=>{ if(event.target.textContent!=='✕'){ all=saved[k]; currentList=k; apply(); } }; box.appendChild(d); }); }
function delList(k){ if(confirm(k+' sil?')){ delete saved[k]; localStorage.setItem('MIRTI_FINAL_LOGO',JSON.stringify(saved)); renderSaved(); } }
function apply(){ document.getElementById('empty').style.display='none'; updateMain(); buildGroups(); }
function updateMain(){ document.querySelectorAll('.tab').forEach(el=>{}); }
function setMain(cat){ mainCat=cat; document.querySelectorAll('#left.mainCat').forEach?.(el=>{}); document.querySelectorAll('.tabs.tab').forEach(t=>{ if(t.textContent.includes(cat.toUpperCase())||t.textContent.includes('TÜMÜ')&&cat==='Tümü'){} }); mainCat=cat; document.querySelectorAll('#left.tabs.tab').forEach((t,i)=>{ const cats=['Tümü','Canlı','Film','Dizi']; t.classList.toggle('active',cats[i]===cat); }); activeGroup='Tümü'; activeSub='Tümü'; buildGroups(); }
function buildGroups(){
let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat);
let groups=['Tümü',...new Set(base.map(c=>c.group))].filter(Boolean);
const box=document.getElementById('groupList'); box.innerHTML='';
groups.forEach(g=>{
let cnt=g==='Tümü'?base.length:base.filter(x=>x.group===g).length;
let b=document.createElement('div'); b.className='group'+(activeGroup===g?' active':'');
b.innerHTML=`<span>${g}</span><span style="background:#0b1120;padding:1px 5px;border-radius:8px;font-size:9px">${cnt}</span>`;
b.onclick=()=>{ activeGroup=g; activeSub='Tümü'; document.querySelectorAll('.group').forEach(x=>x.classList.remove('active')); b.classList.add('active'); buildSubGroups(); };
box.appendChild(b);
});
buildSubGroups();
}
function buildSubGroups(){
let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat);
let byGroup=base.filter(c=>activeGroup==='Tümü'||c.group===activeGroup);
let subs=['Tümü',...new Set(byGroup.map(c=>c.sub))].filter(Boolean);
const box=document.getElementById('subGroupList'); box.innerHTML='';
document.getElementById('midTitle').textContent=activeGroup+' DETAY';
subs.forEach(s=>{
let cnt=s==='Tümü'?byGroup.length:byGroup.filter(x=>x.sub===s).length;
let b=document.createElement('div'); b.className='subGroup'+(activeSub===s?' active':'');
b.textContent=s==='Tümü'?`Tümü (${cnt})`:`${s} (${cnt})`;
b.onclick=()=>{ activeSub=s; document.querySelectorAll('.subGroup').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderCh(); };
box.appendChild(b);
});
renderCh();
}
function renderCh(){
let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat);
let f1=base.filter(c=>activeGroup==='Tümü'||c.group===activeGroup);
let f2=f1.filter(c=>activeSub==='Tümü'||c.sub===activeSub);
let q=document.getElementById('search').value.toLowerCase(); if(q) f2=f2.filter(c=>c.name.toLowerCase().includes(q));
const box=document.getElementById('channelList'); box.innerHTML='';
document.getElementById('chTitle').textContent=activeSub!=='Tümü'?activeSub: activeGroup!=='Tümü'?activeGroup:'KANALLAR';
document.getElementById('chCnt').textContent=f2.length;
f2.forEach(c=>{
let prog=epg[c.tvgId]||epg[c.tvgName]||epg[c.name]||null;
let logo=c.logo||`https://via.placeholder.com/64x64/111a2e/ff0a16?text=${c.name[0]}`;
let d=document.createElement('div'); d.className='ch';
d.innerHTML=`<img src="${logo}" onerror="this.src='https://via.placeholder.com/32?text=TV'"><div class="info"><div class="n">${c.name}</div><div class="e">${prog? '▶ '+prog.now : c.group} ${prog?.next? ' | '+prog.next : ''}</div></div>`;
d.onclick=()=>{ document.querySelectorAll('.ch').forEach(x=>x.classList.remove('active')); d.classList.add('active'); play(c); };
box.appendChild(d);
});
}
function play(c){
if(hls){try{hls.destroy()}catch(e){} hls=null;}
document.getElementById('now').textContent=c.name; document.getElementById('nowGroup').textContent=c.group+' | '+c.cat;
let prog=epg[c.tvgId]||epg[c.tvgName]; document.getElementById('epgText').textContent=prog? 'EPG: '+prog.now : 'EPG: '+c.group;
video.pause(); video.removeAttribute('src'); video.load();
if(Hls.isSupported()){ hls=new Hls(); hls.loadSource(c.url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{})); }else{ video.src=c.url; video.play().catch(()=>{}); }
}
async function loadEPG(url){
if(!url) url=EPG_DEFAULT; document.getElementById('epgStatus').textContent='EPG yükleniyor...';
try{
let txt=await fetchProxy(url); let parser=new DOMParser(); let xml=parser.parseFromString(txt,'text/xml');
let progs=xml.querySelectorAll('programme'); let now=new Date(); let tmp={};
progs.forEach(p=>{
let ch=p.getAttribute('channel'); let s=p.getAttribute('start'); let title=p.querySelector('title')?.textContent||''; if(!ch||!s)return;
let y=parseInt(s.substring(0,4)), mo=parseInt(s.substring(4,6))-1, d=parseInt(s.substring(6,8)), h=parseInt(s.substring(8,10)), mi=parseInt(s.substring(10,12));
let sDate=new Date(y,mo,d,h,mi);
if(Math.abs(sDate-now)<3*60*60*1000){ tmp[ch]={now:title, next:''}; }
});
epg=tmp; document.getElementById('epgStatus').textContent=`EPG: ${Object.keys(epg).length} program`; renderCh();
}catch{ document.getElementById('epgStatus').textContent='EPG: Yüklenemedi'; }
}
video.addEventListener('loadedmetadata',()=>{ document.getElementById('resText').textContent=`Çözünürlük: ${video.videoWidth}x${video.videoHeight}`; });
video.addEventListener('timeupdate',()=>{ if(video.videoWidth) document.getElementById('resText').textContent=`Çözünürlük: ${video.videoWidth}x${video.videoHeight}`; });
document.getElementById('fileInput').addEventListener('change',e=>{
const f=e.target.files[0]; if(!f)return; const r=new FileReader();
r.onload=ev=>{ let res=parseM3U(ev.target.result); if(res.channels.length){ all=res.channels; currentList=f.name.slice(0,20); saveAuto(); apply(); loadEPG(res.epgFrom||EPG_DEFAULT); toggleSettings(); document.getElementById('empty').style.display='none'; } };
r.readAsText(f);
});
document.getElementById('search').addEventListener('input',renderCh);
function setMain(cat){ mainCat=cat; document.querySelectorAll('#left.tabs.tab').forEach(t=>t.classList.toggle('active', t.textContent.includes(cat.toUpperCase()) || (cat==='Tümü'&&t.textContent==='Tümü'))); activeGroup='Tümü'; activeSub='Tümü'; buildGroups(); }
renderSaved();
if(Object.keys(saved).length){ let k=Object.keys(saved)[0]; all=saved[k]; currentList=k; apply(); loadEPG(EPG_DEFAULT); document.getElementById('empty').style.display='none'; }
</script>
</body>
</html>
