<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI FLIX</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0d14;color:#fff;font-family:Inter,Arial;overflow-x:hidden}
header{position:sticky;top:0;z-index:10;background:rgba(10,13,20,0.9);backdrop-filter:blur(10px);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #1a2230}
header h1{color:#e50914;font-size:22px;letter-spacing:2px;margin-right:10px}
.box{display:flex;gap:8px;align-items:center;background:#141a27;padding:8px 12px;border-radius:10px;border:1px solid #222}
.box input[type=text]{background:transparent;border:none;color:#fff;outline:none;width:260px}
.btn{background:#e50914;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:bold}
.btn:hover{background:#ff0a16}
input[type=file]{display:none}
#cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
.cat{white-space:nowrap;padding:6px 14px;background:#1a2230;border-radius:20px;cursor:pointer;font-size:13px;border:1px solid #222}
.cat.active{background:#e50914;border-color:#e50914}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:16px}
.card{background:#141a27;border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s;border:1px solid #1e293b;position:relative}
.card:hover{transform:scale(1.04);border-color:#e50914}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#0f141f;display:block}
.card.title{padding:8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.group{font-size:10px;color:#7a869a;padding:0 8px 8px}
#playerWrap{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:100;flex-direction:column}
#playerWrap.show{display:flex}
#player{flex:1;width:100%;background:#000}
#playerBar{padding:10px;display:flex;justify-content:space-between;align-items:center;background:#111}
</style>
</head>
<body>
<header>
<h1>MIRTI FLIX</h1>
<div class="box">
<label for="fileInput" style="cursor:pointer;color:#e50914;font-weight:bold">📁 DOSYA SEÇ</label>
<input type="file" id="fileInput" accept=".m3u,.m3u8,.txt">
</div>
<div class="box">
<input type="text" id="urlInput" placeholder="m3u linkini yapıştır...">
<button class="btn" onclick="loadFromUrl()">URL'DEN SEÇ</button>
</div>
<div class="box"><input type="text" id="search" placeholder="Film/Dizi ara..."></div>
</header>
<div id="cats"></div>
<div id="grid"></div>

<div id="playerWrap">
<div id="playerBar"><span id="now">Oynatılıyor</span><button class="btn" onclick="closePlayer()">KAPAT ✕</button></div>
<video id="player" controls autoplay></video>
</div>

<script>
const video=document.getElementById('player');
const grid=document.getElementById('grid');
const catsEl=document.getElementById('cats');
let all=[],filtered=[],activeCat='Tümü';

function parseM3U(text){
const lines=text.split('\n'); const out=[];
for(let i=0;i<lines.length;i++){
let l=lines[i].trim();
if(l.startsWith('#EXTINF')){
let logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||'';
let group=(l.match(/group-title="([^"]+)"/)||[])[1]||'Genel';
let name=l.split(',').pop().trim();
let url='';
for(let j=i+1;j<lines.length;j++){
let n=lines[j].trim(); if(n &&!n.startsWith('#')){url=n; i=j; break;}
}
if(url) out.push({name,logo,group,url});
}
}
return out;
}
function buildCats(){
const groups=['Tümü',...new Set(all.map(c=>c.group))];
catsEl.innerHTML=''; groups.forEach(g=>{
const b=document.createElement('div'); b.className='cat'+(g===activeCat?' active':''); b.textContent=g;
b.onclick=()=>{activeCat=g; document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active')); b.classList.add('active'); applyFilter();};
catsEl.appendChild(b);
});
}
function render(arr){
grid.innerHTML='';
arr.forEach(c=>{
const card=document.createElement('div'); card.className='card';
const img=c.logo||`https://via.placeholder.com/300x450?text=${encodeURIComponent(c.name)}`;
card.innerHTML=`<img class="poster" src="${img}" onerror="this.src='https://via.placeholder.com/300x450?text=No+Poster'"><div class="title">${c.name}</div><div class="group">${c.group}</div>`;
card.onclick=()=>play(c);
grid.appendChild(card);
});
}
function applyFilter(){
const q=document.getElementById('search').value.toLowerCase();
filtered=all.filter(c=>(activeCat==='Tümü'||c.group===activeCat)&&c.name.toLowerCase().includes(q));
render(filtered);
}
function play(c){
document.getElementById('playerWrap').classList.add('show');
document.getElementById('now').textContent=c.name;
if(Hls.isSupported()){ const hls=new Hls(); hls.loadSource(c.url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play()); }
else{ video.src=c.url; video.play(); }
}
function closePlayer(){ document.getElementById('playerWrap').classList.remove('show'); video.pause(); video.src=''; }
document.getElementById('fileInput').addEventListener('change',e=>{
const f=e.target.files[0]; if(!f)return; const r=new FileReader();
r.onload=ev=>{ all=parseM3U(ev.target.result); buildCats(); applyFilter(); }; r.readAsText(f);
});
function loadFromUrl(){
const url=document.getElementById('urlInput').value.trim(); if(!url)return alert('URL gir');
fetch(url).then(r=>r.text()).then(t=>{ all=parseM3U(t); buildCats(); applyFilter(); }).catch(()=>alert('URL yüklenemedi - CORS engeli. Dosya olarak indirip DOSYA SEÇ ile yükle.'));
}
document.getElementById('search').addEventListener('input',applyFilter);
</script>
</body>
</html>
