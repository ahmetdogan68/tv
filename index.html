<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI TV - CORS FIX</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070b14;color:#fff;font-family:Arial;display:flex;height:100vh;overflow:hidden}
#left{width:230px;background:#0b1120;border-right:2px solid #1e2d4a;display:flex;flex-direction:column}
#mid{width:360px;background:#0e1424;border-right:2px solid #1e2d4a;display:flex;flex-direction:column}
#playerArea{flex:1;background:#000;display:flex;flex-direction:column;position:relative}
#logoTop{padding:10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #1e2d4a;background:#080e1e}
#logoTop img{width:32px;height:32px;border-radius:6px;background:#000}
#logoTop h1{color:#ff0a16;font-size:14px}
.mainCats{display:flex;padding:5px;gap:3px;border-bottom:1px solid #1e2d4a}
.mainCat{flex:1;padding:7px;background:#151d32;border-radius:5px;text-align:center;cursor:pointer;font-size:10px;border:1px solid #1e2d4a}
.mainCat.active{background:#ff0a16}
#groupList{flex:1;overflow-y:auto;padding:6px}
.group{padding:9px;background:#151d32;margin:3px 0;border-radius:6px;cursor:pointer;font-size:12px;border:1px solid #1e2d4a;display:flex;justify-content:space-between}
.group.active{background:#ff0a16}
#channelList{flex:1;overflow-y:auto;padding:6px}
.ch{padding:7px;background:#1a2340;margin:4px 0;border-radius:6px;cursor:pointer;border:1px solid #1e2d4a;display:flex;gap:8px;align-items:center}
.ch.active{background:#ff0a16}
.ch img{width:36px;height:36px;border-radius:4px;background:#000;object-fit:contain}
#player{flex:1;width:100%;background:#000}
#bar{padding:8px;background:#0b1120;display:flex;justify-content:space-between;font-size:11px;border-top:1px solid #1e2d4a}
#resInfo{padding:6px 10px;background:#151d32;font-size:10px;color:#8aa;display:flex;justify-content:space-between;border-top:1px solid #1e2d4a}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070b14;z-index:10}
#empty img{width:180px}
#settings{position:absolute;top:0;right:0;bottom:0;width:330px;background:#0b1120;border-left:2px solid #ff0a16;z-index:20;transform:translateX(100%);transition:.3s;padding:10px}
#settings.open{transform:translateX(0)}
.btn{width:100%;padding:8px;background:#ff0a16;color:#fff;border:none;border-radius:5px;font-weight:bold;cursor:pointer;margin-top:4px;font-size:11px}
input{width:100%;padding:7px;border-radius:5px;border:1px solid #1e2d4a;background:#060a14;color:#fff;margin-top:4px;font-size:11px}
.tabs{display:flex;gap:4px;margin-top:6px}
.tab{flex:1;padding:6px;background:#1a2744;border-radius:5px;text-align:center;cursor:pointer;font-size:10px}
.tab.active{background:#ff0a16}
.box{display:none;margin-top:6px;padding:8px;background:#151d32;border-radius:6px;border:1px solid #1e2d4a}
.box.active{display:block}
</style>
</head>
<body>

<div id="left">
<div id="logoTop"><img src="logo.png" onerror="this.style.display='none'"><h1>MIRTI TV</h1><button onclick="toggleSet()" style="margin-left:auto;background:#1a2744;border:none;color:#fff;padding:4px 8px;border-radius:4px">⚙️</button></div>
<div class="mainCats"><div class="mainCat active" onclick="setMain('Tümü')">Tümü</div><div class="mainCat" onclick="setMain('Canlı')">CANLI</div><div class="mainCat" onclick="setMain('Film')">FİLM</div><div class="mainCat" onclick="setMain('Dizi')">DİZİ</div></div>
<div id="groupList"></div><div id="savedLists" style="padding:5px;border-top:1px solid #1e2d4a;max-height:80px;overflow-y:auto"></div>
</div>

<div id="mid">
<div style="padding:8px;background:#ff0a16;font-weight:bold;font-size:11px;display:flex;justify-content:space-between"><span id="midTitle">KANALLAR</span><span id="midCount">0</span></div>
<input id="search" placeholder="🔍 Ara..." style="margin:6px;width:95%"><div id="channelList"></div>
</div>

<div id="playerArea">
<div id="empty"><img src="logo.png"><h2 style="color:#ff0a16;margin-top:10px;letter-spacing:2px">MIRTI TV</h2><p style="font-size:10px;color:#5a6a8a;margin-top:6px">URL yerine DOSYA'dan yükle - CORS kalkar</p><button class="btn" style="width:200px;margin-top:10px" onclick="toggleSet()">⚙️ URL EKLE / DOSYA</button></div>
<video id="player" controls autoplay playsinline></video>
<div id="bar"><span id="now">Hazır</span><span id="pType" style="color:#ff0a16;font-size:10px">Hazır</span></div>
<div id="resInfo"><span id="resText">Çözünürlük: -</span><span id="epgInfo">EPG: -</span></div>

<div id="settings">
<div style="display:flex;justify-content:space-between"><b>AYARLAR - CORS FIX</b><button onclick="toggleSet()" style="background:#ff0a16;border:none;color:#fff;padding:4px 10px;border-radius:4px">X</button></div>
<div class="tabs"><div class="tab active" onclick="openTab(0)">URL</div><div class="tab" onclick="openTab(1)">XTREAM</div><div class="tab active" onclick="openTab(2)">DOSYA (ÖNERİLEN)</div></div>
<div class="box" id="b0"><input id="urlInput" placeholder="https://...m3u"><button class="btn" onclick="loadUrl()">YÜKLE (Proxy ile)</button><div style="font-size:9px;color:#8aa;margin-top:4px">GitHub linkleri otomatik proxy ile çekilecek</div></div>
<div class="box" id="b1"><input id="xHost" placeholder="http://host:port"><input id="xUser" placeholder="user"><input id="xPass" placeholder="pass"><button class="btn" onclick="loadXtream()">XTREAM</button></div>
<div class="box active" id="b2"><label for="fileInput" style="display:block;text-align:center;color:#0f0;border:1px dashed #0f0;padding:12px;border-radius:6px;cursor:pointer;font-weight:bold">📁 M3U DOSYASINI SEÇ<br><span style="font-size:10px;font-weight:normal">CORS hatası vermez</span></label><input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" style="display:none"></div>
<input id="epgInput" value="https://epgshare01.online/epgshare01/epg_ripper_TR1.xml"><button class="btn" style="background:#1a2744" onclick="loadEPG(document.getElementById('epgInput').value)">EPG</button>
<div id="status" style="font-size:10px;color:#0f0;margin-top:6px">CORS Fix Aktif - Kanal D/Star/Now düzeltildi</div>
</div>
</div>

<script>
let all=[]; let epg={}; let hls=null; let mpegPlayer=null; let mainCat='Tümü'; let activeGroup='Tümü'; let saved=JSON.parse(localStorage.getItem('MIRTI_FINAL')||'{}'); let currentList=''; const video=document.getElementById('player');
function toggleSet(){ document.getElementById('settings').classList.toggle('open'); }
function openTab(i){ document.querySelectorAll('.box').forEach((b,idx)=>b.classList.toggle('active',idx===i)); document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i)); }
function catOf(n,g){ let s=(n+' '+g).toLowerCase(); if(/film|movie|vod|sinema/.test(s))return 'Film'; if(/dizi|series|sezon|bolum|bölüm/.test(s))return 'Dizi'; return 'Canlı'; }
function parseM3U(text){ const lines=text.split(/\r?\n/); const out=[]; let tmp={name:'',group:'Genel',logo:'',tvgId:'',tvgName:''}; for(let l of lines){ l=l.trim(); if(!l)continue; if(l.startsWith('#EXTINF')){ tmp.name=l.split(',').pop().trim()||''; let gM=l.match(/group-title="([^"]+)"/); tmp.group=gM?gM[1].trim():'Genel'; tmp.logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||''; tmp.tvgId=(l.match(/tvg-id="([^"]+)"/)||[])[1]||''; tmp.tvgName=(l.match(/tvg-name="([^"]+)"/)||[])[1]||''; }else if(!l.startsWith('#')&&l.startsWith('http')){ if(!tmp.name) tmp.name='Kanal '+(out.length+1); out.push({name:tmp.name,group:tmp.group,logo:tmp.logo,tvgId:tmp.tvgId,tvgName:tmp.tvgName||tmp.name,cat:catOf(tmp.name,tmp.group),url:l}); tmp={name:'',group:'Genel',logo:'',tvgId:'',tvgName:''}; } } return out; }
// CORS FIX - 4 proxy deniyor, biri mutlaka açar
async function fetchWithProxy(url){
let proxies=[
url,
'https://corsproxy.io/?'+encodeURIComponent(url),
'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(url)
];
for(let p of proxies){
try{
let r=await fetch(p,{cache:'no-store'});
if(r.ok){ let t=await r.text(); if(t.length>200 && (t.includes('#EXTINF')||t.includes('#EXTM3U'))) return t; if(t.length>200) return t; }
}catch(e){}
}
throw 'CORS';
}
async function loadUrl(){
let url=document.getElementById('urlInput').value.trim(); if(!url)return;
document.getElementById('status').textContent='Proxy ile yükleniyor...';
try{
let txt=await fetchWithProxy(url);
let chans=parseM3U(txt);
if(chans.length){ all=chans; currentList=url.split('/').pop().slice(0,20); saveAuto(); apply(); loadEPG('https://epgshare01.online/epgshare01/epg_ripper_TR1.xml'); toggleSet(); document.getElementById('status').textContent=chans.length+' kanal yüklendi - CORS OK'; document.getElementById('empty').style.display='none'; }
else document.getElementById('status').textContent='M3U içinde kanal yok';
}catch(e){
document.getElementById('status').textContent='CORS hata - Lütfen DOSYA olarak yükle';
alert('GitHub CORS engelledi. Çözüm: M3U dosyasını indirip DOSYA sekmesinden seç');
}
}
async function loadXtream(){ let host=document.getElementById('xHost').value.trim().replace(/\/$/,''); let u=document.getElementById('xUser').value.trim(); let p=document.getElementById('xPass').value.trim(); if(!host||!u||!p)return; let m3u=`${host}/get.php?username=${u}&password=${p}&type=m3u_plus&output=mpegts`; try{ let txt=await fetchWithProxy(m3u); let chans=parseM3U(txt); if(chans.length){ all=chans; currentList='Xtream-'+u; saveAuto(); apply(); loadEPG('https://epgshare01.online/epgshare01/epg_ripper_TR1.xml'); toggleSet(); } }catch{} }
function saveAuto(){ if(!all.length)return; let name=currentList||'Liste '+(Object.keys(saved).length+1); saved[name]=all; localStorage.setItem('MIRTI_FINAL',JSON.stringify(saved)); renderSaved(); }
function renderSaved(){ const box=document.getElementById('savedLists'); box.innerHTML=''; Object.keys(saved).forEach(k=>{ let d=document.createElement('div'); d.style.cssText='padding:5px;background:#151d32;margin:2px 0;border-radius:5px;cursor:pointer;font-size:10px;display:flex;justify-content:space-between;border:1px solid #1e2d4a'+(k===currentList?';background:#ff0a16':''); d.innerHTML=`<span>📁 ${k} (${saved[k].length})</span><span onclick="delList('${k}')" style="color:#ff0a16">✕</span>`; d.onclick=()=>{ if(event.target.textContent!=='✕'){ all=saved[k]; currentList=k; apply(); } }; box.appendChild(d); }); }
function delList(k){ if(confirm(k+' sil?')){ delete saved[k]; localStorage.setItem('MIRTI_FINAL',JSON.stringify(saved)); renderSaved(); } }
function apply(){ document.getElementById('empty').style.display='none'; buildGroups(); }
function setMain(cat){ mainCat=cat; document.querySelectorAll('.mainCat').forEach(t=>t.classList.toggle('active', t.textContent.includes(cat))); activeGroup='Tümü'; buildGroups(); }
function buildGroups(){ let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat); let groups=['Tümü',...new Set(base.map(c=>c.group))].filter(Boolean); const box=document.getElementById('groupList'); box.innerHTML=''; groups.forEach(g=>{ let cnt=g==='Tümü'?base.length:base.filter(x=>x.group===g).length; let b=document.createElement('div'); b.className='group'+(activeGroup===g?' active':''); b.innerHTML=`<span>${g}</span><span style="background:#070b14;padding:2px 6px;border-radius:10px;font-size:10px">${cnt}</span>`; b.onclick=()=>{ activeGroup=g; document.querySelectorAll('.group').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderCh(); }; box.appendChild(b); }); renderCh(); }
function renderCh(){ let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat); let list=base.filter(c=>activeGroup==='Tümü'||c.group===activeGroup); let q=document.getElementById('search').value.toLowerCase(); if(q) list=list.filter(c=>c.name.toLowerCase().includes(q)); const box=document.getElementById('channelList'); box.innerHTML=''; document.getElementById('midTitle').textContent=activeGroup; document.getElementById('midCount').textContent=list.length; list.forEach(c=>{ let prog=epg[c.tvgId]||epg[c.tvgName]||epg[c.name]||null; let d=document.createElement('div'); d.className='ch'; d.innerHTML=`<img src="${c.logo}" onerror="this.src='https://via.placeholder.com/36x36/0b1120/ff0a16?text=TV'"><div style="flex:1;overflow:hidden"><div style="font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.name}</div><div style="font-size:10px;color:#8aa;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${prog? '▶ '+prog.now : c.group}</div></div>`; d.onclick=()=>{ document.querySelectorAll('.ch').forEach(x=>x.classList.remove('active')); d.classList.add('active'); playChannel(c); }; box.appendChild(d); }); }

function playChannel(c){
document.getElementById('empty').style.display='none';
document.getElementById('now').textContent=c.name;
document.getElementById('pType').textContent='Yükleniyor...';
if(hls){try{hls.destroy()}catch(e){} hls=null;}
if(mpegPlayer){try{mpegPlayer.destroy()}catch(e){} mpegPlayer=null;}
video.pause(); video.removeAttribute('src'); video.load();
let prog=epg[c.tvgId]||epg[c.tvgName]||epg[c.name]; document.getElementById('epgInfo').textContent=prog? '▶ '+prog.now : c.group;

let url=c.url;
// KANAL D STAR NOW için düzeltilmiş linkleri otomatik düzelt
if(url.includes('demiroren.daioncdn.net/kanald/kanald.m3u8')) url='https://demiroren-live.daioncdn.net/kanald/kanald_1080p.m3u8';
if(url.includes('dogus.daioncdn.net/startv/startv_720p.m3u8')) url='https://dogus-live.daioncdn.net/startv/startv.m3u8';
if(url.includes('tecostream.xyz/now.m3u8')||url.includes('dogus.tecostream')) url='https://uycyyuuzyh.turknet.ercdn.net/nphindgytw/nowtv/nowtv.m3u8';
if(url.startsWith('http://')) url='https://corsproxy.io/?'+encodeURIComponent(url);

if(c.url.includes('.ts')||c.url.includes('live.php')){
if(mpegts.isSupported()){
mpegPlayer=mpegts.createPlayer({type:'mse', isLive:true, url:url},{liveBufferLatencyChasing:true});
mpegPlayer.attachMediaElement(video); mpegPlayer.load();
mpegPlayer.play().then(()=>{ document.getElementById('pType').textContent='MPEG-TS'; document.getElementById('resText').textContent='Live TS'; }).catch(()=>{ tryHls(url,c.url); });
return;
}
}
tryHls(url,c.url);
}
function tryHls(url,orig){
if(Hls.isSupported()){
hls=new Hls(); hls.loadSource(url); hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>{ video.play().then(()=>{ document.getElementById('pType').textContent='HLS.js - Açıldı'; }).catch(()=>{}); });
hls.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal){ // fail olursa proxy ile tekrar dene
if(url===orig){ let pUrl='https://corsproxy.io/?'+encodeURIComponent(orig); tryHls(pUrl,orig); }
}});
}else{ video.src=url; video.play(); }
}
async function loadEPG(url){ try{ let txt=await fetchWithProxy(url); let parser=new DOMParser(); let xml=parser.parseFromString(txt,'text/xml'); let progs=xml.querySelectorAll('programme'); let now=new Date(); let tmp={}; let cnt=0; progs.forEach(p=>{ let ch=p.getAttribute('channel'); let s=p.getAttribute('start'); let title=p.querySelector('title')?.textContent||''; if(!ch||!s)return; let y=parseInt(s.substring(0,4)), mo=parseInt(s.substring(4,6))-1, d=parseInt(s.substring(6,8)), h=parseInt(s.substring(8,10)), mi=parseInt(s.substring(10,12)); let sDate=new Date(y,mo,d,h,mi); if(Math.abs(sDate-now)<4*60*60*1000){ tmp[ch]={now:title}; cnt++; } }); epg=tmp; document.getElementById('epgInfo').textContent='EPG: '+cnt; renderCh(); }catch{} }
video.addEventListener('loadedmetadata',()=>{ if(video.videoWidth) document.getElementById('resText').textContent=`Çözünürlük: ${video.videoWidth}x${video.videoHeight}`; });
document.getElementById('fileInput').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{ let chans=parseM3U(ev.target.result); if(chans.length){ all=chans; currentList=f.name.slice(0,20); saveAuto(); apply(); loadEPG('https://epgshare01.online/epgshare01/epg_ripper_TR1.xml'); toggleSet(); document.getElementById('empty').style.display='none'; document.getElementById('status').textContent=chans.length+' kanal dosyadan yüklendi - CORS yok'; } }; r.readAsText(f); });
document.getElementById('search').addEventListener('input',renderCh);
renderSaved();
</script>
</body>
</html>
