<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070b14;color:#fff;font-family:Arial;height:100vh;display:flex;overflow:hidden}
#left{width:260px;min-width:260px;background:#0b1120;border-right:2px solid #ff0a16;display:flex;flex-direction:column}

#groupList{flex:1;overflow-y:auto;padding:6px}.group{padding:10px;background:#1a2340;margin:4px 0;border-radius:6px;cursor:pointer;font-size:12px;border:1px solid #1e2d4a;display:flex;justify-content:space-between}.group.active{background:#ff0a16}
#channelList{flex:1;overflow-y:auto;padding:6px}.ch{padding:10px;background:#1a2340;margin:4px 0;border-radius:8px;cursor:pointer;border:1px solid #1e2d4a;display:flex;gap:10px;align-items:center}.ch.active{background:#ff0a16}.ch img{width:42px;height:42px;border-radius:6px;background:#000;object-fit:contain}
#player{flex:1;width:100%;background:#000}#bar{padding:8px;background:#0b1120;display:flex;justify-content:space-between;font-size:11px;border-top:1px solid #1e2d4a}

#settings{position:absolute;top:0;right:0;bottom:0;width:430px;background:#0b1120;border-left:3px solid #ff0a16;z-index:20;transform:translateX(100%);transition:.3s;padding:12px;overflow-y:auto}#settings.open{transform:translateX(0)}
.tabs{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.tab{flex:1;min-width:60px;padding:10px;background:#1a2744;border-radius:6px;text-align:center;cursor:pointer;font-size:11px}.tab.active{background:#ff0a16}

input{width:100%;padding:10px;border-radius:6px;border:1px solid #1e2d4a;background:#060a14;color:#fff;margin-top:5px}.btn{width:100%;padding:12px;background:#ff0a16;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:6px}
.epg{font-size:10px;color:#0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
@media(max-width:900px){body{flex-direction:column}#playerArea{order:1;height:35vh;min-height:220px}#left{order:2;width:100%;min-width:100%;height:28vh;border-right:none;border-top:2px solid #ff0a16}#mid{order:3;width:100%;min-width:100%;height:40vh;border-right:none;border-top:2px solid #1e2d4a}#settings{width:100%}}
</style>

<body>
<div id="left">
<div id="logoTop"><b style="color:#ff0a16">MIRTI V6</b><button onclick="toggleSet()" style="margin-left:auto;background:#ff0a16;border:none;color:#fff;padding:6px 10px;border-radius:4px">⚙️</button></div>

</div>

</div>
<div id="playerArea">

<script>
const MY_PROXY = 'https://hidden-meadow-0d62.a-dogan.workers.dev';
let all=[]; let hls=null; let mpegPlayer=null; let mainCat='Tümü'; let activeGroup='Tümü'; let currentList=''; const video=document.getElementById('player');
let db; let epgData={};
const NATIONAL_REFS = {'kanal d':'https://www.kanald.com.tr/','star':'https://www.startv.com.tr/','show':'https://www.showtv.com.tr/','atv':'https://www.atv.com.tr/','tv8':'https://www.tv8.com.tr/','ntv':'https://www.ntv.com.tr/','szc':'https://www.sozcu.com.tr/','sözcü':'https://www.sozcu.com.tr/','krt':'https://www.krttv.com.tr/','koza':'https://www.kozatv.com.tr/','tele1':'https://tele1.com.tr/'};
function getNationalRef(name){ let low=name.toLowerCase(); for(let k in NATIONAL_REFS){ if(low.includes(k)) return NATIONAL_REFS[k]; } return ''; }
function isBlockedByBrowser(url){ if(!url) return false; if(url.startsWith('http://')) return true; if(/:\d{2,5}\//.test(url)) return true; if(/\d+\.\d+\.\d+\.\d+/.test(url)) return true; if(url.includes('/play/')) return true; return false; }
function isRawTS(url){
  if(!url) return false;
  let low=url.toLowerCase();
  if(low.includes('.m3u8')) return false;
  if(low.includes('.mp4')) return false;
  if(low.includes('extension=ts')) return true;
  if(low.includes('/play/')) return true;
  if(/:\d{2,5}\//.test(url)) return true;
  if(/\d+\.\d+\.\d+\.\d+/.test(url)) return true;
  if(/\/[a-z0-9]{3,8}(\?.*)?$/.test(url) &&!low.includes('.m3u')) return true;
  return false;
}
function openDB(){return new Promise((res)=>{let req=indexedDB.open('MirtiTV_V6',1);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('lists'))d.createObjectStore('lists',{keyPath:'name'});};req.onsuccess=e=>{db=e.target.result;res(db);};});}
async function saveToDB(name, channels){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readwrite');tx.objectStore('lists').put({name,channels,count:channels.length});tx.oncomplete=()=>r();});}
async function getAllFromDB(){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readonly');let q=tx.objectStore('lists').getAll();q.onsuccess=()=>r(q.result);});}
async function deleteFromDB(name){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readwrite');tx.objectStore('lists').delete(name);tx.oncomplete=()=>r();});}
function toggleSet(){document.getElementById('settings').classList.toggle('open');}
function openTab(i){document.querySelectorAll('.box').forEach((b,idx)=>b.classList.toggle('active',idx===i));document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));}
function catOf(n,g){let s=(n+' '+g).toLowerCase();if(/film|movie|vod/.test(s))return 'Film';if(/dizi|series/.test(s))return 'Dizi';return 'Canlı';}
function splitPipe(url){if(!url.includes('|')) return {url, headers:{}};let [base, query]=url.split('|');let headers={};query.split('&').forEach(p=>{let [k,v]=p.split('=');if(k&&v) headers[k.trim().toLowerCase()]=decodeURIComponent(v.trim());});return {url:base.trim(), headers};}
function cleanUrl(u){
  if(!u) return '';
  u=u.trim();
  // KRT gibi sonda boşlukla gelen play_token fix
  u=u.replace(/\s+/g,'');
  return u;
}
function parseM3U(text){
  const lines=text.split(/\r?\n/); const out=[]; let tmp={name:'',group:'Genel',logo:'',referrer:'',tvgId:''}; let lastRef='';
  for(let l of lines){l=l.trim();if(!l)continue;
    if(l.startsWith('#EXTVLCOPT:http-referrer=')){lastRef=l.split('=')[1]||'';continue;}
    if(l.startsWith('#EXTM3U')){ let epgUrlMatch=l.match(/x-tvg-url="([^"]+)"/)||l.match(/url-tvg="([^"]+)"/); if(epgUrlMatch &&!document.getElementById('epgUrl').value) document.getElementById('epgUrl').value=epgUrlMatch[1]; }
    if(l.startsWith('#EXTINF')){
      tmp.name=l.split(',').pop().trim()||''; let gM=l.match(/group-title="([^"]+)"/); tmp.group=gM?gM[1].trim():'Genel'; tmp.logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||''; tmp.tvgId=(l.match(/tvg-id="([^"]+)"/)||[])[1]||'';
      let r1=(l.match(/http-referrer="([^"]+)"/)||[])[1]||''; let r2=(l.match(/referrer="([^"]+)"/)||[])[1]||''; tmp.referrer=r1||r2||lastRef||''; if(lastRef) lastRef='';
    }else if(!l.startsWith('#')&&l.startsWith('http')){
      if(!tmp.name) tmp.name='Kanal '+(out.length+1);
      l=cleanUrl(l);
      let parsed=splitPipe(l);
      let finalUrl=cleanUrl(parsed.url);
      out.push({name:tmp.name,group:tmp.group,logo:tmp.logo,tvgId:tmp.tvgId,cat:catOf(tmp.name,tmp.group),url:finalUrl,referrer:tmp.referrer||parsed.headers.referrer||parsed.headers.referer||''});
      tmp={name:'',group:'Genel',logo:'',referrer:'',tvgId:''};
    }
  } return {channels:out};
}
async function fetchDirect(url){try{let r=await fetch(url,{cache:'no-store'});if(r.ok){let t=await r.text();if(t.length>50) return t;}}catch(e){}const ps=['https://api.allorigins.win/raw?url='+encodeURIComponent(url),'https://corsproxy.io/?'+encodeURIComponent(url), `${MY_PROXY}/?url=${encodeURIComponent(url)}`];for(let p of ps){try{let r=await fetch(p);if(r.ok){let t=await r.text();if(t.length>50) return t;}}catch(e){}}throw 'CORS';}
async function loadUrl(){let u=document.getElementById('urlInput').value.trim();if(!u) return alert('Link yapıştır'); let st=document.getElementById('status');st.textContent='Yükleniyor...';try{let txt=await fetchDirect(u);let res=parseM3U(txt);if(res.channels.length){all=res.channels;currentList=u.split('/').pop().slice(0,25);await saveToDB(currentList, all);await renderSaved();apply();document.getElementById('empty').style.display='none';st.textContent=res.channels.length+' kanal';toggleSet();}else{st.textContent='Kanal yok';}}catch(e){st.textContent='Yüklenemedi: '+e;}}
async function renderSaved(){let lists=await getAllFromDB();const box=document.getElementById('savedLists');box.innerHTML='';lists.forEach(item=>{let d=document.createElement('div');d.style.cssText='padding:6px;background:#1a2340;margin:3px 0;border-radius:5px;display:flex;justify-content:space-between;border:1px solid #1e2d4a'+(item.name===currentList?';background:#ff0a16':'');d.innerHTML=`<span>📁 ${item.name} (${item.count})</span><span onclick="event.stopPropagation();delList('${item.name}')" style="color:#ff0a16">✕</span>`;d.onclick=()=>{all=item.channels;currentList=item.name;apply();document.getElementById('empty').style.display='none';toggleSet();};box.appendChild(d);});}
async function delList(k){if(confirm(k+' sil?')){await deleteFromDB(k);await renderSaved();}}
function apply(){buildGroups();}
function setMain(cat){mainCat=cat;document.querySelectorAll('.mainCat').forEach(t=>t.classList.toggle('active',t.textContent.includes(cat)));activeGroup='Tümü';buildGroups();}
function buildGroups(){
  let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat);
  let groups=['Tümü',...new Set(base.map(c=>c.group))].filter(Boolean);
  const box=document.getElementById('groupList'); box.innerHTML='';
  if(all.length===0){box.innerHTML='<div style="padding:10px;text-align:center;color:#5a6a8a;font-size:10px">Liste ekle</div>';document.getElementById('groupCount').textContent='0';return;}
  document.getElementById('groupCount').textContent=groups.length-1;
  groups.forEach(g=>{
    let cnt=g==='Tümü'?base.length:base.filter(x=>x.group===g).length;
    let b=document.createElement('div'); b.className='group'+(activeGroup===g?' active':''); b.innerHTML=`<span>${g}</span><span style="background:#070b14;padding:2px 6px;border-radius:10px">${cnt}</span>`;
    b.onclick=()=>{activeGroup=g;document.querySelectorAll('.group').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderCh();};
    box.appendChild(b);
  });
  renderCh();
}
function getEPGTitle(c){ if(!c.tvgId) return ''; let list=epgData[c.tvgId]||epgData[c.name]||[]; return list[0]?.title||''; }
function renderCh(){
  let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat);
  let list=base.filter(c=>activeGroup==='Tümü'||c.group===activeGroup);
  let q=document.getElementById('search').value.toLowerCase(); if(q) list=list.filter(c=>c.name.toLowerCase().includes(q));
  const box=document.getElementById('channelList'); box.innerHTML='';
  document.getElementById('midTitle').textContent=activeGroup; document.getElementById('midCount').textContent=list.length;
  list.forEach(c=>{
    let epg=getEPGTitle(c);
    let d=document.createElement('div'); d.className='ch';
    d.innerHTML=`<img src="${c.logo}" onerror="this.src='https://via.placeholder.com/42/0b1120/ff0a16?text=TV'"><div style="flex:1;min-width:0"><div style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold">${c.name}</div><div style="font-size:10px;color:#8aa">${c.group} ${c.referrer?'•Ref':''} ${isBlockedByBrowser(c.url)?'•Worker':''} ${isRawTS(c.url)?'•TS':''}</div>${epg?`<div class="epg">▶ ${epg}</div>`:''}</div><span>▶</span>`;
    d.onclick=()=>{document.querySelectorAll('.ch').forEach(x=>x.classList.remove('active'));d.classList.add('active');playV6(c);};
    box.appendChild(d);
  });
}
function playV6(c){
  document.getElementById('empty').style.display='none';
  document.getElementById('now').textContent=c.name;
  let epg=getEPGTitle(c); document.getElementById('epgNow').textContent=epg?' | '+epg:'';
  if(hls){try{hls.destroy()}catch(e){} hls=null;}
  if(mpegPlayer){try{mpegPlayer.destroy()}catch(e){} mpegPlayer=null;}
  video.pause(); video.removeAttribute('src'); video.load();
  let ref=c.referrer||getNationalRef(c.name)||'';
  let url=cleanUrl(c.url);
  let blocked=isBlockedByBrowser(url);
  let raw=isRawTS(url);
  let attempts=[];
  if(ref){
    attempts.push(`${MY_PROXY}/?url=${encodeURIComponent(url)}&ref=${encodeURIComponent(ref)}`);
    attempts.push(`${MY_PROXY}/?url=${encodeURIComponent(url)}&ref=https://patronsaha.cfd/`);
    attempts.push(url);
  }else if(blocked||raw){
    attempts.push(`${MY_PROXY}/?url=${encodeURIComponent(url)}`);
    attempts.push(`${MY_PROXY}/?url=${encodeURIComponent(url.replace('http://','https://'))}`);
    attempts.push(url);
    attempts.push(url.replace('http://','https://'));
  }else{
    attempts.push(url);
    attempts.push(url.replace('http://','https://'));
    attempts.push(`${MY_PROXY}/?url=${encodeURIComponent(url)}`);
  }
  tryPlay(attempts,0,c,ref,raw);
}
function tryPlay(list, idx, c, ref, raw){
  if(idx>=list.length){ document.getElementById('pType').textContent='Açılamadı'; return; }
  let finalUrl=list[idx];
  document.getElementById('pType').textContent=`Deneniyor ${idx+1}/${list.length} ${raw?'TS': ref?'Ref':''}`;
  if(raw && mpegts.isSupported()){
    try{
      if(mpegPlayer){try{mpegPlayer.destroy()}catch(e){}}
      mpegPlayer=mpegts.createPlayer({type:'mpegts',isLive:true,url:finalUrl},{enableWorker:true,enableStashBuffer:false,stashInitialSize:128,liveBufferLatencyChasing:true});
      mpegPlayer.attachMediaElement(video); mpegPlayer.load(); mpegPlayer.play();
      let failed=false;
      mpegPlayer.on(mpegts.Events.MEDIA_INFO,()=>{ if(!failed){ video.play(); document.getElementById('pType').textContent='✅ Oynatılıyor TS'; }});
      mpegPlayer.on(mpegts.Events.ERROR,()=>{ failed=true; try{mpegPlayer.destroy()}catch(e){} tryPlay(list, idx+1, c, ref, raw); });
      setTimeout(()=>{ if(video.readyState===0 &&!failed){ try{mpegPlayer.destroy()}catch(e){} tryPlay(list, idx+1, c, ref, raw); } }, 7000);
      return;
    }catch(e){}
  }
  class SmartLoader extends Hls.DefaultConfig.loader{
    load(context, config, callbacks){
      let u=context.url;
      if(!u.includes(MY_PROXY) &&!u.startsWith('data:') &&!u.startsWith('blob:')){
        if(u.startsWith('http://') || /\d+\.\d+\.\d+\.\d+/.test(u) || u.includes('/play/') || u.includes('live.php')){
          let r=ref||getNationalRef(c.name)||'';
          context.url=r? `${MY_PROXY}/?url=${encodeURIComponent(u)}&ref=${encodeURIComponent(r)}` : `${MY_PROXY}/?url=${encodeURIComponent(u)}`;
        }else if(ref){
          context.url=`${MY_PROXY}/?url=${encodeURIComponent(u)}&ref=${encodeURIComponent(ref)}`;
        }
      }
      super.load(context, config, callbacks);
    }
  }
  if(Hls.isSupported()){
    hls=new Hls({enableWorker:true,loader:SmartLoader,lowLatencyMode:false});
    hls.loadSource(finalUrl);
    hls.attachMedia(video);
    let to=setTimeout(()=>{ hls.destroy(); tryPlay(list, idx+1, c, ref, raw); }, 10000);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{ clearTimeout(to); video.play().then(()=>{document.getElementById('pType').textContent='✅ '+c.name;}); });
    hls.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal){ clearTimeout(to); hls.destroy(); tryPlay(list, idx+1, c, ref, raw); } });
  }else{
    video.src=finalUrl; video.play().then(()=>{document.getElementById('pType').textContent='✅ Oynatılıyor';}).catch(()=>{ tryPlay(list, idx+1, c, ref, raw); });
  }
}
async function loadXtream(){
  let server=document.getElementById('xtServer').value.trim().replace(/\/$/,'');
  let user=document.getElementById('xtUser').value.trim();
  let pass=document.getElementById('xtPass').value.trim();
  let info=document.getElementById('xtInfo');
  if(!server||!user||!pass){ alert('Server, kullanıcı, şifre gir'); return; }
  info.textContent='Xtream yükleniyor...';
  try{
    // Kategoriler
    let catUrl=`${server}/player_api.php?username=${user}&password=${pass}&action=get_live_categories`;
    let catText=await fetchDirect(`${MY_PROXY}/?url=${encodeURIComponent(catUrl)}`);
    let cats=JSON.parse(catText);
    // Kanallar
    let liveUrl=`${server}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`;
    let liveText=await fetchDirect(`${MY_PROXY}/?url=${encodeURIComponent(liveUrl)}`);
    let streams=JSON.parse(liveText);
    let catMap={}; cats.forEach(c=>catMap[c.category_id]=c.category_name);
    let channels=[];
    streams.forEach(s=>{
      let group=catMap[s.category_id]||'XTREAM';
      let streamId=s.stream_id;
      // HLS öncelikli
      let url=`${server}/live/${user}/${pass}/${streamId}.m3u8`;
      let urlTs=`${server}/live/${user}/${pass}/${streamId}.ts`;
      channels.push({name:s.name, group:group, logo:s.stream_icon||'', tvgId:'', cat:'Canlı', url:url, urlTs:urlTs, referrer:''});
    });
    if(channels.length>0){
      all=channels; currentList='XTREAM '+server.slice(0,15);
      await saveToDB(currentList, all); await renderSaved(); apply();
      document.getElementById('empty').style.display='none';
      info.textContent=channels.length+' kanal Xtream yüklendi ✅';
      document.getElementById('status').textContent='XTREAM OK';
      toggleSet();
    }else{ info.textContent='Kanal bulunamadı'; }
  }catch(e){ info.textContent='Xtream hata: '+e.message; }
}
async function loadEPG(){
  let url=document.getElementById('epgUrl').value.trim(); if(!url) return alert('EPG link gir');
  let info=document.getElementById('epgInfo'); info.textContent='EPG yükleniyor...';
  try{
    let xmlText=await fetchDirect(url);
    let parser=new DOMParser(); let xml=parser.parseFromString(xmlText,"text/xml");
    epgData={};
    xml.querySelectorAll('programme').forEach(p=>{
      let ch=p.getAttribute('channel'); let title=p.querySelector('title')?.textContent||'';
      if(!epgData[ch]) epgData[ch]=[]; epgData[ch].push({title, start:p.getAttribute('start')});
    });
    info.textContent=Object.keys(epgData).length+' kanal EPG ✅';
    document.getElementById('status').textContent='EPG OK';
    renderCh();
  }catch(e){ info.textContent='EPG hata: '+e; }
}
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async ev=>{
    let res=parseM3U(ev.target.result);
    if(res.channels.length){ all=res.channels; currentList=f.name.slice(0,20); await saveToDB(currentList,all); await renderSaved(); apply(); document.getElementById('empty').style.display='none'; toggleSet(); document.getElementById('status').textContent=res.channels.length+' kanal'; }
  };
  r.readAsText(f);
});
document.getElementById('search').addEventListener('input',renderCh);
(async()=>{await openDB();await renderSaved(); buildGroups();})();
</script>
