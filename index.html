<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial;display:flex;height:100vh}
#sidebar{width:320px;background:#111;border-right:1px solid #222;display:flex;flex-direction:column}
#sidebar h2{color:#ff0000;text-align:center;padding:14px;letter-spacing:2px}
.box{padding:10px;background:#1a1a1a;margin:8px;border-radius:10px;border:1px solid #222}
.btn{width:100%;padding:10px;background:#ff0000;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin-top:6px}
.btn2{background:#222;border:1px dashed #ff0000;color:#ff0000}
input[type=file]{display:none}input[type=text]{width:100%;padding:10px;border-radius:6px;border:none;background:#222;color:#fff;margin-top:6px}
#list{flex:1;overflow-y:auto;padding:10px}
.channel{padding:10px;background:#1e1e1e;margin:5px 0;border-radius:6px;cursor:pointer;font-size:14px}
.channel:hover,.channel.active{background:#ff0000}
#main{flex:1;display:flex;flex-direction:column;background:#000}
#player{flex:1;width:100%}#info{padding:10px;background:#111;text-align:center;font-size:12px}
label{cursor:pointer;display:block;text-align:center;color:#ff0000;font-weight:bold;padding:6px}
</style>
</head>
<body>
<div id="sidebar">
<h2>MIRTI TV</h2>

<div class="box">
<label for="fileInput">📁 DOSYA SEÇ</label>
<input type="file" id="fileInput" accept=".m3u,.m3u8,.txt">
</div>

<div class="box">
<div style="text-align:center;font-size:12px;color:#888;margin-bottom:4px">🔗 URL'DEN SEÇ</div>
<input type="text" id="urlInput" placeholder="https://.../playlist.m3u8 yapıştır">
<button class="btn" onclick="loadFromUrl()">URL'DEN YÜKLE</button>
</div>

<input type="text" id="search" placeholder="Kanal ara..." style="width:92%;margin:8px 4%;">

<div id="list">Liste yükle, kanallar burada</div>
</div>

<div id="main">
<video id="player" controls autoplay></video>
<div id="info">MIRTI - Dosya veya URL ile yükle</div>
</div>

<script>
const video=document.getElementById('player');
const listEl=document.getElementById('list');
let allChannels=[];
function parseM3U(text){
const lines=text.split('\n'); const channels=[];
for(let i=0;i<lines.length;i++){
let line=lines[i].trim();
if(line.startsWith('#EXTINF')){
let name=line.split(',').pop().trim();
let url='';
for(let j=i+1;j<lines.length;j++){
let next=lines[j].trim();
if(next &&!next.startsWith('#')){url=next; i=j; break;}
}
if(url)channels.push({name:name||'Bilinmeyen Kanal',url:url});
}
}
return channels;
}
function render(arr){
listEl.innerHTML='';
arr.forEach(c=>{
const d=document.createElement('div'); d.className='channel'; d.textContent=c.name;
d.onclick=()=>play(c,d); listEl.appendChild(d);
});
}
function play(c,el){
document.querySelectorAll('.channel').forEach(e=>e.classList.remove('active'));
if(el)el.classList.add('active');
document.getElementById('info').textContent='Oynatılıyor: '+c.name;
if(Hls.isSupported()){
const hls=new Hls(); hls.loadSource(c.url); hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{ video.src=c.url; video.play(); }
}
document.getElementById('fileInput').addEventListener('change',e=>{
const file=e.target.files[0]; if(!file)return;
const r=new FileReader();
r.onload=ev=>{ allChannels=parseM3U(ev.target.result); document.getElementById('info').textContent=allChannels.length+' kanal yüklendi'; render(allChannels); };
r.readAsText(file);
});
function loadFromUrl(){
const url=document.getElementById('urlInput').value.trim();
if(!url){alert('URL gir abi');return;}
document.getElementById('info').textContent='URL yükleniyor...';
fetch(url).then(res=>res.text()).then(text=>{
allChannels=parseM3U(text);
document.getElementById('info').textContent=allChannels.length+' kanal yüklendi';
render(allChannels);
}).catch(()=>{ document.getElementById('info').textContent='URL yüklenemedi, CORS engeli olabilir. Dosya olarak indirip dene.'; });
}
document.getElementById('search').addEventListener('input',e=>{
const q=e.target.value.toLowerCase();
render(allChannels.filter(c=>c.name.toLowerCase().includes(q)));
});
</script>
</body>
</html>
