<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MIRTI V7 VLC</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#070b14;color:#fff;font-family:Arial;height:100vh;display:flex;overflow:hidden}#left{width:260px;min-width:260px;background:#0b1120;border-right:2px solid #ff0a16;display:flex;flex-direction:column}#mid{width:340px;min-width:340px;background:#0e1424;border-right:2px solid #1e2d4a;display:flex;flex-direction:column}#playerArea{flex:1;background:#000;display:flex;flex-direction:column;position:relative;min-width:300px}#logoTop{padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #1e2d4a;background:#080e1e}.mainCat{flex:1;padding:8px;background:#151d32;margin:2px;border-radius:5px;text-align:center;cursor:pointer;font-size:11px;border:1px solid #1e2d4a}.mainCat.active{background:#ff0a16}#groupList{flex:1;overflow-y:auto;padding:6px}.group{padding:10px;background:#1a2340;margin:4px 0;border-radius:6px;cursor:pointer;font-size:12px;border:1px solid #1e2d4a;display:flex;justify-content:space-between}.group.active{background:#ff0a16}#channelList{flex:1;overflow-y:auto;padding:6px}.ch{padding:10px;background:#1a2340;margin:4px 0;border-radius:8px;cursor:pointer;border:1px solid #1e2d4a;display:flex;gap:10px;align-items:center}.ch.active{background:#ff0a16}.ch img{width:42px;height:42px;border-radius:6px;background:#000;object-fit:contain;border:1px solid #2a3a5a}#player{flex:1;width:100%;background:#000}#bar{padding:8px;background:#0b1120;display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-top:1px solid #1e2d4a}#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070b14;z-index:10;padding:20px;text-align:center}#settings{position:absolute;top:0;right:0;bottom:0;width:430px;background:#0b1120;border-left:3px solid #ff0a16;z-index:20;transform:translateX(100%);transition:.3s;padding:12px;overflow-y:auto}#settings.open{transform:translateX(0)}.tabs{display:flex;gap:4px;margin-top:8px}.tab{flex:1;padding:10px;background:#1a2744;border-radius:6px;text-align:center;cursor:pointer;font-size:11px}.tab.active{background:#ff0a16}.box{display:none;margin-top:8px;padding:10px;background:#151d32;border-radius:8px;border:1px solid #1e2d4a}.box.active{display:block}input{width:100%;padding:10px;border-radius:6px;border:1px solid #1e2d4a;background:#060a14;color:#fff;margin-top:5px}.btn{width:100%;padding:12px;background:#ff0a16;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:6px}.btnVLC{background:#ff8c00}.vlcBar{display:flex;gap:6px;padding:6px;background:#151d32;border-top:1px solid #1e2d4a}@media(max-width:900px){body{flex-direction:column}#playerArea{order:1;height:38vh;min-height:240px}#left{order:2;width:100%;height:28vh;border-right:none;border-top:2px solid #ff0a16}#mid{order:3;width:100%;height:40vh;border-right:none;border-top:2px solid #1e2d4a}#settings{width:100%}}</style></head><body><div id="left"><div id="logoTop"><b>MIRTI</b><b style="color:#ff0a16">TV</b><span style="font-size:9px;color:#8aa;margin-left:6px">V7 VLC</span><button onclick="toggleSet()" style="margin-left:auto;background:#ff0a16;border:none;color:#fff;padding:6px 10px;border-radius:4px">⚙️</button></div><div style="display:flex;padding:6px;gap:4px"><div class="mainCat active" onclick="setMain('Tümü')">Tümü</div><div class="mainCat" onclick="setMain('Canlı')">CANLI</div><div class="mainCat" onclick="setMain('Film')">FİLM</div><div class="mainCat" onclick="setMain('Dizi')">DİZİ</div></div><div style="padding:6px;background:#151d32;font-size:10px;color:#0f0;display:flex;justify-content:space-between"><span id="proxyStatus">V7 VLC READY</span><span id="groupCount">0</span></div><div id="groupList"></div></div><div id="mid"><div style="padding:10px;background:#ff0a16;font-weight:bold;display:flex;justify-content:space-between"><span id="midTitle">KANALLAR</span><span id="midCount">0</span></div><input id="search" placeholder="🔍 Ara..." style="margin:6px;width:94%"><div id="channelList"></div></div><div id="playerArea"><div id="empty"><h3 style="color:#0f0">V7 VLC MOD</h3><p style="font-size:11px;color:#8aa;margin-top:8px">Açılmayan kanal = VLC ile aç<br/>Kanal D, ATV, SHOW, NOW, Zeus için VLC şart</p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="width:160px" onclick="toggleSet()">⚙️ LİSTE EKLE</button><button class="btn btnVLC" style="width:160px" onclick="openVLC(currentUrl)">📺 VLC ile AÇ</button></div></div><video id="player" controls playsinline></video><div class="vlcBar"><button class="btn btnVLC" style="padding:8px" onclick="openVLC(currentUrl)">📺 VLC ile Aç (Telefonda)</button><button class="btn" style="padding:8px;background:#222" onclick="copyUrl(currentUrl)">🔗 Linki Kopyala</button></div><div id="bar"><span id="now">Hazır</span><span id="pType">V7</span><span id="pInfo" style="color:#ff8c00;font-size:10px;flex:1;text-align:right"></span></div><div id="settings"><div style="display:flex;justify-content:space-between"><b style="color:#0f0">V7 VLC AYAR</b><button onclick="toggleSet()" style="background:#ff0a16;border:none;color:#fff;padding:6px 12px;border-radius:4px">X</button></div><div id="savedLists" style="margin-top:8px;max-height:100px;overflow-y:auto;background:#151d32;padding:6px;border-radius:6px"></div><div class="tabs"><div class="tab active" onclick="openTab(0)">URL</div><div class="tab" onclick="openTab(1)">DOSYA</div><div class="tab" onclick="openTab(2)">XTREAM</div></div><div class="box active" id="b0"><input id="urlInput" placeholder="https://.../liste.m3u"><button class="btn" onclick="loadUrl()">LİSTE YÜKLE</button><p style="font-size:9px;color:#8aa;margin-top:6px">URL boş gelirse: https://corsproxy.io/? öneki ekle</p></div><div class="box" id="b1"><label for="fileInput" style="display:block;text-align:center;color:#ff0a16;border:2px dashed #ff0a16;padding:16px;border-radius:8px">📁 DOSYADAN SEÇ</label><input type="file" id="fileInput" accept=".m3u,.txt" style="display:none"></div><div class="box" id="b2"><input id="xtServer" value="http://20zp98.7039512.xyz:80"><input id="xtUser" value="ahmet:dogan"><input id="xtPass" value="XjFCm3ZHBq"><button class="btn" onclick="loadXtreamAsM3U()">XTREAM M3U OLARAK YÜKLE</button><div id="xtInfo" style="font-size:10px;color:#ff0;margin-top:6px">VLC için en sağlam yöntem</div></div><div id="status" style="font-size:11px;color:#0f0;margin-top:8px;padding:8px;background:#060a14;border-radius:6px">V7 Hazır</div></div></div><script>
const MY_PROXY='https://hidden-meadow-0d62.a-dogan.workers.dev';
let all=[]; let hls=null; let mpegPlayer=null; let mainCat='Tümü'; let activeGroup='Tümü'; let currentList=''; let currentUrl=''; const video=document.getElementById('player'); let db;
const NATIONAL_REFS={'kanal d':'https://www.kanald.com.tr/','star':'https://www.startv.com.tr/','atv':'https://www.atv.com.tr/','fox':'https://www.nowtv.com.tr/','now':'https://www.nowtv.com.tr/','show':'https://www.showtv.com.tr/','tv8':'https://www.tv8.com.tr/','kanal 7':'https://www.kanal7.com/'};
function getNationalRef(n){let l=n.toLowerCase();for(let k in NATIONAL_REFS) if(l.includes(k)) return NATIONAL_REFS[k]; return '';}
function openDB(){return new Promise((res)=>{let req=indexedDB.open('MirtiTV_V7',1);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('lists'))d.createObjectStore('lists',{keyPath:'name'});};req.onsuccess=e=>{db=e.target.result;res(db);};});}
async function saveToDB(n,c){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readwrite');tx.objectStore('lists').put({name:n,channels:c,count:c.length});tx.oncomplete=()=>r();});}
async function getAllFromDB(){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readonly');let q=tx.objectStore('lists').getAll();q.onsuccess=()=>r(q.result);});}
async function deleteFromDB(n){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readwrite');tx.objectStore('lists').delete(n);tx.oncomplete=()=>r();});}
function toggleSet(){document.getElementById('settings').classList.toggle('open');}
function openTab(i){document.querySelectorAll('.box').forEach((b,idx)=>b.classList.toggle('active',idx===i));document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));}
function catOf(n,g){let s=(n+' '+g).toLowerCase();if(/film|movie|vod/.test(s))return 'Film';if(/dizi|series/.test(s))return 'Dizi';return 'Canlı';}
function cleanUrl(u){return u?u.trim().replace(/\s+/g,''):''}
function fixUsername(u){if(!u) return u; u=u.trim(); if(u.includes('.dogan')) return u.replace('.dogan',':dogan'); return u;}
function openVLC(url){ if(!url){ alert('Önce kanal seç'); return; } url=cleanUrl(url); const isAndroid=/Android/i.test(navigator.userAgent); if(isAndroid){ window.location.href=`intent://${url.replace(/^https?:\/\//,'')}#Intent;package=org.videolan.vlc;type=video/*;S.title=${encodeURIComponent(document.getElementById('now').textContent)};end`; } else { window.location.href=`vlc://${url}`; setTimeout(()=>{ window.open(url,'_blank'); }, 500); } }
function copyUrl(url){ if(!url){return} navigator.clipboard.writeText(url); document.getElementById('pInfo').textContent='Link kopyalandı - VLC yapıştır'; }
async function fetchDirect(url){
  url=cleanUrl(url);
  let tries=[url, `${MY_PROXY}/?url=${encodeURIComponent(url)}`, `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, `https://corsproxy.io/?${encodeURIComponent(url)}`];
  for(let p of tries){
    try{ let r=await fetch(p,{cache:'no-store'}); if(r.ok){ let t=await r.text(); if(t && t.length>50) return t; } }catch(e){}
  }
  throw 'İçerik boş';
}
function parseM3U(text){const lines=text.split(/\r?\n/); const out=[]; let tmp={name:'',group:'Genel',logo:'',referrer:''}; for(let l of lines){l=l.trim();if(!l)continue; if(l.startsWith('#EXTINF')){ tmp.name=l.split(',').pop().trim()||''; let gM=l.match(/group-title="([^"]+)"/); tmp.group=gM?gM[1].trim():'Genel'; tmp.logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||''; tmp.referrer=(l.match(/http-referrer="([^"]+)"/)||[])[1]||''; } else if(!l.startsWith('#')&&l.startsWith('http')){ if(!tmp.name) tmp.name='Kanal '+(out.length+1); out.push({name:tmp.name,group:tmp.group,logo:tmp.logo,cat:catOf(tmp.name,tmp.group),url:cleanUrl(l.split('|')[0]),referrer:tmp.referrer}); tmp={name:'',group:'Genel',logo:'',referrer:''}; } } return {channels:out};}
async function loadUrl(){ let u=document.getElementById('urlInput').value.trim(); if(!u){document.getElementById('status').textContent='URL boş'; return;} let st=document.getElementById('status'); st.textContent='Yükleniyor...'; try{ let txt=await fetchDirect(u); if(!txt.includes('#EXTINF')){ if(txt.length<200){ throw 'İçerik boş geldi - proxy dene: https://corsproxy.io/?'+u } throw 'Liste değil'; } let res=parseM3U(txt); if(res.channels.length){ all=res.channels; currentList='LISTE'; await saveToDB(currentList,all); await renderSaved(); apply(); document.getElementById('empty').style.display='none'; st.textContent=res.channels.length+' kanal ✅'; toggleSet(); } }catch(e){ st.textContent='Hata: '+e; document.getElementById('proxyStatus').textContent='URL boş - proxy ekle'; } }
async function renderSaved(){let lists=await getAllFromDB();const box=document.getElementById('savedLists');box.innerHTML='';lists.forEach(item=>{let d=document.createElement('div');d.style.cssText='padding:6px;background:#1a2340;margin:3px 0;border-radius:5px;display:flex;justify-content:space-between;border:1px solid #1e2d4a'+(item.name===currentList?';background:#ff0a16':'');d.innerHTML=`<span>📁 ${item.name} (${item.count})</span><span onclick="event.stopPropagation();delList('${item.name}')" style="color:#ff0a16">✕</span>`;d.onclick=()=>{all=item.channels;currentList=item.name;apply();document.getElementById('empty').style.display='none';toggleSet();};box.appendChild(d);});}
async function delList(k){if(confirm(k+' sil?')){await deleteFromDB(k);await renderSaved();}}
function apply(){buildGroups();} function setMain(cat){mainCat=cat;document.querySelectorAll('.mainCat').forEach(t=>t.classList.toggle('active',t.textContent.includes(cat)));activeGroup='Tümü';buildGroups();}
function buildGroups(){ let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat); let groups=['Tümü',...new Set(base.map(c=>c.group))].filter(Boolean); const box=document.getElementById('groupList'); box.innerHTML=''; if(all.length===0){box.innerHTML='<div style="padding:10px;text-align:center;color:#5a6a8a;font-size:10px">Liste ekle</div>';document.getElementById('groupCount').textContent='0';return;} document.getElementById('groupCount').textContent=groups.length-1; groups.forEach(g=>{ let cnt=g==='Tümü'?base.length:base.filter(x=>x.group===g).length; let b=document.createElement('div'); b.className='group'+(activeGroup===g?' active':''); b.innerHTML=`<span>${g}</span><span style="background:#070b14;padding:2px 6px;border-radius:10px">${cnt}</span>`; b.onclick=()=>{activeGroup=g;document.querySelectorAll('.group').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderCh();}; box.appendChild(b); }); renderCh(); }
function renderCh(){ let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat); let list=base.filter(c=>activeGroup==='Tümü'||c.group===activeGroup); let q=document.getElementById('search').value.toLowerCase(); if(q) list=list.filter(c=>c.name.toLowerCase().includes(q)); const box=document.getElementById('channelList'); box.innerHTML=''; document.getElementById('midTitle').textContent=activeGroup; document.getElementById('midCount').textContent=list.length; list.forEach(c=>{ let logoHtml=c.logo?`<img src="${c.logo}" onerror="this.style.display='none'">`:`<div style="width:42px;height:42px;background:#0b1120;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:bold;color:#ff0a16">${c.name.charAt(0)}</div>`; let d=document.createElement('div'); d.className='ch'; d.innerHTML=`${logoHtml}<div style="flex:1;min-width:0"><div style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold">${c.name}</div><div style="font-size:10px;color:#8aa">${c.group}</div></div><span>▶</span>`; d.onclick=()=>{document.querySelectorAll('.ch').forEach(x=>x.classList.remove('active'));d.classList.add('active');playV6(c);}; box.appendChild(d); }); }
function playV6(c){ document.getElementById('empty').style.display='none'; document.getElementById('now').textContent=c.name; currentUrl=c.url; document.getElementById('pInfo').textContent='Tarayıcı deniyor, olmazsa VLC bas'; if(hls){try{hls.destroy()}catch(e){} hls=null;} if(mpegPlayer){try{mpegPlayer.destroy()}catch(e){} mpegPlayer=null;} video.pause(); video.removeAttribute('src'); video.load(); let ref=c.referrer||getNationalRef(c.name)||''; let url=cleanUrl(c.url); let attempts=[]; if(ref){ attempts.push(`${MY_PROXY}/?url=${encodeURIComponent(url)}&ref=${encodeURIComponent(ref)}`); attempts.push(`${MY_PROXY}/?url=${encodeURIComponent(url)}`); attempts.push(url); } else { attempts.push(url); attempts.push(`${MY_PROXY}/?url=${encodeURIComponent(url)}`); attempts.push(`https://corsproxy.io/?${encodeURIComponent(url)}`); } tryPlay(attempts,0,c); }
function tryPlay(list, idx, c){ if(idx>=list.length){ document.getElementById('pType').textContent='VLC ile dene'; document.getElementById('pInfo').textContent='Tarayıcı açamadı → VLC butonuna bas'; return; } let finalUrl=list[idx]; document.getElementById('pType').textContent=`Deneniyor ${idx+1}/${list.length}`; if(finalUrl.includes('.m3u8')){ if(Hls.isSupported()){ hls=new Hls(); hls.loadSource(finalUrl); hls.attachMedia(video); let to=setTimeout(()=>{ hls.destroy(); tryPlay(list, idx+1, c); }, 8000); hls.on(Hls.Events.MANIFEST_PARSED,()=>{ clearTimeout(to); video.play().then(()=>{document.getElementById('pType').textContent='✅ '+c.name; document.getElementById('pInfo').textContent='';}); }); hls.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal){ clearTimeout(to); hls.destroy(); tryPlay(list, idx+1, c); } }); }else{ video.src=finalUrl; video.play().catch(()=>{ tryPlay(list, idx+1, c); }); } }else{ if(mpegts.isSupported()){ try{ mpegPlayer=mpegts.createPlayer({type:'mpegts',isLive:true,url:finalUrl},{enableWorker:true}); mpegPlayer.attachMediaElement(video); mpegPlayer.load(); mpegPlayer.play(); mpegPlayer.on(mpegts.Events.ERROR,()=>{ try{mpegPlayer.destroy()}catch(e){} tryPlay(list, idx+1, c); }); setTimeout(()=>{ if(video.readyState===0){ try{mpegPlayer.destroy()}catch(e){} tryPlay(list, idx+1, c); } }, 7000); return; }catch(e){} } video.src=finalUrl; video.play().catch(()=>{ tryPlay(list, idx+1, c); }); } }
async function loadXtreamAsM3U(){ let server=document.getElementById('xtServer').value.trim().replace(/\/$/,''); let user=fixUsername(document.getElementById('xtUser').value.trim()); let pass=document.getElementById('xtPass').value.trim(); let m3u=`${server}/get.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&type=m3u_plus&output=m3u8`; document.getElementById('urlInput').value=m3u; openTab(0); loadUrl(); }
document.getElementById('fileInput').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=async ev=>{ let res=parseM3U(ev.target.result); if(res.channels.length){ all=res.channels; currentList=f.name.slice(0,20); await saveToDB(currentList,all); await renderSaved(); apply(); document.getElementById('empty').style.display='none'; toggleSet(); document.getElementById('status').textContent=res.channels.length+' kanal'; } }; r.readAsText(f); });
document.getElementById('search').addEventListener('input',renderCh);
(async()=>{await openDB();await renderSaved(); buildGroups();})();
</script></body></html>
