<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI TV - WORKER FINAL</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070b14;color:#fff;font-family:Arial;height:100vh;display:flex;overflow:hidden}
#left{width:260px;min-width:260px;background:#0b1120;border-right:2px solid #ff0a16;display:flex;flex-direction:column}
#mid{width:360px;min-width:360px;background:#0e1424;border-right:2px solid #1e2d4a;display:flex;flex-direction:column}
#playerArea{flex:1;background:#000;display:flex;flex-direction:column;position:relative;min-width:300px}
#logoTop{padding:12px;display:flex;align-items:center;gap:8px;border-bottom:2px solid #1e2d4a;background:#080e1e}
.mainCat{flex:1;padding:8px;background:#151d32;margin:2px;border-radius:5px;text-align:center;cursor:pointer;font-size:11px;border:1px solid #1e2d4a}.mainCat.active{background:#ff0a16}
#groupList{flex:1;overflow-y:auto;padding:6px}.group{padding:10px;background:#1a2340;margin:4px 0;border-radius:6px;cursor:pointer;font-size:12px;border:1px solid #1e2d4a;display:flex;justify-content:space-between}.group.active{background:#ff0a16}
#channelList{flex:1;overflow-y:auto;padding:6px}.ch{padding:10px;background:#1a2340;margin:4px 0;border-radius:8px;cursor:pointer;border:1px solid #1e2d4a;display:flex;gap:10px;align-items:center}.ch.active{background:#ff0a16}.ch img{width:42px;height:42px;border-radius:6px;background:#000;object-fit:contain}
#player{flex:1;width:100%;background:#000}#bar{padding:8px;background:#0b1120;display:flex;justify-content:space-between;font-size:11px;border-top:1px solid #1e2d4a}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070b14;z-index:10;padding:20px;text-align:center}
#settings{position:absolute;top:0;right:0;bottom:0;width:420px;background:#0b1120;border-left:3px solid #ff0a16;z-index:20;transform:translateX(100%);transition:.3s;padding:12px;overflow-y:auto}#settings.open{transform:translateX(0)}
.tabs{display:flex;gap:4px;margin-top:8px}.tab{flex:1;padding:10px;background:#1a2744;border-radius:6px;text-align:center;cursor:pointer;font-size:11px}.tab.active{background:#ff0a16}
.box{display:none;margin-top:8px;padding:10px;background:#151d32;border-radius:8px;border:1px solid #1e2d4a}.box.active{display:block}
input{width:100%;padding:10px;border-radius:6px;border:1px solid #1e2d4a;background:#060a14;color:#fff;margin-top:5px}.btn{width:100%;padding:12px;background:#ff0a16;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:6px}
@media(max-width:900px){body{flex-direction:column}#playerArea{order:1;height:35vh;min-height:220px}#left{order:2;width:100%;min-width:100%;height:28vh;border-right:none;border-top:2px solid #ff0a16}#mid{order:3;width:100%;min-width:100%;height:40vh;border-right:none;border-top:2px solid #1e2d4a}#settings{width:100%}}
</style>
</head>
<body>
<div id="left">
<div id="logoTop"><b style="color:#ff0a16">MIRTI TV - WORKER</b><button onclick="toggleSet()" style="margin-left:auto;background:#ff0a16;border:none;color:#fff;padding:6px 10px;border-radius:4px">⚙️</button></div>
<div style="display:flex;padding:6px;gap:4px"><div class="mainCat active" onclick="setMain('Tümü')">Tümü</div><div class="mainCat" onclick="setMain('Canlı')">CANLI</div><div class="mainCat" onclick="setMain('Film')">FİLM</div><div class="mainCat" onclick="setMain('Dizi')">DİZİ</div></div>
<div style="padding:6px;background:#151d32;font-size:11px;color:#0f0;display:flex;justify-content:space-between"><span>✅ WORKER AKTİF</span><span id="groupCount">0</span></div>
<div id="groupList"></div>
</div>
<div id="mid">
<div style="padding:10px;background:#ff0a16;font-weight:bold;display:flex;justify-content:space-between"><span id="midTitle">KANALLAR</span><span id="midCount">0</span></div>
<input id="search" placeholder="🔍 Ara..." style="margin:6px;width:94%"><div id="channelList"></div>
</div>
<div id="playerArea">
<div id="empty"><h2 style="color:#0f0">✅ WORKER HAZIR</h2><p style="font-size:11px;color:#8aa;margin-top:6px">Televizo gibi Referer gönderiyor<br>Patron / Arda / Atom / Kanal D / Star</p><button class="btn" style="width:200px;margin-top:12px" onclick="toggleSet()">⚙️ LİSTE EKLE</button><div style="margin-top:10px;font-size:9px;color:#555">hidden-meadow-0d62.a-dogan.workers.dev</div></div>
<video id="player" controls playsinline webkit-playsinline crossorigin="anonymous"></video>
<div id="bar"><span id="now">Hazır - Worker Modu</span><span id="pType">Hazır</span></div>
<div id="settings">
<div style="display:flex;justify-content:space-between"><b style="color:#0f0">✅ WORKER FINAL</b><button onclick="toggleSet()" style="background:#ff0a16;border:none;color:#fff;padding:6px 12px;border-radius:4px">X</button></div>
<div id="savedLists" style="margin-top:8px;max-height:120px;overflow-y:auto;background:#151d32;padding:6px;border-radius:6px"></div>
<div class="tabs"><div class="tab active" onclick="openTab(0)">URL</div><div class="tab" onclick="openTab(1)">DOSYA</div></div>
<div class="box active" id="b0"><input id="urlInput" value="https://dpaste.com/4T2DNM3J3.txt"><button class="btn" onclick="loadUrl()">YÜKLE</button></div>
<div class="box" id="b1"><label for="fileInput" style="display:block;text-align:center;color:#ff0a16;border:2px dashed #ff0a16;padding:16px;border-radius:8px">📁 DOSYADAN SEÇ</label><input type="file" id="fileInput" accept=".m3u,.txt" style="display:none"></div>
<div id="status" style="font-size:11px;color:#0f0;margin-top:8px;padding:8px;background:#060a14;border-radius:6px">Worker aktif - Televizo gibi açacak</div>
</div>
</div>
<script>
const MY_PROXY = 'https://hidden-meadow-0d62.a-dogan.workers.dev';
let all=[]; let hls=null; let mpegPlayer=null; let mainCat='Tümü'; let activeGroup='Tümü'; let currentList=''; const video=document.getElementById('player');
let db;
function openDB(){return new Promise((res)=>{let req=indexedDB.open('MirtiTV_FIX',1);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('lists'))d.createObjectStore('lists',{keyPath:'name'});};req.onsuccess=e=>{db=e.target.result;res(db);};});}
async function saveToDB(name, channels){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readwrite');tx.objectStore('lists').put({name,channels,count:channels.length});tx.oncomplete=()=>r();});}
async function getAllFromDB(){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readonly');let q=tx.objectStore('lists').getAll();q.onsuccess=()=>r(q.result);});}
async function deleteFromDB(name){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readwrite');tx.objectStore('lists').delete(name);tx.oncomplete=()=>r();});}
function toggleSet(){document.getElementById('settings').classList.toggle('open');}
function openTab(i){document.querySelectorAll('.box').forEach((b,idx)=>b.classList.toggle('active',idx===i));document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));}
function catOf(n,g){let s=(n+' '+g).toLowerCase();if(/film|movie|vod/.test(s))return 'Film';if(/dizi|series/.test(s))return 'Dizi';return 'Canlı';}
function splitPipe(url){if(!url.includes('|')) return {url, headers:{}};let [base, query]=url.split('|');let headers={};query.split('&').forEach(p=>{let [k,v]=p.split('=');if(k&&v) headers[k.trim().toLowerCase()]=decodeURIComponent(v.trim());});return {url:base.trim(), headers};}
function parseM3U(text){
  const lines=text.split(/\r?\n/); const out=[]; let tmp={name:'',group:'Genel',logo:'',referrer:''}; let lastRef='';
  for(let l of lines){l=l.trim();if(!l)continue;
    if(l.startsWith('#EXTVLCOPT:http-referrer=')){lastRef=l.split('=')[1]||'';continue;}
    if(l.startsWith('#EXTINF')){
      tmp.name=l.split(',').pop().trim()||''; let gM=l.match(/group-title="([^"]+)"/); tmp.group=gM?gM[1].trim():'Genel'; tmp.logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||'';
      let r1=(l.match(/http-referrer="([^"]+)"/)||[])[1]||''; let r2=(l.match(/referrer="([^"]+)"/)||[])[1]||''; tmp.referrer=r1||r2||lastRef||''; if(lastRef) lastRef='';
    }else if(!l.startsWith('#')&&l.startsWith('http')){
      if(!tmp.name) tmp.name='Kanal '+(out.length+1);
      let parsed=splitPipe(l);
      out.push({name:tmp.name,group:tmp.group,logo:tmp.logo,cat:catOf(tmp.name,tmp.group),url:parsed.url,referrer:tmp.referrer||parsed.headers.referrer||parsed.headers.referer||''});
      tmp={name:'',group:'Genel',logo:'',referrer:''};
    }
  } return {channels:out};
}
async function fetchDirect(url){try{let r=await fetch(url,{cache:'no-store'});if(r.ok){let t=await r.text();if(t.length>50) return t;}}catch(e){}const ps=['https://api.allorigins.win/raw?url='+encodeURIComponent(url),'https://corsproxy.io/?'+encodeURIComponent(url)];for(let p of ps){try{let r=await fetch(p);if(r.ok){let t=await r.text();if(t.length>50) return t;}}catch(e){}}throw 'CORS';}
async function loadUrl(){let u=document.getElementById('urlInput').value.trim();if(!u) return;let st=document.getElementById('status');st.textContent='Yükleniyor...';try{let txt=await fetchDirect(u);let res=parseM3U(txt);if(res.channels.length){all=res.channels;currentList=u.split('/').pop().slice(0,25);await saveToDB(currentList, all);await renderSaved();apply();document.getElementById('empty').style.display='none';st.textContent=res.channels.length+' kanal';toggleSet();}else{st.textContent='Kanal yok';}}catch(e){st.textContent='Yüklenemedi';}}
async function renderSaved(){let lists=await getAllFromDB();const box=document.getElementById('savedLists');box.innerHTML='';lists.forEach(item=>{let d=document.createElement('div');d.style.cssText='padding:6px;background:#1a2340;margin:3px 0;border-radius:5px;display:flex;justify-content:space-between;border:1px solid #1e2d4a'+(item.name===currentList?';background:#ff0a16':'');d.innerHTML=`<span>📁 ${item.name} (${item.count})</span><span onclick="event.stopPropagation();delList('${item.name}')" style="color:#ff0a16">✕</span>`;d.onclick=()=>{all=item.channels;currentList=item.name;apply();document.getElementById('empty').style.display='none';toggleSet();};box.appendChild(d);});}
async function delList(k){if(confirm(k+' sil?')){await deleteFromDB(k);await renderSaved();}}
function apply(){buildGroups();}
function setMain(cat){mainCat=cat;document.querySelectorAll('.mainCat').forEach(t=>t.classList.toggle('active',t.textContent.includes(cat)));activeGroup='Tümü';buildGroups();}
function buildGroups(){
  let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat);
  let groups=['Tümü',...new Set(base.map(c=>c.group))].filter(Boolean);
  const box=document.getElementById('groupList'); box.innerHTML='';
  if(all.length===0){box.innerHTML='<div style="padding:10px;text-align:center;color:#5a6a8a;font-size:10px">Liste ekle</div>';document.getElementById('groupCount').textContent='0';return;}
  document.getElementById('groupCount').textContent=groups.length-1;
  groups.forEach(g=>{
    let cnt=g==='Tümü'?base.length:base.filter(x=>x.group===g).length;
    let b=document.createElement('div'); b.className='group'+(activeGroup===g?' active':''); b.innerHTML=`<span>${g}</span><span style="background:#070b14;padding:2px 6px;border-radius:10px">${cnt}</span>`;
    b.onclick=()=>{activeGroup=g;document.querySelectorAll('.group').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderCh();};
    box.appendChild(b);
  });
  renderCh();
}
function renderCh(){
  let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat);
  let list=base.filter(c=>activeGroup==='Tümü'||c.group===activeGroup);
  let q=document.getElementById('search').value.toLowerCase(); if(q) list=list.filter(c=>c.name.toLowerCase().includes(q));
  const box=document.getElementById('channelList'); box.innerHTML='';
  document.getElementById('midTitle').textContent=activeGroup; document.getElementById('midCount').textContent=list.length;
  list.forEach(c=>{
    let d=document.createElement('div'); d.className='ch';
    d.innerHTML=`<img src="${c.logo}" onerror="this.src='https://via.placeholder.com/42/0b1120/ff0a16?text=TV'"><div style="flex:1;min-width:0"><div style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold">${c.name}</div><div style="font-size:10px;color:#8aa">${c.group} ${c.referrer?'•Ref':''}</div></div><span>▶</span>`;
    d.onclick=()=>{document.querySelectorAll('.ch').forEach(x=>x.classList.remove('active'));d.classList.add('active');playWorker(c,0);};
    box.appendChild(d);
  });
}

function buildProxyUrl(originalUrl, referrer, attempt){
  const encUrl = encodeURIComponent(originalUrl);
  const encRef = encodeURIComponent(referrer||'');
  const proxies = [
    originalUrl,
    `${MY_PROXY}/?url=${encUrl}&ref=${encRef}`,
    `${MY_PROXY}/?url=${encUrl}&ref=https://patronsaha.cfd/`,
    `${MY_PROXY}/?url=${encUrl}&ref=https://ardaspor31.top`,
    originalUrl.replace('http://','https://')
  ];
  return proxies[attempt] || originalUrl;
}

function playWorker(c, attempt){
  if(attempt===0){document.getElementById('empty').style.display='none'; document.getElementById('now').textContent=c.name;}
  if(attempt>=5){document.getElementById('pType').textContent='Açılamadı - Worker blokladı'; return;}
  let ref = c.referrer || '';
  let url = buildProxyUrl(c.url, ref, attempt);
  document.getElementById('pType').textContent = `Worker ${attempt+1}/5 ${ref? ref.split('/')[2]:''}...`;

  if(hls){try{hls.destroy()}catch(e){} hls=null;} if(mpegPlayer){try{mpegPlayer.destroy()}catch(e){} mpegPlayer=null;}
  video.pause(); video.removeAttribute('src'); video.load();

  class WorkerLoader extends Hls.DefaultConfig.loader {
    load(context, config, callbacks){
      let original = context.url;
      // Tüm.ts ve.m3u8 parçalarını da worker üzerinden geçir
      if(!original.includes(MY_PROXY) &&!original.includes('data:')){
        const enc = encodeURIComponent(original);
        const encRef = encodeURIComponent(ref);
        context.url = `${MY_PROXY}/?url=${enc}&ref=${encRef}`;
      }
      super.load(context, config, callbacks);
    }
  }

  if(Hls.isSupported()){
    let cfg={ enableWorker:true, loader: WorkerLoader };
    hls=new Hls(cfg);
    hls.loadSource(url);
    hls.attachMedia(video);
    let to=setTimeout(()=>{hls.destroy(); playWorker(c, attempt+1);},10000);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      clearTimeout(to);
      video.play().then(()=>{
        document.getElementById('pType').textContent=`✅ Oynatılıyor Worker ${ref?'✓Ref':''}`;
      }).catch(()=>{document.getElementById('pType').textContent='Videoya dokun';});
    });
    hls.on(Hls.Events.ERROR,(e,d)=>{
      if(d.fatal){clearTimeout(to); hls.destroy(); playWorker(c, attempt+1);}
    });
  }else{
    video.src=url; video.play().catch(()=>playWorker(c, attempt+1));
  }
}

document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async ev=>{
    let res=parseM3U(ev.target.result);
    if(res.channels.length){
      all=res.channels; currentList=f.name.slice(0,20);
      await saveToDB(currentList,all); await renderSaved(); apply();
      document.getElementById('empty').style.display='none'; toggleSet();
      document.getElementById('status').textContent=res.channels.length+' kanal';
    }
  };
  r.readAsText(f);
});
document.getElementById('search').addEventListener('input',renderCh);
(async()=>{await openDB();await renderSaved(); buildGroups();})();
</script>
</body>
</html>
