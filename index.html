<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI FLIX</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0d14;color:#fff;font-family:Arial;display:flex;height:100vh;overflow:hidden}
#sidebar{width:300px;background:#0f1520;border-right:1px solid #1e293b;display:flex;flex-direction:column}
#sidebar h1{color:#e50914;padding:14px;text-align:center;letter-spacing:2px;font-size:20px;border-bottom:1px solid #1e293b}
.box{margin:8px;padding:10px;background:#141c2e;border-radius:10px;border:1px solid #1e293b}
.box label{cursor:pointer;color:#e50914;font-weight:bold;display:block;text-align:center}
.box input[type=text]{width:100%;padding:9px;border-radius:6px;border:none;background:#0f1520;color:#fff;margin-top:6px}
.btn{width:100%;margin-top:6px;padding:9px;background:#e50914;border:none;border-radius:6px;color:#fff;font-weight:bold;cursor:pointer}
.btn2{background:#1e293b;color:#e50914;border:1px dashed #e50914}
#cats{padding:8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid #1e293b}
.cat{padding:10px;background:#141c2e;border-radius:8px;cursor:pointer;border:1px solid #1e293b;font-size:14px;display:flex;justify-content:space-between}
.cat.active{background:#e50914;border-color:#e50914}
#list{flex:1;overflow-y:auto;padding:8px}
#grid{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;background:#0a0d14}
.card{background:#141c2e;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid #1e293b}
.card:hover{border-color:#e50914;transform:scale(1.03)}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#0f1520}
.ctitle{padding:6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{flex:1;display:flex;flex-direction:column;background:#000}
#player{flex:1;width:100%;background:#000}
#bar{padding:8px;background:#0f1520;display:flex;justify-content:space-between;align-items:center;font-size:13px}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="sidebar">
<h1>MIRTI FLIX</h1>
<div class="box">
<label for="fileInput">📁 DOSYA SEÇ</label><input type="file" id="fileInput" accept=".m3u,.m3u8,.txt">
</div>
<div class="box">
<input type="text" id="urlInput" placeholder="m3u linki yapıştır">
<button class="btn" onclick="loadFromUrl()">🔗 URL'DEN SEÇ</button>
<button class="btn btn2" onclick="clearList()">🗑 Listeyi Sil</button>
</div>
<div id="cats">
<div class="cat active" data-cat="Tümü" onclick="setCat('Tümü')">Tümü <span id="c-all">0</span></div>
<div class="cat" data-cat="Canlı TV" onclick="setCat('Canlı TV')">📺 Canlı TV <span id="c-tv">0</span></div>
<div class="cat" data-cat="Film" onclick="setCat('Film')">🎬 Film <span id="c-film">0</span></div>
<div class="cat" data-cat="Dizi" onclick="setCat('Dizi')">🎞️ Dizi <span id="c-dizi">0</span></div>
</div>
<input type="text" id="search" placeholder="Ara..." style="margin:8px;padding:9px;border-radius:6px;border:none;background:#141c2e;color:#fff;">
<div style="padding:0 8px;font-size:11px;color:#7a869a" id="info">Liste yükle</div>
</div>

<div id="main">
<div id="grid"></div>
<div id="bar"><span id="now">Hazır</span><span style="color:#7a869a">MIRTI</span></div>
<video id="player" controls autoplay style="position:fixed;right:16px;bottom:60px;width:360px;height:200px;border-radius:12px;border:2px solid #e50914;display:none;z-index:50;background:#000"></video>
</div>

<script>
let all=JSON.parse(localStorage.getItem('mirti_list')||'[]');
let hls=null; let activeCat='Tümü';
const video=document.getElementById('player'); const grid=document.getElementById('grid');
function save(){ localStorage.setItem('mirti_list',JSON.stringify(all)); }
function categorize(group,name){
const g=(group+' '+name).toLowerCase();
if(g.includes('film')||g.includes('movie')||g.includes('sinema')) return 'Film';
if(g.includes('dizi')||g.includes('series')||g.includes('sezon')||g.includes('bölüm')) return 'Dizi';
return 'Canlı TV';
}
function parseM3U(text){
const lines=text.split('\n'); const out=[];
for(let i=0;i<lines.length;i++){
let l=lines[i].trim(); if(l.startsWith('#EXTINF')){
let logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||''; let group=(l.match(/group-title="([^"]+)"/)||[])[1]||'';
let name=l.split(',').pop().trim(); let url='';
for(let j=i+1;j<lines.length;j++){ let n=lines[j].trim(); if(n &&!n.startsWith('#')){url=n; i=j; break;} }
if(url){ out.push({name,logo,group,cat:categorize(group,name),url}); }
}
} return out;
}
function updateCounts(){
document.getElementById('c-all').textContent=all.length;
document.getElementById('c-tv').textContent=all.filter(c=>c.cat==='Canlı TV').length;
document.getElementById('c-film').textContent=all.filter(c=>c.cat==='Film').length;
document.getElementById('c-dizi').textContent=all.filter(c=>c.cat==='Dizi').length;
document.getElementById('info').textContent=all.length+' içerik kayıtlı';
}
function render(){
const q=document.getElementById('search').value.toLowerCase();
const filtered=all.filter(c=>(activeCat==='Tümü'||c.cat===activeCat)&&c.name.toLowerCase().includes(q));
grid.innerHTML='';
filtered.forEach(c=>{
const card=document.createElement('div'); card.className='card';
const img=c.logo||`https://via.placeholder.com/300x450/141c2e/e50914?text=${encodeURIComponent(c.name.slice(0,20))}`;
card.innerHTML=`<img class="poster" src="${img}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450?text=Poster'"><div class="ctitle">${c.name}</div>`;
card.onclick=()=>play(c); grid.appendChild(card);
});
}
function play(c){
if(hls){ try{hls.destroy();}catch(e){} hls=null; }
video.style.display='block'; video.pause(); video.removeAttribute('src'); video.load();
document.getElementById('now').textContent='Oynatılıyor: '+c.name;
if(Hls.isSupported()){
hls=new Hls({enableWorker:true, lowLatencyMode:false});
hls.loadSource(c.url); hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>{ video.play().catch(()=>{}); });
hls.on(Hls.Events.ERROR,(ev,data)=>{ if(data.fatal){ console.log('HLS fatal',data); }});
}else if(video.canPlayType('application/vnd.apple.mpegurl')){
video.src=c.url; video.play().catch(()=>{});
}
}
function setCat(cat){
activeCat=cat; document.querySelectorAll('.cat').forEach(el=>el.classList.toggle('active',el.dataset.cat===cat)); render();
}
document.getElementById('fileInput').addEventListener('change',e=>{
const f=e.target.files[0]; if(!f)return; const r=new FileReader();
r.onload=ev=>{ const parsed=parseM3U(ev.target.result); if(parsed.length){ all=parsed; save(); updateCounts(); render(); alert(parsed.length+' içerik yüklendi ve kaydedildi'); } };
r.readAsText(f);
});
function loadFromUrl(){
const url=document.getElementById('urlInput').value.trim(); if(!url)return alert('URL gir');
fetch(url).then(r=>r.text()).then(t=>{
const parsed=parseM3U(t); if(parsed.length){ all=parsed; save(); updateCounts(); render(); }
}).catch(()=>alert('URL CORS engelli, dosyayı indirip DOSYA SEÇ ile yükle abi'));
}
function clearList(){ if(confirm('Listeyi silmek istiyor musun?')){ all=[]; localStorage.removeItem('mirti_list'); updateCounts(); render(); video.style.display='none'; } }
document.getElementById('search').addEventListener('input',render);
if(all.length){ updateCounts(); render(); }
</script>
</body>
</html>
