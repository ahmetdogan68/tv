<script>
const PROXIES=[
 'https://hidden-meadow-0d62.a-dogan.workers.dev/?url=',

];
let all=[]; let hls=null; let mpegPlayer=null; let activeGroup='Tümü'; let currentList=''; let currentUrl=''; const video=document.getElementById('player'); let db;
function openDB(){return new Promise(r=>{let req=indexedDB.open('MirtiTV_Universal',3);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('lists'))d.createObjectStore('lists',{keyPath:'name'});};req.onsuccess=e=>{db=e.target.result;r(db);};});}
async function saveToDB(n,c){if(!db) await openDB();return new Promise(r=>{let tx=db.transaction('lists','readwrite');tx.objectStore('lists').put({name:n,channels:c,count:c.length,time:Date.now()});tx.oncomplete=()=>r();});}
async function getAllFromDB(){if(!db) await openDB();return new Promise(r=>{let tx=db.transaction('lists','readonly');let q=tx.objectStore('lists').getAll();q.onsuccess=()=>r(q.result);});}
async function deleteFromDB(n){if(!db) await openDB();return new Promise(r=>{let tx=db.transaction('lists','readwrite');tx.objectStore('lists').delete(n);tx.oncomplete=()=>r();});}
function toggleSet(){document.getElementById('settings').classList.toggle('open');}
function openTab(i){document.querySelectorAll('.box').forEach((b,idx)=>b.classList.toggle('active',idx===i));document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));}
function cleanUrl(u){if(!u) return ''; return u.trim().split('|')[0].split(';')[0].replace(/\s+/g,'').replace(/&amp;/g,'&').replace(/^"+|"+$/g,'');}
function log(m){document.getElementById('urlLog').textContent=m; document.getElementById('status').textContent=m.slice(0,150);}
function openVLC(){if(!currentUrl) return; let u=cleanUrl(currentUrl); if(/Android/i.test(navigator.userAgent)){ window.location.href=`intent://${u.replace(/^https?:\/\//,'')}#Intent;package=org.videolan.vlc;type=video/*;end`; } else { window.location.href=`vlc://${u}`; }}
function parseM3U(text){
 const lines=text.split(/\r?\n/); const out=[]; let tmp={name:'',group:'Genel',logo:''};
 for(let l of lines){ l=l.trim(); if(!l) continue;
  if(l.startsWith('#EXTINF')){
   let raw=l.split(',').pop().trim().replace(/_+/g,' ').replace(/\s{2,}/g,' ').trim();
   if(raw.length>60) raw=raw.slice(0,60);
   tmp.name=raw||'Kanal '+(out.length+1);
   let gM=l.match(/group-title="([^"]+)"/); tmp.group=gM?gM[1].trim():'Genel';
   tmp.logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||'';
  } else if(l.startsWith('http')){
   let url=cleanUrl(l);
   if(!tmp.name) tmp.name='Kanal '+(out.length+1);
   // mkv/mp4/m3u8/ts hepsi kabul
   if(url.includes('.m3u8')||url.includes('.mp4')||url.includes('.mkv')||url.includes('.ts')||url.includes(':2095')||url.includes('http')){
     out.push({name:tmp.name,group:tmp.group,logo:tmp.logo,url:url});
   }
   tmp={name:'',group:'Genel',logo:''};
  }
 }
 return {channels:out};
}

async function fetchUniversal(url){
 url=cleanUrl(url);
 for(let p of PROXIES){
  try{
   log('Deneniyor: '+p.slice(0,40)+'...');
   let r=await fetch(p+encodeURIComponent(url),{cache:'no-store'});
   if(r.ok){ let t=await r.text(); if(t.length>50) return t; }
  }catch(e){}
 }
 // direkt dene
 try{ let r=await fetch(url); if(r.ok){ let t=await r.text(); if(t.length>50) return t; } }catch(e){}
 throw 'Proxyler kapalı';
}
async function loadUrl(){
 let u=document.getElementById('urlInput').value.trim();
 if(!u){ log('URL boş'); return; }
 log('Yükleniyor: '+u.slice(0,60));
 try{
  let txt=await fetchUniversal(u);
  let res=parseM3U(txt);
  if(res.channels.length===0){ log('Kanallar yok: '+txt.slice(0,150)); return; }
  all=res.channels; currentList='URL-'+Date.now().toString().slice(-4);
  await saveToDB(currentList,all); await renderSaved(); apply();
  document.getElementById('empty').style.display='none';
  log(res.channels.length+' kanal eklendi');
  document.getElementById('urlInput').value='';
  toggleSet();
 }catch(e){ log('Hata: '+e); }
}
async function renderSaved(){let lists=await getAllFromDB();const box=document.getElementById('savedLists'); box.innerHTML=''; lists.sort((a,b)=>(b.time||0)-(a.time||0)); document.getElementById('memInfo').textContent=`Hafıza: ${lists.length} liste`; if(!lists.length){ box.innerHTML='<div style="padding:10px;text-align:center;color:#5a6a8a;font-size:11px">Hafıza boş</div>'; return; } lists.forEach(item=>{let d=document.createElement('div');d.style.cssText='padding:10px;background:#1a2340;margin:5px 0;border-radius:8px;display:flex;justify-content:space-between;border:1px solid #1e2d4a;cursor:pointer'+(item.name===currentList?';background:#ff0a16':'');d.innerHTML=`<span>📁 ${item.name} (${item.count})</span><span><span onclick="event.stopPropagation();loadList('${item.name.replace(/'/g,"\\'")}')" style="color:#0f0">▶</span> <span onclick="event.stopPropagation();delList('${item.name.replace(/'/g,"\\'")}')" style="color:#ff6b6b">✕</span></span>`;d.onclick=()=>loadList(item.name);box.appendChild(d);});}

function buildGroups(){ let groups=['Tümü',...new Set(all.map(c=>c.group))].filter(Boolean); const box=document.getElementById('groupList'); box.innerHTML=''; if(!all.length){box.innerHTML='<div style="padding:20px;text-align:center;color:#5a6a8a">BOŞ</div>';document.getElementById('groupCount').textContent='0';return;} document.getElementById('groupCount').textContent=groups.length-1; groups.forEach(g=>{ let cnt=g==='Tümü'?all.length:all.filter(x=>x.group===g).length; let b=document.createElement('div'); b.className='group'+(activeGroup===g?' active':''); b.innerHTML=`<span>${g}</span><span style="background:#070b14;padding:3px 8px;border-radius:12px">${cnt}</span>`; b.onclick=()=>{activeGroup=g;document.querySelectorAll('.group').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderCh();}; box.appendChild(b); }); renderCh(); }
function renderCh(){ let list=all.filter(c=>activeGroup==='Tümü'||c.group===activeGroup); let q=document.getElementById('search').value.toLowerCase(); if(q) list=list.filter(c=>c.name.toLowerCase().includes(q)); const box=document.getElementById('channelList'); box.innerHTML=''; document.getElementById('midTitle').textContent=activeGroup; document.getElementById('midCount').textContent=list.length; list.forEach(c=>{ let logoHtml=c.logo?`<img src="${c.logo}" onerror="this.style.display='none'">`:`<div style="width:42px;height:42px;background:#0b1120;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:bold;color:#ff0a16">${c.name.charAt(0)}</div>`; let d=document.createElement('div'); d.className='ch'; d.innerHTML=`${logoHtml}<div style="flex:1;min-width:0"><div style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold">${c.name}</div><div style="font-size:10px;color:#8aa">${c.group}</div></div><span>▶</span>`; d.onclick=()=>{document.querySelectorAll('.ch').forEach(x=>x.classList.remove('active'));d.classList.add('active');play(c);}; box.appendChild(d); }); }
function play(c){
 document.getElementById('empty').style.display='none'; document.getElementById('now').textContent=c.name; currentUrl=c.url;
 if(hls){try{hls.destroy()}catch(e){} hls=null;} if(mpegPlayer){try{mpegPlayer.destroy()}catch(e){} mpegPlayer=null;}
 video.pause(); video.removeAttribute('src'); video.load();
 let url=cleanUrl(c.url);
 // OYNATMA SIRASI - EN ÖNEMLİ KISIM
 let attempts=[];
 if(url.includes('.m3u8')){
  // m3u8 için 3 proxy dene
  PROXIES.forEach(p=>attempts.push(p+encodeURIComponent(url)));
  attempts.push(url);
 } else if(url.endsWith('.mkv')||url.endsWith('.mp4')||url.includes('.mkv')||url.includes('.mp4')){
  // mkv/mp4 için direkt video + proxy
  PROXIES.forEach(p=>attempts.push(p+encodeURIComponent(url)));
  attempts.push(url);
 } else {
  // ts ve diğer http linkler
  PROXIES.forEach(p=>attempts.push(p+encodeURIComponent(url)));
  attempts.push(url);
 }
 tryPlay(attempts,0,c);
}
function tryPlay(list, idx, c){
 if(idx>=list.length){ document.getElementById('pType').textContent='❌ Açılamadı - VLC dene'; return; }
 let finalUrl=list[idx];
 document.getElementById('pType').textContent=`Deneniyor ${idx+1}/${list.length} ${finalUrl.includes('corsproxy')?'cors':finalUrl.includes('allorigins')?'allorigins':'direct'}`;
 if(finalUrl.includes('.m3u8')||c.url.includes('.m3u8')){
  if(Hls.isSupported()){
   hls=new Hls({enableWorker:true}); hls.loadSource(finalUrl); hls.attachMedia(video);
   let to=setTimeout(()=>{ try{hls.destroy()}catch(e){} tryPlay(list, idx+1, c); }, 10000);
   hls.on(Hls.Events.MANIFEST_PARSED,()=>{ clearTimeout(to); video.play().then(()=>{document.getElementById('pType').textContent='✅ '+c.name;}).catch(()=>{ clearTimeout(to); tryPlay(list, idx+1, c); }); });
   hls.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal){ clearTimeout(to); try{hls.destroy()}catch(e){} tryPlay(list, idx+1, c); } });
  } else { video.src=finalUrl; video.play().catch(()=>tryPlay(list, idx+1, c)); }
 } else {
  // mp4/mkv/ts için mpegts ve native
  if(finalUrl.includes('.ts')||c.url.includes(':2095')||c.url.includes('.ts')){
   if(mpegts.isSupported()){
    try{
     mpegPlayer=mpegts.createPlayer({type:'mpegts',isLive:true,url:finalUrl},{enableWorker:true,stashInitialSize:128});
     mpegPlayer.attachMediaElement(video); mpegPlayer.load(); mpegPlayer.play();
     document.getElementById('pType').textContent='✅ TS '+c.name; return;
    }catch(e){}
   }
  }
  video.src=finalUrl; video.play().then(()=>{document.getElementById('pType').textContent='✅ '+c.name;}).catch(()=>{ tryPlay(list, idx+1, c); });
 }
}

document.getElementById('search').addEventListener('input',renderCh);
