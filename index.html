if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}

// TV Kumanda - D-Pad ile gezinme
let focusIndex = 0;
let focusList = [];
function updateFocusList(){
  focusList = [...document.querySelectorAll('.ch,.group,.catTab,.btn,.gear')];
}
function focusMove(dir){
  if(!focusList.length) updateFocusList();
  focusList[focusIndex]?.style && (focusList[focusIndex].style.outline='none');
  if(dir==='down') focusIndex = Math.min(focusList.length-1, focusIndex+1);
  if(dir==='up') focusIndex = Math.max(0, focusIndex-1);
  if(dir==='right') focusIndex = Math.min(focusList.length-1, focusIndex+1);
  if(dir==='left') focusIndex = Math.max(0, focusIndex-1);
  const el = focusList[focusIndex];
  if(el){ el.focus(); el.style.outline='3px solid #e50914'; el.scrollIntoView({block:'center',behavior:'smooth'}); }
}
document.addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.key)){
    e.preventDefault();
    if(e.key==='ArrowDown') focusMove('down');
    if(e.key==='ArrowUp') focusMove('up');
    if(e.key==='ArrowRight') focusMove('right');
    if(e.key==='ArrowLeft') focusMove('left');
    if(e.key==='Enter') focusList[focusIndex]?.click();
  }
});
document.addEventListener('click', ()=>setTimeout(updateFocusList,300));
setTimeout(updateFocusList,1000);
</script>

<script>
const DEFAULT_PROXY='https://hidden-meadow-0d62.a-dogan.workers.dev/?url=';
const ALLORIGINS='https://api.allorigins.win/raw?url=';const CODETABS='https://api.codetabs.com/v1/proxy?quest=';
const EPG_SOURCES=[
  {url:'https://www.bevy.be/download.php?file=turkey.xml',name:'TVPlus Genel (turkey.xml)'},
  {url:'https://epgshare01.online/epgshare01/epg_ripper_TR1.xml.gz',name:'TR1 Alternatif (TR1 xml.gz)'},
  {url:'https://www.bevy.be/download.php?file=turkeypremium1.xml',name:'Digiturk (premium1)'},
  {url:'https://www.bevy.be/download.php?file=turkeypremium2.xml',name:'D-Smart (premium2)'}
];
let proxyBase=localStorage.getItem('mirtiProxyBase')||DEFAULT_PROXY;
let all=[],hls=null,mpegPlayer=null,dashPlayer=null,activeGroup='Tümü',activeCat='CANLI',playerMode='tv',currentChannel=null;
let epgData={},epgChannels={};
const video=document.getElementById('player');
const logBox=document.getElementById('urlLog');
const epgLogBox=document.getElementById('epgLog');
const debugBox=document.getElementById('epgDebug');
if(document.getElementById('proxyInput')) document.getElementById('proxyInput').value=proxyBase;
function toggleSettings(){const s=document.getElementById('settings');if(s) s.classList.toggle('open');}
function openTab(i){document.querySelectorAll('.box').forEach((x,j)=>x.classList.toggle('active',i===j));document.querySelectorAll('.tab').forEach((x,j)=>x.classList.toggle('active',i===j));}
function log(s){if(logBox) logBox.textContent=s;}
function epgLog(s){if(epgLogBox) epgLogBox.textContent=s; if(debugBox) debugBox.innerHTML+='<div>'+new Date().toLocaleTimeString()+' '+s+'</div>'; console.log(s);}
function setCat(c){activeCat=c;activeGroup='Tümü';document.querySelectorAll('.catTab').forEach(x=>x.classList.toggle('active',x.dataset.cat===c));buildGroups();}
function saveProxy(){let v=document.getElementById('proxyInput').value.trim();proxyBase=v||DEFAULT_PROXY;localStorage.setItem('mirtiProxyBase',proxyBase);alert('Kaydedildi');}
function proxyUrl(url,base=proxyBase){return base? base + encodeURIComponent(url) : url;}
function cleanUrl(u){return u.trim().split('|')[0].split(';')[0].replace(/\s+/g,'').replace(/&amp;/g,'&');}
function cleanGroupName(g){return (g||'Genel').replace(/^[^\wİıŞşĞğÜüÖöÇç]+/,'').trim();}
function inferCat(name,group){let g=(group||'').toLocaleLowerCase('tr'),n=(name||'').toLocaleLowerCase('tr');if(/film|movie|sinema|filmler|kemal/.test(g)||/\(\s*(19|20)\d{2}\s*\)/.test(n))return 'FILM';if(/dizi|series|sezon|episode/.test(g)||/bölüm|season|episode/.test(n))return 'DIZI';return 'CANLI';}
function parseM3U(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/),out=[];let tmp=null;for(const raw of lines){const l=raw.trim();if(!l)continue;if(l.startsWith('#EXTINF')){const comma=l.indexOf(',');const name=comma>=0?l.slice(comma+1).trim():'Kanal '+(out.length+1);const attr=(key)=>{const re=new RegExp("(?:^|\\s)"+key+"=[\"']([^\"']*)[\"']","i");const m=l.match(re);return m?m[1].trim():'';};tmp={name:name||'Kanal '+(out.length+1),group:attr('group-title')||'Genel',logo:attr('tvg-logo'),tvgId:attr('tvg-id'),tvgName:attr('tvg-name')};}else if(!l.startsWith('#')&&/^https?:\/\//i.test(l)&&tmp){let logo=tmp.logo;if(logo&&logo.startsWith('http://'))logo=logo.replace(/^http:/,'https:');out.push({...tmp,url:cleanUrl(l),logo,cat:inferCat(tmp.name,tmp.group)});tmp=null;}}return out;}
function decodePaste(text){let t=text;if(/<html/i.test(t)){let m=t.match(/<pre[^>]*>([\s\S]*?)<\/pre>/i)||t.match(/<textarea[^>]*>([\s\S]*?)<\/textarea>/i);if(m)t=m[1];t=t.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"');}return t;}
async function fetchText(url,forceProxy=false){
 const candidates=forceProxy?[proxyUrl(url),CODETABS+encodeURIComponent(url),ALLORIGINS+encodeURIComponent(url)]:[url,proxyUrl(url),CODETABS+encodeURIComponent(url),ALLORIGINS+encodeURIComponent(url)];
 let last='Bağlantı kurulamadı';
 for(const u of [...new Set(candidates)]){
  try{const r=await fetch(u,{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!r.ok){last='HTTP '+r.status;continue;}let t=decodePaste(await r.text());if(t.length>20&&(/#EXTM3U|#EXTINF|https?:\/\//i.test(t)))return t;last='M3U değil';}catch(e){last=e.message||'Ağ/CORS';}
 }
 throw new Error(last);
}
async function fetchEpgText(u,f=false){
 const urls=f?[proxyUrl(u),CODETABS+encodeURIComponent(u),ALLORIGINS+encodeURIComponent(u)]:[u,proxyUrl(u),CODETABS+encodeURIComponent(u),ALLORIGINS+encodeURIComponent(u)];
 let last='';
 for(const q of [...new Set(urls)]){
  try{
   const r=await fetch(q,{cache:'no-store',signal:AbortSignal.timeout(20000)});
   if(!r.ok){last='HTTP '+r.status;continue;}
   const buf=await r.arrayBuffer();const u8=new Uint8Array(buf);let text='';
   if(u8[0]===0x1f && u8[1]===0x8b){
     try{text=pako.ungzip(u8,{to:'string'}); epgLog('gz açıldı '+u8.length+' byte');}
     catch(e){last='gunzip hata: '+e.message;continue;}
   } else {
     text=new TextDecoder().decode(u8);
   }
   text=decodePaste(text);
   if(text.includes('<tv')||text.includes('<programme')||text.includes('<channel')){
     return text;
   }
   last='XML değil, ilk 80: '+text.slice(0,80).replace(/\n/g,' ');
  }catch(e){last=e.message;}
 }
 throw new Error(last);
}
async function acceptList(text,name='Liste'){
 const channels=parseM3U(text);
 if(!channels.length)throw new Error('Kanal yok');
 all=channels;activeGroup='Tümü';await saveList(name,channels);buildGroups();document.getElementById('empty').style.display='flex';log('✅ '+channels.length+' yayın: '+name);await renderSaved();
}
async function loadUrl(forceProxy=false){const url=document.getElementById('urlInput').value.trim();if(!url){log('URL boş');return;}log('İndiriliyor…');try{const t=await fetchText(url,forceProxy);await acceptList(t,'LISTE');toggleSettings();}catch(e){log('HATA: '+e.message);}}
function loadFile(){const f=document.getElementById('fileInput').files[0];if(!f){log('Dosya seç');return;}const r=new FileReader();r.onload=async()=>{try{await acceptList(String(r.result),f.name);toggleSettings();}catch(e){log('HATA: '+e.message);}};r.readAsText(f);}
async function loadManual(){try{await acceptList(document.getElementById('manualPaste').value,'MANUEL');toggleSettings();}catch(e){log('HATA: '+e.message);}}
function parseXmltvDate(s){try{const m=s.match(/(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})?\s*([+-]\d{4})?/);if(!m)return new Date();let y=+m[1],mo=+m[2]-1,d=+m[3],h=+m[4],mi=+m[5],sec=+(m[6]||0);let dt=new Date(Date.UTC(y,mo,d,h,mi,sec));if(m[7]){let sign=m[7][0]==='+'?1:-1;let offH=+m[7].slice(1,3),offM=+m[7].slice(3,5);let offMin=sign*(offH*60+offM);dt=new Date(dt.getTime()-offMin*60000);}return dt;}catch(e){return new Date();}}
function parseEpgXml(xmlText){
 const parser=new DOMParser();const xml=parser.parseFromString(xmlText,"text/xml");
 const err=xml.querySelector('parsererror'); if(err) throw new Error('XML Parse: '+err.textContent.slice(0,200));
 const channels=xml.querySelectorAll("channel");const chanMap={};channels.forEach(ch=>{const id=ch.getAttribute("id");if(!id)return;const names=[...ch.querySelectorAll("display-name")].map(n=>n.textContent.trim());chanMap[id]=names;});
 const progs=xml.querySelectorAll("programme");const data={};progs.forEach(p=>{const chId=p.getAttribute("channel");const start=parseXmltvDate(p.getAttribute("start"));const stop=parseXmltvDate(p.getAttribute("stop"));const titleEl=p.querySelector("title");const title=titleEl?titleEl.textContent.trim():'';if(!data[chId])data[chId]=[];data[chId].push({start,stop,title});});Object.keys(data).forEach(k=>{data[k].sort((a,b)=>a.start-b.start);});return {chanMap,data};
}
function loadEpgMap(xmlText,sourceName='EPG'){
 try{
  const {chanMap,data}=parseEpgXml(xmlText);
  let addedCh=0,addedProg=0;
  Object.keys(data).forEach(k=>{if(!epgData[k]){epgData[k]=[];addedCh++;}epgData[k]=epgData[k].concat(data[k]);epgData[k].sort((a,b)=>a.start-b.start);addedProg+=data[k].length;});
  Object.assign(epgChannels,chanMap);
  const total=Object.values(epgData).reduce((s,a)=>s+a.length,0);
  epgLog(`✅ ${sourceName}: +${addedCh} yeni kanal, +${addedProg} prog | Toplam ${Object.keys(epgChannels).length} kanal, ${total} prog`);
  document.getElementById('pType').textContent=`EPG: ${Object.keys(epgChannels).length} kanal`;
  render();
 }catch(e){epgLog(`❌ ${sourceName} Parse Hata: ${e.message}`);}
}
async function loadEpg(fp=false){let url=document.getElementById('epgUrl').value.trim();if(!url){epgLog('URL boş');return;}epgLog('Ek EPG indiriliyor…');try{const txt=await fetchEpgText(url,fp);loadEpgMap(txt,'Ek EPG');}catch(e){epgLog('HATA: '+e.message);}}
function clearEpg(){try{localStorage.removeItem('mirtiEpgData');}catch(e){}epgData={};epgChannels={};epgLog('EPG temizlendi');document.getElementById('pType').textContent='EPG temiz';render();}
async function autoLoadEmbeddedEpg(){
 if(debugBox) debugBox.innerHTML='';
 epgLog('4 EPG tek tek yükleniyor...');
 for(let i=0;i<EPG_SOURCES.length;i++){
  let item=EPG_SOURCES[i];
  try{
   epgLog(`${i+1}/4 ${item.name} deneniyor...`);
   const txt=await fetchEpgText(item.url,true);
   if(txt.length>1000){loadEpgMap(txt,item.name);}
   await new Promise(r=>setTimeout(r,1200));
  }catch(e){epgLog(`${item.name} atlandı: ${e.message}`);await new Promise(r=>setTimeout(r,600));}
 }
 epgLog(`Bitti. Toplam ${Object.keys(epgChannels).length} kanal`);
}
function findEpgForChannel(ch){
 if(!ch||Object.keys(epgData).length===0) return null;
 const ids=[ch.tvgId,ch.tvgName,ch.name].filter(Boolean);
 for(let id of ids){
  if(epgData[id])return {id,progs:epgData[id]};
  let found=Object.keys(epgData).find(k=>k.toLowerCase()===id.toLowerCase());
  if(found)return {id:found,progs:epgData[found]};
 }
 for(let k of Object.keys(epgChannels)){
  let names=epgChannels[k]||[];
  if(names.some(n=>ids.some(i=>i&& (n.toLowerCase().includes(i.toLowerCase())||i.toLowerCase().includes(n.toLowerCase()))))){
   if(epgData[k])return {id:k,progs:epgData[k]};
  }
 }
 return null;
}
function getNowNext(progs){const now=new Date();let cur=null,nxt=null;for(let i=0;i<progs.length;i++){if(progs[i].start<=now&&progs[i].stop>now){cur=progs[i];nxt=progs[i+1]||null;break;}if(progs[i].start>now){nxt=progs[i];break;}}return {cur,nxt};}
function copyUrl(){const url=currentChannel?currentChannel.url:'';if(!url)return;navigator.clipboard.writeText(url).then(()=>{const el=document.getElementById('urlDisplay');const old=el.textContent;el.textContent='Kopyalandı!';setTimeout(()=>el.textContent=old,1500);});}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('MirtiTV_V46',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('lists'))d.createObjectStore('lists',{keyPath:'name'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function saveList(name,channels){try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction('lists','readwrite');tx.objectStore('lists').put({name,channels,count:channels.length,time:Date.now()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){}}
async function renderSaved(){const box=document.getElementById('savedLists');if(!box) return;try{const db=await openDB();const items=await new Promise((res,rej)=>{const q=db.transaction('lists','readonly').objectStore('lists').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});box.innerHTML='<b>KAYITLI LİSTELER</b>';items.sort((a,b)=>b.time-a.time).forEach(item=>{const d=document.createElement('div');d.className='savedItem';const s=document.createElement('span');s.textContent='📁 '+item.name+' ('+item.count+')';const go=document.createElement('b');go.textContent='▶';d.append(s,go);d.onclick=()=>{all=item.channels||[];activeGroup='Tümü';buildGroups();document.getElementById('empty').style.display='flex';toggleSettings();};box.appendChild(d);});if(!items.length)box.innerHTML='<b>KAYITLI</b><p style="color:#777;font-size:11px">Yok</p>';}catch(e){box.textContent='Okunamadı';}}
async function clearSaved(){if(!confirm('Sil?'))return;const db=await openDB();await new Promise(r=>{const tx=db.transaction('lists','readwrite');tx.objectStore('lists').clear();tx.oncomplete=r;});renderSaved();}
function buildGroups(){const base=activeCat==='TUMU'?all:all.filter(c=>c.cat===activeCat);const raw=[...new Set(base.map(c=>c.group||'Genel'))];const display=['Tümü',...raw];const box=document.getElementById('groupList');box.innerHTML='';display.forEach(g=>{const cnt=g==='Tümü'?base.length:base.filter(c=> (c.group||'Genel')===g || cleanGroupName(c.group)===cleanGroupName(g) ).length;if(cnt===0&&g!=='Tümü')return;const b=document.createElement('div');b.className='group'+(activeGroup===g||cleanGroupName(activeGroup)===cleanGroupName(g)?' active':'');const a=document.createElement('span');a.textContent=g==='Tümü'?g:cleanGroupName(g);const n=document.createElement('span');n.textContent=cnt;n.style.cssText='background:#000;padding:2px 6px;border-radius:4px;font-size:10px;flex-shrink:0';b.append(a,n);b.onclick=()=>{activeGroup=g;buildGroups();};box.appendChild(b);});render();}
function safeImg(url){return /^https?:\/\//i.test(url||'');}
function render(){
 try{
  const base=activeCat==='TUMU'?all:all.filter(c=>c.cat===activeCat);
  const q=(document.getElementById('search').value||'').toLowerCase();
  const list=base.filter(c=>(activeGroup==='Tümü'||(c.group||'Genel')===activeGroup||cleanGroupName(c.group)===cleanGroupName(activeGroup))&&((c.name||'').toLowerCase().includes(q)||(c.group||'').toLowerCase().includes(q)));
  const cl=document.getElementById('channelList'),fg=document.getElementById('filmGrid');if(!cl||!fg) return;
  if(activeCat==='CANLI' || activeCat==='TUMU'){cl.style.display='flex'; fg.style.display='none';} else {cl.style.display='none'; fg.style.display='grid';}
  cl.innerHTML='';fg.innerHTML='';
  list.forEach(c=>{
   if(activeCat==='FILM'||activeCat==='DIZI'){
    const d=document.createElement('div');d.className='filmCard';
    const wrap=document.createElement('div');wrap.className='posterWrap';
    if(safeImg(c.logo)){const img=document.createElement('img');img.className='poster';img.loading='lazy';img.src=c.logo;img.onerror=()=>{wrap.innerHTML='';const fb=document.createElement('div');fb.className='posterFb';fb.textContent=(c.name||'?').slice(0,1).toUpperCase();wrap.appendChild(fb);};wrap.appendChild(img);}else{const fb=document.createElement('div');fb.className='posterFb';fb.textContent=(c.name||'?').slice(0,1).toUpperCase();wrap.appendChild(fb);}
    const info=document.createElement('div');info.className='filmInfo';const title=document.createElement('div');title.className='filmTitle';title.textContent=c.name;const meta=document.createElement('div');meta.className='filmMeta';meta.textContent=c.group;info.append(title,meta);d.append(wrap,info);d.onclick=()=>play(c);fg.appendChild(d);
   }else{
    const epgMatch=findEpgForChannel(c);let cur=null,nxt=null,prog=0;if(epgMatch){const {cur:cc,nxt:nn}=getNowNext(epgMatch.progs);cur=cc;nxt=nn;if(cur){const tot=cur.stop-cur.start;const el=new Date()-cur.start;prog=Math.max(0,Math.min(100,(el/tot)*100));}}
    const d=document.createElement('div');d.className='ch'+(currentChannel&&currentChannel.url===c.url?' active':'');
    if(safeImg(c.logo)){const img=document.createElement('img');img.className='ch-logo';img.loading='lazy';img.src=c.logo;img.onerror=()=>{img.replaceWith(makeLogo(c.name))};d.appendChild(img);}else d.appendChild(makeLogo(c.name));
    const inf=document.createElement('div');inf.className='ch-info';const nm=document.createElement('div');nm.className='ch-name';nm.textContent=c.name;const epgEl=document.createElement('div');epgEl.className='ch-epg';epgEl.textContent=cur?`▶ ${cur.title}`:'';const nextEl=document.createElement('div');nextEl.className='ch-epg-next';nextEl.textContent=nxt?`Sonra: ${nxt.title}`:'';const pw=document.createElement('div');pw.className='ch-progress';const pb=document.createElement('div');pb.className='ch-progress-bar';pb.style.width=prog+'%';pw.appendChild(pb);inf.append(nm,epgEl,nextEl,pw);
    const ic=document.createElement('span');ic.textContent='▶';ic.style.cssText='font-size:12px;color:#666;flex-shrink:0';d.append(inf,ic);d.onclick=()=>play(c);cl.appendChild(d);
   }
  });
 }catch(e){log('Render hata: '+e.message);}
}
function makeLogo(name){const e=document.createElement('div');e.className='ch-fb';e.textContent=(name||'?').slice(0,1).toUpperCase();return e;}
if(document.getElementById('search')) document.getElementById('search').addEventListener('input',render);
function detectFormat(url){let path='';try{path=new URL(url).pathname.toLowerCase();}catch(_){return 'hls';}if(path.endsWith('.m3u8')||path.includes('.m3u8'))return 'hls';if(path.endsWith('.mpd'))return 'dash';if(path.endsWith('.mp4')||path.endsWith('.m4v')||path.endsWith('.webm')||path.endsWith('.mov'))return 'mp4';return 'hls';}
function stopPlayback(){if(hls){try{hls.destroy();}catch(_){}hls=null;}if(mpegPlayer){try{mpegPlayer.destroy();}catch(_){}mpegPlayer=null;}if(dashPlayer){try{dashPlayer.reset();}catch(_){}dashPlayer=null;}video.pause();video.removeAttribute('src');video.load();}
function play(c){
 currentChannel=c;
 document.getElementById('empty').style.display='none';
 document.getElementById('now').textContent=c.name;
 document.getElementById('urlDisplay').textContent='URL: '+c.url;
 const epgMatch=findEpgForChannel(c);
 const nowEpgEl=document.getElementById('nowEpg');const nextEl=document.getElementById('nowEpgNext');const barEl=document.getElementById('epgProgressBar');
 if(epgMatch){const {cur,nxt}=getNowNext(epgMatch.progs);if(nowEpgEl) nowEpgEl.textContent=cur?`Şimdi: ${cur.title}`:'';if(nextEl) nextEl.textContent=nxt?`Sonra: ${nxt.start.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})} - ${nxt.title}`:'';if(cur&&barEl){const tot=cur.stop-cur.start;const el=new Date()-cur.start;const pct=Math.max(0,Math.min(100,(el/tot)*100));barEl.style.width=pct+'%';}else if(barEl) barEl.style.width='0%';}else{if(nowEpgEl) nowEpgEl.textContent=Object.keys(epgData).length? 'EPG eşleşmedi':'EPG yok - Yükle butonuna bas';if(nextEl) nextEl.textContent=`tvg-id: ${c.tvgId||'yok'} | İsim: ${c.name}`;if(barEl) barEl.style.width='0%';}
 const fmt=detectFormat(c.url);let routes=[];if(fmt==='mp4'){routes=['native-direct','native-proxy','hls-direct','hls-proxy'];}else{routes=['hls-direct','hls-proxy','native-direct','native-proxy'];}tryRoute(c.url,routes,0);
}
function tryRoute(o,r,i){
 if(i>=r.length){document.getElementById('pType').textContent='Açılamadı - Tüm yollar denendi';log(`❌ Açılamadı: ${o.slice(0,80)}`);document.getElementById('empty').style.display='flex';return;}
 stopPlayback();const m=r[i];const prox=m.endsWith('-proxy');const u=prox?proxyUrl(o):o;document.getElementById('pType').textContent=`${i+1}/${r.length} ${m}...`;log(`▶ ${i+1}/${r.length} ${m}\n${u.slice(0,100)}`);let done=false;const to=setTimeout(()=>{fin(false);},10000);
 function fin(ok){if(done) return;done=true;clearTimeout(to);video.removeEventListener('playing',onP);video.removeEventListener('canplay',onP);video.removeEventListener('loadedmetadata',onP);video.removeEventListener('error',onE);video.removeEventListener('stalled',onE);if(hls){try{hls.off(Hls.Events.ERROR,onHlsErr);}catch(e){}}if(ok){document.getElementById('pType').textContent=`▶ ${m} Oynuyor`;log(`✅ ${m} açtı`);}else{tryRoute(o,r,i+1);}}
 function onP(){fin(true);}function onE(){fin(false);}function onHlsErr(ev,data){if(data.fatal){fin(false);}}
 video.addEventListener('playing',onP);video.addEventListener('canplay',onP);video.addEventListener('loadedmetadata',onP);video.addEventListener('error',onE);video.addEventListener('stalled',onE);
 try{
  if(m.startsWith('hls-')){if(Hls.isSupported()){hls=new Hls({enableWorker:true});hls.on(Hls.Events.ERROR,onHlsErr);hls.loadSource(u);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>{video.play().catch(()=>{});});}else{video.src=u;video.load();video.play().catch(()=>{});}}
  else{video.src=u;video.load();video.play().catch((e)=>{setTimeout(()=>{if(video.readyState===0) fin(false);},2000);});}
 }catch(e){fin(false);}
}
(async()=>{
 try{
  await renderSaved();
  try{
   const saved=localStorage.getItem('mirtiEpgData');
   if(saved){
    const obj=JSON.parse(saved);
    if(obj&&obj.chanMap&&obj.data){
     epgChannels=obj.chanMap||{};
     const d={};Object.entries(obj.data||{}).forEach(([k,v])=>{d[k]=v.map(x=>({title:x.title,start:new Date(x.start),stop:new Date(x.stop)}));});epgData=d;
     epgLog(`Kayıtlı EPG: ${Object.keys(d).length} kanal`);document.getElementById('pType').textContent=`EPG: ${Object.keys(d).length} kanal (kayıtlı)`;render();
    }
   }
  }catch(e){try{localStorage.removeItem('mirtiEpgData');}catch(e2){}}
 }catch(e){log('Init hata: '+e.message);}
})();
</script>
