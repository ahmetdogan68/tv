textarea,input{width:100%;margin-top:6px;padding:11px;background:#171717;color:#fff;border:1px solid #444;border-radius:6px}
.btn{width:100%;padding:12px;background:#e50914;color:#fff;border:0;border-radius:6px;font-weight:900;margin-top:6px;cursor:pointer}.btn.blue{background:#08a9e8}.btn.green{background:#12b85a;color:#000}

</style>

 <style>

<script>
const DEFAULT_PROXY='https://hidden-meadow-0d62.a-dogan.workers.dev/?url=';const CODETABS='https://api.codetabs.com/v1/proxy?quest=';const ALLORIGINS='https://api.allorigins.win/raw?url=';
let proxyBase=localStorage.getItem('mirtiProxyBase')||DEFAULT_PROXY;
let all=[],hls=null,activeGroup='Tümü',activeCat='CANLI',currentChannel=null,lastClickTime=0,lastClickedChannel=null,epgData={},epgChannels={},currentIndex=-1,fsInfoTimer=null,visibleListCache=[],focusCol=0;
const video=document.getElementById('player');const fsVideo=document.getElementById('fsVideo');
document.getElementById('proxyInput').value=proxyBase;
function toggleSettings(){const s=document.getElementById('settings');s.classList.toggle('open');if(s.classList.contains('open')){setTimeout(()=>{document.getElementById('settingsCloseBtn').focus();focusCol=99},150)}else{setTimeout(()=>{document.querySelector('.catTab.active')?.focus();focusCol=0},150)}}
function openTab(i){document.querySelectorAll('.box').forEach((x,j)=>x.classList.toggle('active',i===j));document.querySelectorAll('.tab').forEach((x,j)=>x.classList.toggle('active',i===j));}
function log(s){document.getElementById('urlLog').textContent=s}function epgLog(s){document.getElementById('epgLog').textContent+='\n'+s}
function setCat(c){activeCat=c;activeGroup='Tümü';document.querySelectorAll('.catTab').forEach(x=>x.classList.toggle('active',x.dataset.cat===c));buildGroups();focusCol=0;setTimeout(()=>{document.querySelector('#groupList.group')?.focus()},120)}
function saveProxy(){proxyBase=document.getElementById('proxyInput').value.trim()||DEFAULT_PROXY;localStorage.setItem('mirtiProxyBase',proxyBase);alert('ok')}
function proxyUrl(u,b=proxyBase,ref=''){let url=b?b+encodeURIComponent(u):u;if(ref)url+='&referer='+encodeURIComponent(ref);return url;}
function cleanUrl(u){return u.trim().split('|')[0].split(';')[0].replace(/\s+/g,'')}function cleanGroupName(g){return (g||'Genel').replace(/^[^\wİıŞşĞğÜüÖöÇç]+/,'').trim()}
function inferCat(name,group){let g=(group||'').toLowerCase();if(g.includes('dizi'))return 'DIZI';if(g.includes('film')||g.includes('sinema'))return 'FILM';if(g.includes('movie')||g.includes('vod'))return 'FILM';if(g.includes('series'))return 'DIZI';return 'CANLI';}
function parseM3U(t){const lines=t.replace(/^\uFEFF/,'').split(/\r?\n/),out=[];let tmp=null,extra={ref:''};for(const raw of lines){const l=raw.trim();if(!l)continue;if(l.startsWith('#EXTINF')){const comma=l.lastIndexOf(',');const name=comma>=0?l.slice(comma+1).trim():'Kanal';const attr=k=>{const m=l.match(new RegExp('(?:^|\\s)'+k+'=["\']([^"\']*)["\']','i'));return m?m[1].trim():'';};tmp={name,group:attr('group-title')||'Genel',logo:attr('tvg-logo'),tvgId:attr('tvg-id'),tvgName:attr('tvg-name')};extra={ref:''};}else if(l.startsWith('#EXTVLCOPT:')){const refM=l.match(/http-(?:referrer|referer)\s*=\s*["']?([^"']+)["']?/i);if(refM)extra.ref=refM[1];}else if(!l.startsWith('#')&&/^https?:\/\//i.test(l)&&tmp){if(/like Gecko|Chrome\/\d+/i.test(tmp.name)){tmp.name=tmp.tvgName||tmp.tvgId||'Film';}out.push({...tmp,url:cleanUrl(l),cat:inferCat(tmp.name,tmp.group),referrer:extra.ref});tmp=null;}}return out;}
async function fetchText(url,force=false){const cands=force?[proxyUrl(url),CODETABS+encodeURIComponent(url)]:[url,proxyUrl(url)];let last='';for(const u of [...new Set(cands)]){try{const r=await fetch(u,{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!r.ok)continue;let txt=await r.text();if(txt.length>20&&/#EXTM3U|#EXTINF/i.test(txt))return txt;}catch(e){last=e.message}}throw new Error(last)}
async function acceptList(text,name){const ch=parseM3U(text);if(!ch.length)throw new Error('yok');all=ch;activeGroup='Tümü';await saveList(name,ch);buildGroups();log('✅ '+ch.length);await renderSaved();}
async function loadUrl(fp=false){const url=document.getElementById('urlInput').value.trim();if(!url)return;log('İndiriliyor…');try{const t=await fetchText(url,fp);await acceptList(t,'LISTE');toggleSettings()}catch(e){log('HATA: '+e.message)}}
function loadFile(){const f=document.getElementById('fileInput').files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{await acceptList(String(r.result),f.name);toggleSettings()};r.readAsText(f)}
function parseXmltvDate(s){try{const m=s.match(/(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/);if(!m)return new Date();return new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5]));}catch(e){return new Date()}}
function parseEpgXml(xmlText){const p=new DOMParser();const xml=p.parseFromString(xmlText,'text/xml');const chanMap={};xml.querySelectorAll('channel').forEach(ch=>{chanMap[ch.getAttribute('id')]=[...ch.querySelectorAll('display-name')].map(n=>n.textContent.trim())});const data={};xml.querySelectorAll('programme').forEach(pr=>{const chId=pr.getAttribute('channel');const title=pr.querySelector('title')?pr.querySelector('title').textContent.trim():'';if(!data[chId])data[chId]=[];data[chId].push({start:parseXmltvDate(pr.getAttribute('start')),stop:parseXmltvDate(pr.getAttribute('stop')),title})});return {chanMap,data}}
function loadEpgMap(xmlText){try{const {chanMap,data}=parseEpgXml(xmlText);Object.keys(data).forEach(k=>{if(!epgData[k])epgData[k]=[];epgData[k]=epgData[k].concat(data[k])});Object.assign(epgChannels,chanMap);render();}catch(e){}}
async function loadEpg(){let url=document.getElementById('epgUrl').value.trim();if(!url)return;try{const buf=await (await fetch(proxyUrl(url))).arrayBuffer();const txt=new TextDecoder().decode(buf);loadEpgMap(txt)}catch(e){}}
function findEpgForChannel(ch){if(!ch||!Object.keys(epgData).length)return null;const ids=[ch.tvgId,ch.tvgName,ch.name].filter(Boolean);for(let id of ids){if(epgData[id])return {progs:epgData[id]}}return null}
function getNowNext(progs){const now=new Date();for(let i=0;i<progs.length;i++){if(progs[i].start<=now&&progs[i].stop>now)return {cur:progs[i],nxt:progs[i+1]}}return {cur:null,nxt:null}}
function openDB(){return new Promise((res,rej)=>{const req=indexedDB.open('MirtiTV_V47',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('lists'))d.createObjectStore('lists',{keyPath:'name'})};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function saveList(n,ch){try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction('lists','readwrite');tx.objectStore('lists').put({name:n,channels:ch,count:ch.length,time:Date.now()});tx.oncomplete=res});}catch(e){}}
async function renderSaved(){const box=document.getElementById('savedLists');try{const db=await openDB();const items=await new Promise((res)=>{const q=db.transaction('lists','readonly').objectStore('lists').getAll();q.onsuccess=()=>res(q.result)});box.innerHTML='<b>KAYITLI</b>';items.sort((a,b)=>b.time-a.time).forEach(it=>{const d=document.createElement('div');d.className='savedItem';d.tabIndex=0;d.innerHTML=`<span>📁 ${it.name} (${it.count})</span><b>▶</b>`;d.onclick=()=>{all=it.channels||[];activeGroup='Tümü';buildGroups();document.getElementById('empty').style.display='flex';toggleSettings()};box.appendChild(d)});}catch(e){}}
async function clearSaved(){if(!confirm('Sil?'))return;const db=await openDB();await new Promise(r=>{const tx=db.transaction('lists','readwrite');tx.objectStore('lists').clear();tx.oncomplete=r});renderSaved()}
function buildGroups(){const base=activeCat==='TUMU'?all:all.filter(c=>c.cat===activeCat);const raw=[...new Set(base.map(c=>c.group||'Genel'))];const display=['Tümü',...raw];const box=document.getElementById('groupList');box.innerHTML='';display.forEach(g=>{const cnt=g==='Tümü'?base.length:base.filter(c=>(c.group||'Genel')===g).length;if(cnt===0&&g!=='Tümü')return;const b=document.createElement('div');b.className='group';b.tabIndex=0;b.innerHTML=`<span>${cleanGroupName(g)}</span><span style='background:#000;padding:2px 6px;border-radius:4px;font-size:10px'>${cnt}</span>`;b.onclick=()=>{activeGroup=g;buildGroups();};box.appendChild(b)});render()}
function safeImg(u){return /^https?:\/\//i.test(u||'')}function render(){
  const base=activeCat==='TUMU'?all:all.filter(c=>c.cat===activeCat);
  const list=base.filter(c=>(activeGroup==='Tümü'||(c.group||'Genel')===activeGroup));
  visibleListCache=list;
  const cl=document.getElementById('channelList'),fg=document.getElementById('filmGrid');
  if(activeCat==='CANLI'||activeCat==='TUMU'){cl.style.display='flex';fg.style.display='none'}else{cl.style.display='none';fg.style.display='grid'}
  cl.innerHTML='';fg.innerHTML='';
  document.getElementById('midCount')&&(document.getElementById('midCount').textContent=`${activeGroup.toUpperCase()} • ${list.length}`);
  list.forEach((c,idx)=>{
    if(activeCat==='FILM'||activeCat==='DIZI'){
      const d=document.createElement('div');d.className='filmCard';d.tabIndex=0;
      const wrap=document.createElement('div');wrap.className='posterWrap';
      if(safeImg(c.logo)){const img=document.createElement('img');img.className='poster';img.src=c.logo;wrap.appendChild(img)}else{const fb=document.createElement('div');fb.style.cssText='width:100%;height:100%;background:#222;display:flex;align-items:center;justify-content:center;font-size:40px';fb.textContent=(c.name||'?')[0];wrap.appendChild(fb)}
      const info=document.createElement('div');info.style.cssText='padding:8px';info.innerHTML=`<div style='font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>${c.name}</div><div style='color:#888;font-size:10px'>${c.group}</div>`;d.append(wrap,info);
      d.onclick=()=>handleChannelClick(c,idx);fg.appendChild(d)
    }else{
      const epg=findEpgForChannel(c);let cur=null;if(epg){const {cur:cc}=getNowNext(epg.progs);cur=cc}
      const d=document.createElement('div');d.className='ch'+(currentChannel&&currentChannel.url===c.url?' active':'');d.tabIndex=0;
      d.innerHTML=`${safeImg(c.logo)?`<img class='ch-logo' src='${c.logo}'>`:`<div class='ch-fb'>${(c.name||'?')[0]}</div>`}<div class='ch-info'><div class='ch-name'>${c.name}</div><div class='ch-epg'>${cur?`▶ ${cur.title}`:''}</div></div><span>▶</span>`;
      d.onclick=()=>handleChannelClick(c,idx);cl.appendChild(d)
    }
  })
}
function handleChannelClick(c,idx){currentIndex=idx;const now=Date.now();if(lastClickedChannel&&lastClickedChannel.url===c.url&&(now-lastClickTime)<550){openFullscreen(c);}else{play(c);}lastClickTime=now;lastClickedChannel=c}
function showLoading(name){const el=document.getElementById('loading');if(el){el.style.display='flex';document.getElementById('loadingName').textContent=name}}function hideLoading(){document.getElementById('loading').style.display='none';showFsInfoTemporarily();}
function showFsInfoTemporarily(){const fi=document.getElementById('fsInfo');if(!fi)return;fi.style.transform='translateY(0)';fi.style.opacity='1';clearTimeout(fsInfoTimer);fsInfoTimer=setTimeout(()=>{fi.style.transform='translateY(100%)';fi.style.opacity='0';},4500);}
function play(c){
  currentChannel=c;const idx=visibleListCache.findIndex(x=>x.url===c.url);if(idx>=0)currentIndex=idx;
  document.getElementById('empty').style.display='none';showLoading(c.name);
  document.getElementById('now').textContent=c.name;document.getElementById('fsName').textContent=c.name;document.getElementById('fsGroup').textContent=c.group;document.getElementById('fsLogo').src=c.logo||'logo.png';
  const epg=findEpgForChannel(c);if(epg){const {cur}=getNowNext(epg.progs);document.getElementById('fsNow').textContent=cur?`Şimdi: ${cur.title}`:'';document.getElementById('nowEpg').textContent=cur?`▶ ${cur.title}`:'';}
  const isFs=document.getElementById('fsOverlay').classList.contains('active');
  if(isFs){stopPlayback(video);tryRoute(c.url,['hls-direct','hls-proxy'],0,fsVideo);}else{fsVideo.pause();fsVideo.removeAttribute('src');fsVideo.load();tryRoute(c.url,['hls-direct','hls-proxy'],0,video);}
}
function stopPlayback(v){if(v===video){if(hls){try{hls.destroy()}catch(_){}hls=null}v.pause();v.removeAttribute('src');v.load();}}
function tryRoute(o,r,i,target){
  if(i>=r.length){document.getElementById('pType').textContent='Açılamadı';hideLoading();return;}
  if(target===video)stopPlayback(target);
  const m=r[i];const prox=m.endsWith('-proxy');const ref=currentChannel?currentChannel.referrer||'':'';const u=prox?proxyUrl(o,proxyBase,ref):o;
  document.getElementById('pType').textContent=`${i+1}/${r.length} ${m}...`;
  let done=false;const to=setTimeout(()=>fin(false),8000);
  function fin(ok){if(done)return;done=true;clearTimeout(to);target.removeEventListener('playing',onP);target.removeEventListener('canplay',onP);target.removeEventListener('error',onE);if(ok){hideLoading();document.getElementById('pType').textContent=`▶ ${m} Oynuyor`;}else{tryRoute(o,r,i+1,target)}}
  function onP(){fin(true)}function onE(){fin(false)}
  target.addEventListener('playing',onP);target.addEventListener('canplay',onP);target.addEventListener('error',onE);
  try{if(Hls.isSupported()){const tmpHls=new Hls({enableWorker:true});tmpHls.loadSource(u);tmpHls.attachMedia(target);if(target===video)hls=tmpHls;tmpHls.on(Hls.Events.MANIFEST_PARSED,()=>{target.play().catch(()=>{})})}else{target.src=u;target.load();target.play().catch(()=>{})}}catch(e){fin(false)}
}
function openFullscreen(c){const over=document.getElementById('fsOverlay');over.classList.add('active');document.getElementById('fsName').textContent=c.name;stopPlayback(video);tryRoute(c.url,['hls-direct','hls-proxy'],0,fsVideo);showFsInfoTemporarily();}
function closeFullscreen(){const over=document.getElementById('fsOverlay');over.classList.remove('active');fsVideo.pause();fsVideo.removeAttribute('src');fsVideo.load();if(currentChannel)tryRoute(currentChannel.url,['hls-direct','hls-proxy'],0,video)}

// V50 FILM GRID KUMANDA
document.addEventListener('keydown', e=>{
  const key=e.key,code=e.keyCode,fsOpen=document.getElementById('fsOverlay').classList.contains('active'),focused=document.activeElement,settingsOpen=document.getElementById('settings').classList.contains('open');
  if(fsOpen){
    if(key==='Escape'||key==='Backspace'||code===8||code===10009){e.preventDefault();closeFullscreen();return}
    if(key==='ArrowUp'||code===38){e.preventDefault();if(!visibleListCache.length)return;let ni=currentIndex-1;if(ni<0)ni=visibleListCache.length-1;currentIndex=ni;play(visibleListCache[ni]);return}
    if(key==='ArrowDown'||code===40){e.preventDefault();if(!visibleListCache.length)return;let ni=currentIndex+1;if(ni>=visibleListCache.length)ni=0;currentIndex=ni;play(visibleListCache[ni]);return}
    if(key==='Enter'||code===13){e.preventDefault();document.getElementById('fsInfo').style.transform='translateY(0)';document.getElementById('fsInfo').style.opacity='1';return}
    return
  }
  if(settingsOpen){
    const focusables=[...document.querySelectorAll('#settings button, #settings input, #settings textarea')].filter(el=>el.offsetParent!==null);
    if(code===27||key==='Escape'||code===8){e.preventDefault();toggleSettings();return;}
    if(key==='Enter'||code===13){focused?.click();return;}
    if(key==='ArrowDown'||code===40){e.preventDefault();let idx=focusables.indexOf(focused);idx=Math.min(focusables.length-1,idx+1);focusables[idx]?.focus();return;}
    if(key==='ArrowUp'||code===38){e.preventDefault();let idx=focusables.indexOf(focused);idx=Math.max(0,idx-1);focusables[idx]?.focus();return;}
    return;
  }

  // ANA EKRAN + FILM GRID
  const mainGear=document.querySelector('button.gear:not(#settingsCloseBtn)')||[...document.querySelectorAll('button')].find(b=>b.textContent.includes('⚙'));
  const catTabs=[...document.querySelectorAll('.catTab')];
  const groups=[...document.querySelectorAll('#groupList.group')];
  const channels=[...document.querySelectorAll('#channelList.ch')];
  const films=[...document.querySelectorAll('#filmGrid.filmCard')];
  const isFilmMode=activeCat==='FILM'||activeCat==='DIZI';

  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape'].includes(key)||code>=37&&code<=40||code===13||code===27){
    e.preventDefault();

    // ESC = BAŞA DÖN
    if(key==='Escape'||code===27||key==='Backspace'||code===8){
      if(isFilmMode && films.includes(focused)){
        // filmden gruba dön
        if(groups[0]){groups[0].focus();focusCol=1;}
        else if(catTabs[0]){catTabs[0].focus();focusCol=0;}
      }else if(channels.includes(focused)){
        if(groups[0]){groups[0].focus();focusCol=1;}
      }else if(groups.includes(focused)){
        if(catTabs[0]){catTabs[0].focus();focusCol=0;}
      }
      return;
    }

    if(key==='Enter'||code===13){
      if(focused===mainGear){toggleSettings();return;}
      if(focused&&focused.classList.contains('catTab')){
        // FİLM'de OK = direkt alta in
        focused.click();
        setTimeout(()=>{
          if(isFilmMode||focused.dataset.cat==='FILM'||focused.dataset.cat==='DIZI'){
            const firstFilm=document.querySelector('#filmGrid.filmCard');
            if(firstFilm){firstFilm.focus();focusCol=2;}
          }else{
            const fg=document.querySelector('#groupList.group');
            if(fg){fg.focus();focusCol=1;}
          }
        },150);
        return;
      }
      if(focused&&focused.classList.contains('group')){
        focused.click();
        setTimeout(()=>{const first= isFilmMode? document.querySelector('#filmGrid.filmCard') : document.querySelector('#channelList.ch'); if(first){first.focus();focusCol=2;}},150);
        return;
      }
      if(focused&&(focused.classList.contains('ch')||focused.classList.contains('filmCard'))){focused.click();return;}
      return;
    }

    // FİLM GRID ÖZEL - 2 SÜTUNLU NAVİGASYON
    if(isFilmMode && films.length>0 && films.includes(focused)){
      const COLS=2;
      let idx=films.indexOf(focused);
      if(key==='ArrowRight'||code===39){let ni=idx+1;if(ni<films.length && Math.floor(ni/COLS)===Math.floor(idx/COLS)){films[ni].focus();}return;}
      if(key==='ArrowLeft'||code===37){let ni=idx-1;if(ni>=0 && Math.floor(ni/COLS)===Math.floor(idx/COLS)){films[ni].focus();}else if(groups[0]){groups[0].focus();focusCol=1;}return;}
      if(key==='ArrowDown'||code===40){let ni=idx+COLS;if(ni<films.length){films[ni].focus();films[ni].scrollIntoView({block:'nearest'})}return;}
      if(key==='ArrowUp'||code===38){let ni=idx-COLS;if(ni>=0){films[ni].focus();}else{if(groups[0]){groups[0].focus();focusCol=1;}}return;}
    }

    // NORMAL LİSTE NAVİGASYON
    let leftCol=[];if(mainGear)leftCol.push(mainGear);leftCol=[...leftCol,...catTabs,...groups];
    let currentList=leftCol.includes(focused)?leftCol:channels.includes(focused)?channels:films.includes(focused)?films:leftCol;

    if(key==='ArrowRight'||code===39){
      if(leftCol.includes(focused)){focusCol=2;const first=isFilmMode?films[0]:channels[0];if(first)first.focus();else video.focus();}
      return;
    }
    if(key==='ArrowLeft'||code===37){
      if(channels.includes(focused)||films.includes(focused)){focusCol=0;if(leftCol[0])leftCol[0].focus();}
      return;
    }
    if(key==='ArrowDown'||code===40){
      if(!currentList.length)return;let idx=currentList.indexOf(focused);idx=Math.min(currentList.length-1,idx+1);currentList[idx]?.focus();currentList[idx]?.scrollIntoView({block:'nearest'});return;
    }
    if(key==='ArrowUp'||code===38){
      if(!currentList.length)return;let idx=currentList.indexOf(focused);idx=Math.max(0,idx-1);currentList[idx]?.focus();currentList[idx]?.scrollIntoView({block:'nearest'});return;
    }
  }
});
window.addEventListener('load', ()=>{setTimeout(()=>{document.querySelector('.catTab.active')?.focus();},600);video.volume=1;fsVideo.volume=1;});
(async()=>{await renderSaved()})()
</script>
