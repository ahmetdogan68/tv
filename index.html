<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#060a14;color:#fff;font-family:Arial;display:flex;height:100vh;overflow:hidden}
#sidebar{width:310px;background:#0c1220;border-right:1px solid #1a2744;display:flex;flex-direction:column;z-index:10}
#logoBox{padding:16px;text-align:center;border-bottom:1px solid #1a2744;background:#080d1a}
#logoBox img{width:140px}
#logoBox h1{color:#ff0a16;font-size:22px;letter-spacing:2px;margin-top:6px}
.box{margin:8px;padding:10px;background:#111a2e;border-radius:10px;border:1px solid #1a2744}
.btn{width:100%;padding:10px;background:#ff0a16;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:6px}
.btn:hover{background:#ff1a26}.btn2{background:#1a2744;color:#ccc;border:1px dashed #ff0a16}
input[type=text]{width:100%;padding:10px;border-radius:6px;border:none;background:#060a14;color:#fff;margin-top:6px;outline:none}
#lists{padding:8px;max-height:140px;overflow-y:auto;border-bottom:1px solid #1a2744}
.list-item{padding:8px;background:#111a2e;margin:4px 0;border-radius:6px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;border:1px solid #1a2744}
.list-item.active{background:#ff0a16;border-color:#ff0a16}
#cats{display:flex;gap:6px;padding:8px;overflow-x:auto}
.cat{padding:6px 12px;background:#111a2e;border-radius:20px;cursor:pointer;font-size:12px;border:1px solid #1a2744;white-space:nowrap}
.cat.active{background:#ff0a16}
#main{flex:1;display:flex;flex-direction:column;background:#060a14;position:relative}
#grid{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;align-content:start}
.card{background:#111a2e;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid #1a2744;transition:.15s}
.card:hover{transform:scale(1.05);border-color:#ff0a16}
.poster{width:100%;aspect-ratio:3/4;object-fit:cover;background:#080d1a}
.ctitle{padding:6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#playerWrap{position:absolute;inset:0;background:#000;display:none;z-index:100;flex-direction:column}
#playerWrap.show{display:flex}
#player{flex:1;width:100%;background:#000}
#playerBar{padding:10px;background:#0c1220;display:flex;justify-content:space-between;align-items:center}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.3}
#empty img{width:200px}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="sidebar">
<div id="logoBox">
<img src="logo.png" onerror="this.style.display='none'">
<h1>MIRTI TV</h1>
</div>
<div class="box">
<label for="fileInput" style="cursor:pointer;color:#ff0a16;font-weight:bold;text-align:center;display:block">📁 DOSYA SEÇ</label>
<input type="file" id="fileInput" accept=".m3u,.m3u8,.txt">
<input type="text" id="urlInput" placeholder="https://...m3u linki">
<button class="btn" onclick="loadFromUrl()">🔗 URL'DEN SEÇ</button>
<input type="text" id="listName" placeholder="Liste adı: Örn: Benim Listem">
<button class="btn btn2" onclick="saveCurrentList()">💾 LİSTEYİ KAYDET</button>
</div>
<div id="lists"></div>
<div id="cats">
<div class="cat active" onclick="setCat('Tümü')">Tümü</div>
<div class="cat" onclick="setCat('Canlı')">Canlı TV</div>
<div class="cat" onclick="setCat('Film')">Film</div>
<div class="cat" onclick="setCat('Dizi')">Dizi</div>
</div>
<input type="text" id="search" placeholder="🔍 Kanal / Film Ara..." style="margin:8px;width:94%">
<div id="count" style="padding:0 12px;font-size:11px;color:#5a6a8a">0 içerik</div>
</div>

<div id="main">
<div id="empty"><img src="logo.png"><p style="margin-top:20px;font-size:14px;letter-spacing:2px">MIRTI TV - Liste yükle ve izle</p></div>
<div id="grid"></div>
<div id="playerWrap">
<div id="playerBar"><span id="now">Oynatılıyor</span><button class="btn" style="width:auto;padding:6px 16px" onclick="closePlayer()">KAPAT ✕</button></div>
<video id="player" controls autoplay playsinline></video>
</div>
</div>

<script>
let all=[]; let hls=null; let activeCat='Tümü';
let savedLists=JSON.parse(localStorage.getItem('mirti_multi_lists')||'{}');
let currentListName='';
const video=document.getElementById('player'); const grid=document.getElementById('grid');
const playerWrap=document.getElementById('playerWrap');

function categorize(name,group){
const s=(name+' '+group).toLowerCase();
if(s.includes('film')||s.includes('movie'))return 'Film';
if(s.includes('dizi')||s.includes('series')||s.includes('sezon'))return 'Dizi';
return 'Canlı';
}
function parseM3U(text){
const lines=text.split('\n'); const out=[];
for(let i=0;i<lines.length;i++){
let l=lines[i].trim();
if(l.startsWith('#EXTINF')){
let logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||'';
let group=(l.match(/group-title="([^"]+)"/)||[])[1]||'';
let name=l.split(',').pop().trim()||'Kanal';
let url='';
for(let j=i+1;j<lines.length;j++){
let n=lines[j].trim(); if(n &&!n.startsWith('#')){url=n; i=j; break;}
}
if(url && (url.startsWith('http')||url.startsWith('/'))){
out.push({name,logo,group,cat:categorize(name,group),url});
}
}
}
return out;
}
function renderLists(){
const box=document.getElementById('lists'); box.innerHTML='<div style=\"font-size:11px;color:#5a6a8a;padding:4px\">KAYITLI LİSTELERİM</div>';
Object.keys(savedLists).forEach(k=>{
const d=document.createElement('div'); d.className='list-item'+(k===currentListName?' active':'');
d.innerHTML=`<span>${k} (${savedLists[k].length})</span><span onclick=\"deleteList('${k}');event.stopPropagation()\" style=\"color:#ff0a16\">✕</span>`;
d.onclick=()=>{ all=savedLists[k]; currentListName=k; document.getElementById('empty').style.display='none'; render(); renderLists(); };
box.appendChild(d);
});
}
function render(){
const q=document.getElementById('search').value.toLowerCase();
const filtered=all.filter(c=>(activeCat==='Tümü'||c.cat===activeCat)&&c.name.toLowerCase().includes(q));
document.getElementById('count').textContent=filtered.length+' içerik gösteriliyor';
document.getElementById('empty').style.display=all.length?'none':'flex';
grid.innerHTML='';
filtered.forEach(c=>{
const card=document.createElement('div'); card.className='card';
const img=c.logo||`https://via.placeholder.com/300x400/111a2e/ff0a16?text=${encodeURIComponent(c.name.substring(0,15))}`;
card.innerHTML=`<img class="poster" src="${img}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x400?text=TV'"><div class="ctitle">${c.name}</div>`;
card.onclick=()=>play(c);
grid.appendChild(card);
});
}
function play(c){
if(hls){ try{hls.destroy()}catch(e){} hls=null; }
playerWrap.classList.add('show');
document.getElementById('now').textContent=c.name;
video.pause(); video.removeAttribute('src'); video.load();
// Deneme 1: hls.js
if(Hls.isSupported()){
hls=new Hls({maxBufferLength:10, enableWorker:true});
hls.loadSource(c.url); hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
hls.on(Hls.Events.ERROR,(e,d)=>{
if(d.fatal){
console.log('HLS failed, trying native');
video.src=c.url; video.play().catch(()=>{document.getElementById('now').textContent='Bu kanal açılmadı: '+c.name});
}
});
}else{
// Deneme 2: Native
video.src=c.url; video.play().catch(()=>{});
}
}
function closePlayer(){ playerWrap.classList.remove('show'); video.pause(); if(hls){try{hls.destroy()}catch(e){}} }
function setCat(cat){ activeCat=cat; document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.textContent.includes(cat))); render(); }
function saveCurrentList(){
const name=document.getElementById('listName').value.trim()||'Liste '+(Object.keys(savedLists).length+1);
if(!all.length){alert('Önce bir liste yükle abi');return;}
savedLists[name]=all; localStorage.setItem('mirti_multi_lists',JSON.stringify(savedLists)); currentListName=name; renderLists(); alert(name+' kaydedildi, artık silinmeyecek');
}
function deleteList(k){ if(confirm(k+' silinsin mi?')){ delete savedLists[k]; localStorage.setItem('mirti_multi_lists',JSON.stringify(savedLists)); renderLists(); } }
document.getElementById('fileInput').addEventListener('change',e=>{
const f=e.target.files[0]; if(!f)return; const r=new FileReader();
r.onload=ev=>{ const p=parseM3U(ev.target.result); if(p.length){ all=p; render(); document.getElementById('listName').value=f.name.replace('.m3u',''); } else alert('Liste boş veya hatalı format'); };
r.readAsText(f);
});
function loadFromUrl(){
const url=document.getElementById('urlInput').value.trim(); if(!url)return alert('URL gir');
fetch('https://corsproxy.io/?'+encodeURIComponent(url)).then(r=>r.text()).then(t=>{
const p=parseM3U(t); if(p.length){ all=p; render(); } else { // proxy olmadan dene
return fetch(url).then(r=>r.text()).then(t2=>{ const p2=parseM3U(t2); if(p2.length){ all=p2; render(); } else alert('Liste okunamadı'); });
}
}).catch(()=>{ fetch(url).then(r=>r.text()).then(t=>{ const p=parseM3U(t); if(p.length){ all=p; render(); } else alert('CORS engeli, dosyayı indirip DOSYA SEÇ ile yükle'); }).catch(()=>alert('URL açılmıyor, dosyayı indir abi')); });
}
document.getElementById('search').addEventListener('input',render);
// İlk açılışta kayıtlı listeleri göster
renderLists();
if(Object.keys(savedLists).length){ const first=Object.keys(savedLists)[0]; all=savedLists[first]; currentListName=first; render(); }
</script>
</body>
</html>
