<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRTI V36 — Kart Fix</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0a0a;color:#fff;font:14px Arial;height:100vh;display:flex;overflow:hidden}
#left{width:250px;flex-shrink:0;background:#111;border-right:1px solid #222;display:flex;flex-direction:column}
#topLeft{height:54px;background:#000;display:flex;align-items:center;padding:0 10px;gap:10px;border-bottom:1px solid #222}
.brandImg{width:38px;height:38px;border-radius:8px;object-fit:contain;background:#000;border:1px solid #333}
.brandname{font-weight:900;font-size:12px;line-height:1.1}.brandname small{color:#e50914}
.gear{margin-left:auto;background:#e50914;border:0;color:#fff;padding:8px 10px;border-radius:6px;font-weight:900;cursor:pointer}
.catTabs,.pStrip{display:flex;gap:4px;padding:6px;background:#111}
.catTab,.pBtn{flex:1;padding:10px 4px;border:1px solid #333;border-radius:6px;background:#242424;color:#fff;font-size:10px;font-weight:900;cursor:pointer}
.catTab.active{background:#e50914;border-color:#e50914}.pBtn.active{background:#fff;color:#000}.pBtn.tv{background:#08a9e8;color:#fff}
#groupList{flex:1;overflow:auto;padding:6px}
.group{padding:9px 10px;background:#202020;margin:4px 0;border-radius:6px;font-size:11px;display:flex;justify-content:space-between;cursor:pointer}
.group.active{background:#e50914;color:#fff}
#mid{width:380px;flex-shrink:0;background:#0e0e0e;border-right:1px solid #222;display:flex;flex-direction:column;min-width:0}
#searchWrap{display:flex;gap:6px;padding:8px;background:#111}
#search{flex:1;background:#fff;color:#111;border:2px solid #e50914;border-radius:8px;padding:11px;font-weight:700}
#channelList{flex:1;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:4px}
.ch{height:42px;padding:6px 8px;display:flex;align-items:center;gap:9px;background:#1e1e1e;border-radius:6px;cursor:pointer}
.ch.active{background:#e50914}.ch-logo{width:28px;height:28px;object-fit:contain;background:#000;border-radius:4px}.ch-fb{width:28px;height:28px;background:#000;color:#e50914;border-radius:4px;display:grid;place-items:center;font-weight:900}

/* V36 - ŞERİT FİX */
#filmGrid{display:none;grid-template-columns:repeat(2,1fr);gap:14px;padding:14px;overflow:auto;flex:1;background:#0a0a0a;align-content:start}
.filmCard{background:#181818;border:1px solid #2c2c2c;border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.filmCard:hover{border-color:#e50914;transform:translateY(-2px);box-shadow:0 10px 25px rgba(229,9,20,.4)}
.posterWrap{width:100%;height:220px;min-height:220px;max-height:220px;background:#000;overflow:hidden;flex-shrink:0}
.poster{width:100%;height:100%;object-fit:cover;display:block}
.posterFb{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#e50914,#300);font-size:42px;font-weight:900}
.filmInfo{padding:8px;background:#181818;min-height:48px;flex-shrink:0}
.filmTitle{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filmMeta{font-size:9px;color:#999;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#playerArea{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;background:#000}
#player{width:100%;flex:1;background:#000}
#empty{position:absolute;inset:0 0 34px;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at center,#1e1e1e,#000);text-align:center;padding:20px}
.logoBig{width:140px;height:140px;object-fit:contain;background:#000;border-radius:20px;border:2px solid #e50914;box-shadow:0 0 50px rgba(229,9,20,.5)}
#empty h2{margin-top:16px;font-size:18px;letter-spacing:2px;font-weight:900}
#empty p{margin-top:6px;color:#777;font-size:11px}
#bar{height:34px;display:flex;align-items:center;padding:0 12px;background:#111;border-top:1px solid #222;font-size:11px}
#now{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pType{color:#aaa;font-size:10px}
#settings{position:absolute;top:0;right:0;bottom:34px;width:min(500px,100%);background:#111;border-left:2px solid #e50914;overflow:auto;transform:translateX(105%);transition:.25s;padding:14px;z-index:10}
#settings.open{transform:translateX(0)}
.settingsHead{display:flex;justify-content:space-between;color:#e50914;font-weight:900}
.tabs{display:flex;gap:4px;margin-top:10px}.tab{flex:1;padding:8px;background:#222;border:1px solid #333;border-radius:5px;color:#fff;font-size:10px;font-weight:900;cursor:pointer}.tab.active{background:#e50914}
.box{display:none;margin-top:8px;padding:10px;background:#050505;border:1px solid #222;border-radius:6px}.box.active{display:block}
textarea,input{width:100%;margin-top:6px;padding:11px;background:#171717;color:#fff;border:1px solid #444;border-radius:6px}
.btn{width:100%;padding:12px;background:#e50914;color:#fff;border:0;border-radius:6px;font-weight:900;margin-top:6px;cursor:pointer}.btn.blue{background:#08a9e8}
.log{white-space:pre-wrap;font-size:11px;background:#000;color:#9cff9c;padding:10px;border-radius:6px;margin-top:8px;max-height:180px;overflow:auto}
.savedItem{padding:9px;background:#222;margin:4px 0;border-radius:6px;display:flex;justify-content:space-between;font-size:11px;cursor:pointer}
@media(max-width:900px){body{flex-direction:column;height:auto;min-height:100vh;overflow:auto}#playerArea{order:1;height:44vh;position:sticky;top:0;z-index:5}#left{order:2;width:100%;max-height:230px}#groupList{display:flex;gap:6px;overflow-x:auto;max-height:100px}.group{flex:none;white-space:nowrap}#mid{order:3;width:100%;min-height:50vh}#filmGrid{grid-template-columns:repeat(2,1fr);gap:10px}#settings{position:fixed;top:0;bottom:0}}
</style>
</head>
<body>
<aside id="left">
  <div id="topLeft">
    <img class="brandImg" src="https://raw.githubusercontent.com/ahmetdogan68/tv/main/logo.png" onerror="this.src='https://raw.githubusercontent.com/ahmetdogan68/tv/main/logo.jpg'" alt="M">
    <div class="brandname">MIRTI<br><small>V36 KART</small></div>
    <button class="gear" onclick="toggleSet()">⚙️</button>
  </div>
  <div class="catTabs">
    <button class="catTab" data-cat="CANLI" onclick="setCat('CANLI')">CANLI</button>
    <button class="catTab" data-cat="FILM" onclick="setCat('FILM')">FİLM</button>
    <button class="catTab active" data-cat="DIZI" onclick="setCat('DIZI')">DİZİ</button>
    <button class="catTab" data-cat="TUMU" onclick="setCat('TUMU')">TÜMÜ</button>
  </div>
  <div class="pStrip"><button class="pBtn tv active" data-p="tv" onclick="setPlayerMode('tv')">OTOMATİK</button><button class="pBtn" data-p="direct" onclick="setPlayerMode('direct')">DOĞRUDAN</button></div>
  <div id="groupList"></div>
</aside>
<section id="mid">
  <div id="searchWrap"><input id="search" type="text" placeholder="Kanal / film ara…"><button class="gear" onclick="toggleSet()">⚙️</button></div>
  <div id="channelList"></div><div id="filmGrid"></div>
</section>
<main id="playerArea">
  <div id="empty">
    <img class="logoBig" src="https://raw.githubusercontent.com/ahmetdogan68/tv/main/logo.png" onerror="this.src='https://raw.githubusercontent.com/ahmetdogan68/tv/main/logo.jpg'" alt="MIRTI">
    <h2>MIRTI TV</h2><p>V36 Kart Fix - Posterler tam kart</p>
  </div>
  <video id="player" controls playsinline crossorigin="anonymous"></video>
  <div id="bar"><span id="now">MIRTI V36</span><span id="pType">Hazır</span></div>
  <section id="settings">
    <div class="settingsHead"><span>V36 ŞERİT FİX</span><button class="gear" onclick="toggleSet()">KAPAT ✕</button></div>
    <div id="savedLists"></div>
    <div class="tabs"><button class="tab active" onclick="openTab(0)">URL</button><button class="tab" onclick="openTab(1)">DOSYA</button><button class="tab" onclick="openTab(2)">MANUEL</button><button class="tab" onclick="openTab(3)">TEK</button></div>
    <div class="box active" id="b0"><textarea id="urlInput" rows="3">https://dpaste.com/4QW2YVTSP.txt</textarea><button class="btn" onclick="loadUrl()">URL YÜKLE</button><button class="btn blue" onclick="loadUrl(true)">PROXY İLE DENE</button><div id="urlLog" class="log">V36 - Şerit fix: poster 220px kart</div></div>
    <div class="box" id="b1"><input id="fileInput" type="file" accept=".m3u,.m3u8,.txt"><button class="btn" onclick="loadFile()">YÜKLE</button></div>
    <div class="box" id="b2"><textarea id="manualPaste" rows="8"></textarea><button class="btn" onclick="loadManual()">YAPIŞTIR YÜKLE</button></div>
    <div class="box" id="b3"><input id="singleUrl" type="url" placeholder="https://...m3u8"><input id="singleName" type="text" placeholder="Ad"><button class="btn" onclick="playSingle()">AÇ</button></div>
    <input id="proxyInput" type="url" placeholder="Proxy"><button class="btn blue" onclick="saveProxy()">KAYDET</button><button class="btn" style="background:#333" onclick="clearSaved()">SİL</button>
  </section>
</main>
<script>
const DEFAULT_PROXY='https://hidden-meadow-0d62.a-dogan.workers.dev/?url=';
const ALLORIGINS='https://api.allorigins.win/raw?url=';const CODETABS='https://api.codetabs.com/v1/proxy?quest=';
let proxyBase=localStorage.getItem('mirtiProxyBase')||DEFAULT_PROXY;
let all=[],hls=null,mpegPlayer=null,dashPlayer=null,activeGroup='Tümü',activeCat='DIZI',playerMode='tv',currentChannel=null;
const video=document.getElementById('player');const logBox=document.getElementById('urlLog');
document.getElementById('proxyInput').value=proxyBase;
function toggleSet(){document.getElementById('settings').classList.toggle('open');}
function openTab(i){document.querySelectorAll('.box').forEach((x,j)=>x.classList.toggle('active',i===j));document.querySelectorAll('.tab').forEach((x,j)=>x.classList.toggle('active',i===j));}
function log(s){logBox.textContent=s;}
function setPlayerMode(p){playerMode=p;document.querySelectorAll('.pBtn').forEach(x=>x.classList.toggle('active',x.dataset.p===p));}
function setCat(c){activeCat=c;activeGroup='Tümü';document.querySelectorAll('.catTab').forEach(x=>x.classList.toggle('active',x.dataset.cat===c));buildGroups();}
function saveProxy(){let v=document.getElementById('proxyInput').value.trim();proxyBase=v||DEFAULT_PROXY;localStorage.setItem('mirtiProxyBase',proxyBase);alert('Kaydedildi');}
function proxyUrl(u,b=proxyBase){return b?b+encodeURIComponent(u):u;}
function cleanUrl(u){return u.trim().split('|')[0].split(';')[0].replace(/\s+/g,'');}
function cleanGroupName(g){return (g||'Genel').replace(/^[^\wİıŞşĞğÜüÖöÇç]+/,'').trim();}
function inferCat(n,g){let a=(g||'').toLowerCase(),b=(n||'').toLowerCase();if(/film|movie|sinema|kemal/.test(a)||/\(\s*(19|20)\d/.test(b))return 'FILM';if(/dizi|yerli|güncel|series/.test(a)||/bölüm/.test(b))return 'DIZI';return 'CANLI';}
function parseM3U(t){const l=t.replace(/^\uFEFF/,'').split(/\r?\n/),o=[];let tmp=null;for(const r of l){const s=r.trim();if(!s)continue;if(s.startsWith('#EXTINF')){const c=s.indexOf(',');const name=c>=0?s.slice(c+1).trim():'Kanal '+(o.length+1);const attr=k=>{const m=s.match(new RegExp("(?:^|\\s)"+k+"=[\"']([^\"']*)[\"']","i"));return m?m[1].trim():'';};tmp={name,group:attr('group-title')||'Genel',logo:attr('tvg-logo')};}else if(!s.startsWith('#')&&/^https?:\/\//i.test(s)&&tmp){let logo=tmp.logo;if(logo&&logo.startsWith('http://'))logo=logo.replace(/^http:/,'https:');o.push({...tmp,url:cleanUrl(s),logo,cat:inferCat(tmp.name,tmp.group)});tmp=null;}}return o;}
function decodePaste(t){let x=t;if(/<html/i.test(x)){let m=x.match(/<pre[^>]*>([\s\S]*?)<\/pre>/i)||x.match(/<textarea[^>]*>([\s\S]*?)<\/textarea>/i);if(m)x=m[1];x=x.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"');}return x;}
async function fetchText(u,f=false){const c=f?[proxyUrl(u),CODETABS+encodeURIComponent(u),ALLORIGINS+encodeURIComponent(u)]:[u,proxyUrl(u),CODETABS+encodeURIComponent(u),ALLORIGINS+encodeURIComponent(u)];let last='';for(const q of [...new Set(c)]){try{const r=await fetch(q,{cache:'no-store'});if(!r.ok){last='HTTP '+r.status;continue;}let t=decodePaste(await r.text());if(t.length>20&&(/#EXTM3U|#EXTINF|https?:\/\//i.test(t)))return t;last='M3U değil';}catch(e){last=e.message;}}throw new Error(last);}
async function acceptList(t,n='Liste'){const ch=parseM3U(t);if(!ch.length)throw new Error('Kanal yok');all=ch;activeGroup='Tümü';await saveList(n,ch);buildGroups();document.getElementById('empty').style.display='flex';log('✅ '+ch.length+' yayın: '+n);await renderSaved();}
async function loadUrl(f=false){const u=document.getElementById('urlInput').value.trim();if(!u){log('URL boş');return;}log('İndiriliyor…');try{const t=await fetchText(u,f);await acceptList(t,'LISTE');toggleSet();}catch(e){log('HATA: '+e.message);}}
function loadFile(){const f=document.getElementById('fileInput').files[0];if(!f){log('Dosya seç');return;}const r=new FileReader();r.onload=async()=>{try{await acceptList(String(r.result),f.name);toggleSet();}catch(e){log('HATA: '+e.message);}};r.readAsText(f);}
async function loadManual(){try{await acceptList(document.getElementById('manualPaste').value,'MANUEL');toggleSet();}catch(e){log('HATA: '+e.message);}}
function openDB(){return new Promise((res,rej)=>{const req=indexedDB.open('MirtiTV_V36',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('lists'))d.createObjectStore('lists',{keyPath:'name'});};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});}
async function saveList(n,ch){try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction('lists','readwrite');tx.objectStore('lists').put({name:n,channels:ch,count:ch.length,time:Date.now()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){}}
async function renderSaved(){const box=document.getElementById('savedLists');try{const db=await openDB();const items=await new Promise((res,rej)=>{const q=db.transaction('lists','readonly').objectStore('lists').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});box.innerHTML='<b>KAYITLI LİSTELER</b>';items.sort((a,b)=>b.time-a.time).forEach(item=>{const d=document.createElement('div');d.className='savedItem';const s=document.createElement('span');s.textContent='📁 '+item.name+' ('+item.count+')';const go=document.createElement('b');go.textContent='▶';d.append(s,go);d.onclick=()=>{all=item.channels||[];activeGroup='Tümü';buildGroups();document.getElementById('empty').style.display='flex';toggleSet();};box.appendChild(d);});if(!items.length)box.innerHTML='<b>KAYITLI</b><p style="color:#777;font-size:11px">Yok</p>';}catch(e){box.textContent='Okunamadı';}}
async function clearSaved(){if(!confirm('Sil?'))return;const db=await openDB();await new Promise(r=>{const tx=db.transaction('lists','readwrite');tx.objectStore('lists').clear();tx.oncomplete=r;});renderSaved();}
function buildGroups(){
 const base=activeCat==='TUMU'?all:all.filter(c=>c.cat===activeCat);
 const raw=[...new Set(base.map(c=>c.group||'Genel'))];
 const display=['Tümü',...raw];
 const box=document.getElementById('groupList');box.innerHTML='';
 display.forEach(g=>{
  const cnt=g==='Tümü'?base.length:base.filter(c=> (c.group||'Genel')===g || cleanGroupName(c.group)===cleanGroupName(g) ).length;
  if(cnt===0&&g!=='Tümü')return;
  const b=document.createElement('div');b.className='group'+(activeGroup===g||cleanGroupName(activeGroup)===cleanGroupName(g)?' active':'');
  const a=document.createElement('span');a.textContent=g==='Tümü'?g:cleanGroupName(g);
  const n=document.createElement('span');n.textContent=cnt;n.style.cssText='background:#000;padding:2px 6px;border-radius:4px;font-size:10px';
  b.append(a,n);b.onclick=()=>{activeGroup=g;buildGroups();};box.appendChild(b);
 });
 render();
}
function safeImg(u){return /^https?:\/\//i.test(u||'');}
function render(){
 const base=activeCat==='TUMU'?all:all.filter(c=>c.cat===activeCat);
 const q=document.getElementById('search').value.toLowerCase();
 const list=base.filter(c=>{
  const gm=activeGroup==='Tümü'||(c.group||'Genel')===activeGroup||cleanGroupName(c.group)===cleanGroupName(activeGroup);
  const sm=(c.name||'').toLowerCase().includes(q)||(c.group||'').toLowerCase().includes(q);
  return gm&&sm;
 });
 const cl=document.getElementById('channelList'),fg=document.getElementById('filmGrid');
 if(activeCat==='CANLI'){cl.style.display='flex';fg.style.display='none';}else{cl.style.display='none';fg.style.display='grid';}
 cl.innerHTML='';fg.innerHTML='';
 list.forEach(c=>{
  if(activeCat==='FILM'||activeCat==='DIZI'||activeCat==='TUMU'){
   const d=document.createElement('div');d.className='filmCard';
   const w=document.createElement('div');w.className='posterWrap';
   if(safeImg(c.logo)){
    const img=document.createElement('img');img.className='poster';img.loading='lazy';img.src=c.logo;
    img.onerror=()=>{img.onerror=null;const p=proxyUrl(c.logo);if(img.src!==p){img.src=p;}else{w.innerHTML='';w.appendChild(makePoster(c.name));}};
    w.appendChild(img);
   }else w.appendChild(makePoster(c.name));
   const info=document.createElement('div');info.className='filmInfo';
   const t=document.createElement('div');t.className='filmTitle';t.textContent=c.name;
   const m=document.createElement('div');m.className='filmMeta';m.textContent=cleanGroupName(c.group);
   info.append(t,m);d.append(w,info);d.onclick=()=>play(c);fg.appendChild(d);
  }else{
   const d=document.createElement('div');d.className='ch'+(currentChannel&&currentChannel.url===c.url?' active':'');
   if(safeImg(c.logo)){const img=document.createElement('img');img.className='ch-logo';img.loading='lazy';img.src=c.logo;img.onerror=()=>{img.replaceWith(makeLogo(c.name))};d.appendChild(img);}else d.appendChild(makeLogo(c.name));
   const inf=document.createElement('div');inf.className='ch-info';const nm=document.createElement('div');nm.className='ch-name';nm.textContent=c.name;inf.appendChild(nm);const ic=document.createElement('span');ic.textContent='▶';d.append(inf,ic);d.onclick=()=>play(c);cl.appendChild(d);
  }
 });
}
function makeLogo(n){const e=document.createElement('div');e.className='ch-fb';e.textContent=(n||'?').slice(0,1).toUpperCase();return e;}
function makePoster(n){const e=document.createElement('div');e.className='posterFb';e.textContent=(n||'?').slice(0,1).toUpperCase();return e;}
document.getElementById('search').addEventListener('input',render);
function detectFormat(u){let p='';try{p=new URL(u).pathname.toLowerCase();}catch(_){return 'unknown';}if(p.endsWith('.m3u8'))return 'hls';if(p.endsWith('.mpd'))return 'dash';if(/\.(ts|m2ts)$/.test(p))return 'mpegts';if(/\.(mp4|m4v|webm)$/.test(p))return 'native';return 'unknown';}
function stopPlayback(){if(hls){try{hls.destroy();}catch(_){}hls=null;}if(mpegPlayer){try{mpegPlayer.destroy();}catch(_){}mpegPlayer=null;}if(dashPlayer){try{dashPlayer.reset();}catch(_){}dashPlayer=null;}video.pause();video.removeAttribute('src');video.load();}
function playSingle(){const u=document.getElementById('singleUrl').value.trim();if(!/^https?:\/\//.test(u)){log('URL gir');return;}play({name:document.getElementById('singleName').value.trim()||'Tek',url:u,group:'Tek',logo:'',cat:'CANLI'});}
function play(c){currentChannel=c;document.getElementById('empty').style.display='none';document.getElementById('now').textContent=c.name;const fmt=detectFormat(c.url);const routes=fmt==='hls'?['hls-direct','hls-proxy']:fmt==='dash'?['dash-direct','dash-proxy']:fmt==='mpegts'?['ts-direct','ts-proxy']:['native-direct','native-proxy','hls-direct','hls-proxy'];tryRoute(c.url,routes,0);}
function tryRoute(o,r,i){if(i>=r.length){document.getElementById('pType').textContent='Açılamadı';document.getElementById('empty').style.display='flex';return;}stopPlayback();const m=r[i];const prox=m.endsWith('-proxy');const u=prox?proxyUrl(o):o;document.getElementById('pType').textContent=m;let done=false;const to=setTimeout(()=>fin(false),18000);function fin(ok){if(done)return;done=true;clearTimeout(to);video.removeEventListener('playing',onP);video.removeEventListener('error',onE);if(ok){document.getElementById('pType').textContent='▶ '+m;}else tryRoute(o,r,i+1);}function onP(){fin(true)}function onE(){fin(false)}video.addEventListener('playing',onP);video.addEventListener('error',onE);try{if(m.startsWith('hls-')){if(Hls.isSupported()){hls=new Hls();hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)fin(false);});hls.loadSource(u);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));}else{video.src=u;video.play().catch(()=>{});}}else if(m.startsWith('dash-')){dashPlayer=dashjs.MediaPlayer().create();dashPlayer.initialize(video,u,false);video.play().catch(()=>{});}else if(m.startsWith('ts-')){if(mpegts.getFeatureList().mseLivePlayback){mpegPlayer=mpegts.createPlayer({type:'mpegts',isLive:true,url:u});mpegPlayer.attachMediaElement(video);mpegPlayer.load();mpegPlayer.play().catch(()=>{});}else fin(false);}else{video.src=u;video.load();video.play().catch(()=>{});}}catch(e){fin(false);}}
(async()=>{await renderSaved();})();
</script>
</body>
</html>
