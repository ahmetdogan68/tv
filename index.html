<script>
const DEFAULT_PROXY='https://hidden-meadow-0d62.a-dogan.workers.dev/?url=';const CODETABS='https://api.codetabs.com/v1/proxy?quest=';const ALLORIGINS='https://api.allorigins.win/raw?url=';
const EPG_SOURCES=[
  {url:'https://www.bevy.be/download.php?file=turkey.xml',name:'TVPlus'},
  {url:'https://epgshare01.online/epgshare01/epg_ripper_TR1.xml.gz',name:'TR1'},
  {url:'https://www.bevy.be/download.php?file=turkeypremium1.xml',name:'Digiturk'},
  {url:'https://www.bevy.be/download.php?file=turkeypremium2.xml',name:'D-Smart'}
];
let proxyBase=localStorage.getItem('mirtiProxyBase')||DEFAULT_PROXY;
let all=[],hls=null,activeGroup='Tümü',activeCat='CANLI',currentChannel=null,lastClickTime=0,lastClickedChannel=null,epgData={},epgChannels={},currentIndex=-1,focusCol=0,fsInfoTimer=null,volTimer=null,visibleListCache=[];
const video=document.getElementById('player');const fsVideo=document.getElementById('fsVideo');
const logBox=document.getElementById('urlLog');const epgLogBox=document.getElementById('epgLog');
document.getElementById('proxyInput').value=proxyBase;
function toggleSettings(){document.getElementById('settings').classList.toggle('open')}
function openTab(i){document.querySelectorAll('.box').forEach((x,j)=>x.classList.toggle('active',i===j));document.querySelectorAll('.tab').forEach((x,j)=>x.classList.toggle('active',i===j));}
function log(s){if(logBox)logBox.textContent=s}
function epgLog(s){if(epgLogBox)epgLogBox.textContent+='\n'+s}
function setCat(c){activeCat=c;activeGroup='Tümü';document.querySelectorAll('.catTab').forEach(x=>x.classList.toggle('active',x.dataset.cat===c));buildGroups();focusCol=0;setTimeout(()=>{const firstGroup=document.querySelector('#groupList.group');if(firstGroup){focusCol=1;firstGroup.focus();}else{const firstCh=document.querySelector('#channelList.ch, #filmGrid.filmCard');if(firstCh){focusCol=2;firstCh.focus()}}},120)}
function saveProxy(){proxyBase=document.getElementById('proxyInput').value.trim()||DEFAULT_PROXY;localStorage.setItem('mirtiProxyBase',proxyBase);alert('Kaydedildi')}
function proxyUrl(u,b=proxyBase){return b?b+encodeURIComponent(u):u}
function cleanUrl(u){return u.trim().split('|')[0].split(';')[0].replace(/\s+/g,'')}
function cleanGroupName(g){return (g||'Genel').replace(/^[^\wİıŞşĞğÜüÖöÇç]+/,'').trim()}
function inferCat(name,group){
  let g=(group||'').toString().toLocaleLowerCase('tr-TR');let n=(name||'').toString().toLocaleLowerCase('tr-TR');
  const norm=s=>s.replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ş/g,'s').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
  g=norm(g);n=norm(n);let c=g+' '+n;
  if(g.includes('dizi')||g.includes('diziler'))return 'DIZI';
  if(g.includes('filim')||g.includes('film')||g.includes('filmler')||g.includes('sinema'))return 'FILM';
  if(g.includes('series'))return 'DIZI';if(g.includes('movie')||g.includes('vod'))return 'FILM';
  if(/c\d{1,3}/.test(c))return 'FILM';
  if(/s\d{1,2}\s*e\d{1,2}/i.test(c)||/\d{1,2}x\d{1,2}/.test(c)||c.includes('sezon')||c.includes('bolum')||c.includes('episode'))return 'DIZI';
  return 'CANLI';
}
function extractEpgUrlFromM3U(text){const first=text.split('\n').slice(0,20).join('\n');let m=first.match(/(?:url-tvg|x-tvg-url|tvg-url)\s*=\s*["']([^"']+)["']/i);if(m)return m[1].trim();m=first.match(/url-tvg\s*=\s*([^\s"']+\.xml[^\s"']*)/i);if(m)return m[1].trim();return null;}
function parseM3U(t){const lines=t.replace(/^\uFEFF/,'').split(/\r?\n/),out=[];let tmp=null;for(const raw of lines){const l=raw.trim();if(!l)continue;if(l.startsWith('#EXTINF')){const comma=l.indexOf(',');const name=comma>=0?l.slice(comma+1).trim():'Kanal '+(out.length+1);const attr=k=>{const m=l.match(new RegExp('(?:^|\\s)'+k+'=["\']([^"\']*)["\']','i'));return m?m[1].trim():'';};tmp={name:name||'Kanal '+(out.length+1),group:attr('group-title')||'Genel',logo:attr('tvg-logo'),tvgId:attr('tvg-id'),tvgName:attr('tvg-name')};}else if(!l.startsWith('#')&&/^https?:\/\//i.test(l)&&tmp){let logo=tmp.logo;if(logo&&logo.startsWith('http://'))logo=logo.replace(/^http:/,'https:');out.push({...tmp,url:cleanUrl(l),logo,cat:inferCat(tmp.name,tmp.group)});tmp=null;}}return out}
async function fetchText(url,force=false){const cands=force?[proxyUrl(url),CODETABS+encodeURIComponent(url),ALLORIGINS+encodeURIComponent(url)]:[url,proxyUrl(url),CODETABS+encodeURIComponent(url)];let last='';for(const u of [...new Set(cands)]){try{const r=await fetch(u,{cache:'no-store',signal:AbortSignal.timeout(12000)});if(!r.ok){last='HTTP '+r.status;continue;}let txt=await r.text();if(txt.length>20&&(/#EXTM3U|#EXTINF|https?:\/\//i.test(txt)))return txt;last='M3U değil';}catch(e){last=e.message}}throw new Error(last)}
async function fetchEpgText(u,f=false){const urls=f?[proxyUrl(u),CODETABS+encodeURIComponent(u),ALLORIGINS+encodeURIComponent(u)]:[u,proxyUrl(u),CODETABS+encodeURIComponent(u)];let last='';for(const q of [...new Set(urls)]){try{const r=await fetch(q,{cache:'no-store',signal:AbortSignal.timeout(20000)});if(!r.ok){last='HTTP '+r.status;continue;}const buf=await r.arrayBuffer();const u8=new Uint8Array(buf);let text='';if(u8[0]===0x1f&&u8[1]===0x8b){text=pako.ungzip(u8,{to:'string'})}else{text=new TextDecoder().decode(u8)}if(text.includes('<tv')||text.includes('<programme'))return text;last='XML değil';}catch(e){last=e.message}}throw new Error(last)}
async function acceptList(text,name='Liste'){const ch=parseM3U(text);if(!ch.length)throw new Error('Kanal yok');all=ch;activeGroup='Tümü';await saveList(name,ch);buildGroups();log('✅ '+ch.length+' CANLI='+ch.filter(x=>x.cat==='CANLI').length+' FILM='+ch.filter(x=>x.cat==='FILM').length+' DIZI='+ch.filter(x=>x.cat==='DIZI').length);await renderSaved();const epgUrlInM3u=extractEpgUrlFromM3U(text);if(epgUrlInM3u){epgLog('EPG bulundu: '+epgUrlInM3u.slice(0,70)+' indiriliyor...');try{const epgTxt=await fetchEpgText(epgUrlInM3u,true);loadEpgMap(epgTxt,'M3U-EPG');epgLog('✅ EPG yüklendi')}catch(e){epgLog('❌ EPG hata '+e.message)}}}
async function loadUrl(fp=false){const url=document.getElementById('urlInput').value.trim();if(!url){log('URL boş');return;}log('İndiriliyor…');try{const t=await fetchText(url,fp);await acceptList(t,'LISTE');toggleSettings()}catch(e){log('HATA: '+e.message)}}
function loadFile(){const f=document.getElementById('fileInput').files[0];if(!f){log('Dosya seç');return;}const r=new FileReader();r.onload=async()=>{try{await acceptList(String(r.result),f.name);toggleSettings()}catch(e){log('HATA: '+e.message)}};r.readAsText(f)}
function parseXmltvDate(s){try{const m=s.match(/(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})?\s*([+-]\d{4})?/);if(!m)return new Date();let y=+m[1],mo=+m[2]-1,d=+m[3],h=+m[4],mi=+m[5],sec=+(m[6]||0);let dt=new Date(Date.UTC(y,mo,d,h,mi,sec));if(m[7]){let sign=m[7][0]==='+'?1:-1;let offH=+m[7].slice(1,3),offM=+m[7].slice(3,5);let offMin=sign*(offH*60+offM);dt=new Date(dt.getTime()-offMin*60000);}return dt;}catch(e){return new Date()}}
function parseEpgXml(xmlText){const parser=new DOMParser();const xml=parser.parseFromString(xmlText,'text/xml');const channels=xml.querySelectorAll('channel');const chanMap={};channels.forEach(ch=>{const id=ch.getAttribute('id');if(!id)return;const names=[...ch.querySelectorAll('display-name')].map(n=>n.textContent.trim());chanMap[id]=names;});const progs=xml.querySelectorAll('programme');const data={};progs.forEach(p=>{const chId=p.getAttribute('channel');const start=parseXmltvDate(p.getAttribute('start'));const stop=parseXmltvDate(p.getAttribute('stop'));const titleEl=p.querySelector('title');const title=titleEl?titleEl.textContent.trim():'';if(!data[chId])data[chId]=[];data[chId].push({start,stop,title});});Object.keys(data).forEach(k=>{data[k].sort((a,b)=>a.start-b.start);});return {chanMap,data}}
function loadEpgMap(xmlText,src='EPG'){try{const {chanMap,data}=parseEpgXml(xmlText);Object.keys(data).forEach(k=>{if(!epgData[k])epgData[k]=[];epgData[k]=epgData[k].concat(data[k]);epgData[k].sort((a,b)=>a.start-b.start);});Object.assign(epgChannels,chanMap);epgLog(`✅ ${src}: ${Object.keys(epgChannels).length} kanal`);render();}catch(e){epgLog(`❌ ${src} Hata`)}}
async function loadEpg(){let url=document.getElementById('epgUrl').value.trim();if(!url){epgLog('URL boş');return;}try{const txt=await fetchEpgText(url,true);loadEpgMap(txt,'Elle')}catch(e){epgLog('HATA: '+e.message)}}
async function autoLoadEmbeddedEpg(){for(let i=0;i<EPG_SOURCES.length;i++){try{const txt=await fetchEpgText(EPG_SOURCES[i].url,true);if(txt.length>1000)loadEpgMap(txt,EPG_SOURCES[i].name);await new Promise(r=>setTimeout(r,600))}catch(e){}}}
function findEpgForChannel(ch){if(!ch||!Object.keys(epgData).length)return null;const ids=[ch.tvgId,ch.tvgName,ch.name].filter(Boolean);for(let id of ids){if(epgData[id])return {id,progs:epgData[id]};let f=Object.keys(epgData).find(k=>k.toLowerCase()===id.toLowerCase());if(f)return {id:f,progs:epgData[f]}}for(let k of Object.keys(epgChannels)){let names=epgChannels[k]||[];if(names.some(n=>ids.some(i=>i&&(n.toLowerCase().includes(i.toLowerCase())||i.toLowerCase().includes(n.toLowerCase()))))){if(epgData[k])return {id:k,progs:epgData[k]}}}return null}
function getNowNext(progs){const now=new Date();let cur=null,nxt=null;for(let i=0;i<progs.length;i++){if(progs[i].start<=now&&progs[i].stop>now){cur=progs[i];nxt=progs[i+1]||null;break;}if(progs[i].start>now){nxt=progs[i];break;}}return {cur,nxt}}
function openDB(){return new Promise((res,rej)=>{const req=indexedDB.open('MirtiTV_V47',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('lists'))d.createObjectStore('lists',{keyPath:'name'})};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function saveList(n,ch){try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction('lists','readwrite');tx.objectStore('lists').put({name:n,channels:ch,count:ch.length,time:Date.now()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
async function renderSaved(){const box=document.getElementById('savedLists');if(!box)return;try{const db=await openDB();const items=await new Promise((res,rej)=>{const q=db.transaction('lists','readonly').objectStore('lists').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});box.innerHTML='<b>KAYITLI</b>';items.sort((a,b)=>b.time-a.time).forEach(it=>{const d=document.createElement('div');d.className='savedItem';d.innerHTML=`<span>📁 ${it.name} (${it.count})</span><b>▶</b>`;d.onclick=()=>{all=it.channels||[];activeGroup='Tümü';buildGroups();document.getElementById('empty').style.display='flex';toggleSettings()};box.appendChild(d)});}catch(e){}}
async function clearSaved(){if(!confirm('Sil?'))return;const db=await openDB();await new Promise(r=>{const tx=db.transaction('lists','readwrite');tx.objectStore('lists').clear();tx.oncomplete=r});renderSaved()}
function buildGroups(){
  const base=activeCat==='TUMU'?all:all.filter(c=>c.cat===activeCat);
  const raw=[...new Set(base.map(c=>c.group||'Genel'))];
  const display=['Tümü',...raw];
  const box=document.getElementById('groupList');box.innerHTML='';
  display.forEach(g=>{
    const cnt=g==='Tümü'?base.length:base.filter(c=>(c.group||'Genel')===g||cleanGroupName(c.group)===cleanGroupName(g)).length;
    if(cnt===0&&g!=='Tümü')return;
    const b=document.createElement('div');b.className='group'+(activeGroup===g||cleanGroupName(activeGroup)===cleanGroupName(g)?' active':'');b.tabIndex=0;
    b.innerHTML=`<span>${g==='Tümü'?g:cleanGroupName(g)}</span><span style='background:#000;padding:2px 6px;border-radius:4px;font-size:10px'>${cnt}</span>`;
    b.onclick=()=>{activeGroup=g;buildGroups();};
    box.appendChild(b)
  });
  render()
}
function safeImg(u){return /^https?:\/\//i.test(u||'')}
function render(){
  try{
    const base=activeCat==='TUMU'?all:all.filter(c=>c.cat===activeCat);
    const list=base.filter(c=>(activeGroup==='Tümü'||(c.group||'Genel')===activeGroup||cleanGroupName(c.group)===cleanGroupName(activeGroup)));
    visibleListCache=list;
    const cl=document.getElementById('channelList'),fg=document.getElementById('filmGrid');
    if(activeCat==='CANLI'||activeCat==='TUMU'){cl.style.display='flex';fg.style.display='none'}else{cl.style.display='none';fg.style.display='grid'}
    cl.innerHTML='';fg.innerHTML='';
    document.getElementById('midCount').textContent=`${activeGroup.toUpperCase()} • ${list.length}`;
    list.forEach((c,idx)=>{
      if(activeCat==='FILM'||activeCat==='DIZI'){
        const d=document.createElement('div');d.className='filmCard';d.tabIndex=0;
        const wrap=document.createElement('div');wrap.className='posterWrap';
        if(safeImg(c.logo)){const img=document.createElement('img');img.className='poster';img.src=c.logo;wrap.appendChild(img)}else{const fb=document.createElement('div');fb.className='posterFb';fb.textContent=(c.name||'?')[0].toUpperCase();wrap.appendChild(fb)}
        const info=document.createElement('div');info.className='filmInfo';info.innerHTML=`<div class='filmTitle'>${c.name}</div><div class='filmMeta'>${c.group}</div>`;d.append(wrap,info);
        d.onclick=()=>handleChannelClick(c,idx);fg.appendChild(d)
      }else{
        const epgMatch=findEpgForChannel(c);let cur=null;if(epgMatch){const {cur:cc}=getNowNext(epgMatch.progs);cur=cc}
        const d=document.createElement('div');d.className='ch'+(currentChannel&&currentChannel.url===c.url?' active':'');d.tabIndex=0;
        d.innerHTML=`${safeImg(c.logo)?`<img class='ch-logo' src='${c.logo}'>`:`<div class='ch-fb'>${(c.name||'?')[0].toUpperCase()}</div>`}<div class='ch-info'><div class='ch-name'>${c.name}</div><div class='ch-epg'>${cur?`▶ ${cur.title}`:''}</div></div><span>▶</span>`;
        d.onclick=()=>handleChannelClick(c,idx);cl.appendChild(d)
      }
    })
  }catch(e){log('Render hata')}
}
function handleChannelClick(c,idx){
  currentIndex=idx;
  const now=Date.now();
  if(lastClickedChannel&&lastClickedChannel.url===c.url&&(now-lastClickTime)<550){
    openFullscreen(c);
  }else{
    play(c);
  }
  lastClickTime=now;lastClickedChannel=c
}
function showLoading(name){const el=document.getElementById('loading');const nm=document.getElementById('loadingName');if(el){el.style.display='flex';if(nm)nm.textContent=name||'YÜKLENİYOR...'} }
function hideLoading(){const el=document.getElementById('loading');if(el)el.style.display='none';showFsInfoTemporarily();}
function showFsInfoTemporarily(){const fsInfo=document.getElementById('fsInfo');if(!fsInfo)return;fsInfo.style.transform='translateY(0)';fsInfo.style.opacity='1';clearTimeout(fsInfoTimer);fsInfoTimer=setTimeout(()=>{fsInfo.style.transform='translateY(100%)';fsInfo.style.opacity='0';},4500);}
function play(c){
  currentChannel=c;
  const idx=visibleListCache.findIndex(x=>x.url===c.url);
  if(idx>=0)currentIndex=idx;
  document.getElementById('empty').style.display='none';
  showLoading(c.name);
  document.getElementById('now').textContent=c.name;
  document.getElementById('fsName').textContent=c.name;
  document.getElementById('fsGroup').textContent=c.group||'Genel';
  document.getElementById('fsLogo').src=c.logo||'logo.png';
  const epgMatch=findEpgForChannel(c);
  if(epgMatch){
    const {cur,nxt}=getNowNext(epgMatch.progs);
    document.getElementById('fsNow').textContent=cur?`Şimdi: ${cur.title}`:'';
    document.getElementById('fsNext').textContent=nxt?`Sonra: ${nxt.title}`:'';
    document.getElementById('nowEpg').textContent=cur?`▶ ${cur.title}`:'';
  }else{document.getElementById('fsNow').textContent='';document.getElementById('fsNext').textContent='';document.getElementById('nowEpg').textContent='';}
  document.getElementById('urlDisplay').textContent='URL: '+c.url.slice(0,80);
  const isFs=document.getElementById('fsOverlay').classList.contains('active');
  if(isFs){stopPlayback(video);tryRoute(c.url,['hls-direct','hls-proxy'],0,fsVideo);}else{fsVideo.pause();fsVideo.removeAttribute('src');fsVideo.load();tryRoute(c.url,['hls-direct','hls-proxy'],0,video);}
}
function stopPlayback(v){if(v===video){if(hls){try{hls.destroy()}catch(_){}hls=null}v.pause();v.removeAttribute('src');v.load();}}
function tryRoute(o,r,i,target){
  if(i>=r.length){document.getElementById('pType').textContent='Açılamadı';hideLoading();return;}
  if(target===video)stopPlayback(target);
  const m=r[i];const prox=m.endsWith('-proxy');const u=prox?proxyUrl(o):o;
  document.getElementById('pType').textContent=`${i+1}/${r.length} ${m}...`;
  let done=false;const to=setTimeout(()=>fin(false),8000);
  function fin(ok){if(done)return;done=true;clearTimeout(to);target.removeEventListener('playing',onP);target.removeEventListener('canplay',onP);target.removeEventListener('error',onE);if(ok){hideLoading();document.getElementById('pType').textContent=`▶ ${m} Oynuyor`;}else{tryRoute(o,r,i+1,target)}}
  function onP(){fin(true)}function onE(){fin(false)}
  target.addEventListener('playing',onP);target.addEventListener('canplay',onP);target.addEventListener('error',onE);
  try{if(Hls.isSupported()){const tmpHls=new Hls({enableWorker:true});tmpHls.loadSource(u);tmpHls.attachMedia(target);if(target===video)hls=tmpHls;tmpHls.on(Hls.Events.MANIFEST_PARSED,()=>{target.play().catch(()=>{})})}else{target.src=u;target.load();target.play().catch(()=>{})}}catch(e){fin(false)}
}
function openFullscreen(c){const over=document.getElementById('fsOverlay');over.classList.add('active');document.getElementById('fsName').textContent=c.name;document.getElementById('fsGroup').textContent=c.group||'Genel';document.getElementById('fsLogo').src=c.logo||'logo.png';stopPlayback(video);tryRoute(c.url,['hls-direct','hls-proxy'],0,fsVideo);showFsInfoTemporarily();}
function closeFullscreen(){const over=document.getElementById('fsOverlay');over.classList.remove('active');fsVideo.pause();fsVideo.removeAttribute('src');fsVideo.load();if(currentChannel){tryRoute(currentChannel.url,['hls-direct','hls-proxy'],0,video)}}
function setVolume(delta){let target=document.getElementById('fsOverlay').classList.contains('active')?fsVideo:video;let nv=Math.min(1,Math.max(0,target.volume+delta));target.volume=nv;video.volume=nv;fsVideo.volume=nv;const pct=Math.round(nv*100);document.getElementById('volText').textContent=pct+'%';document.getElementById('volFill').style.width=pct+'%';document.getElementById('fsVol').textContent='🔊 '+pct+'%';const bar=document.getElementById('volumeBar');bar.style.display='block';clearTimeout(volTimer);volTimer=setTimeout(()=>{bar.style.display='none'},2000);showFsInfoTemporarily();}

// GOOGLE TV KUMANDA - OK x3 MANTIGI
document.addEventListener('keydown', e=>{
  const key=e.key;const code=e.keyCode;const fsOpen=document.getElementById('fsOverlay').classList.contains('active');
  const focused=document.activeElement;

  if(fsOpen){
    if(key==='Escape'||key==='Backspace'||code===8||code===10009){e.preventDefault();closeFullscreen();return}
    if(key==='Enter'||key===' '||code===13){e.preventDefault();const fi=document.getElementById('fsInfo');if(fi.style.transform.includes('100%')||fi.style.opacity==='0'){fi.style.transform='translateY(0)';fi.style.opacity='1';clearTimeout(fsInfoTimer);fsInfoTimer=setTimeout(()=>{fi.style.transform='translateY(100%)';fi.style.opacity='0';},4500);}else{fi.style.transform='translateY(100%)';fi.style.opacity='0';}return}
    if(key==='ArrowUp'||code===38){e.preventDefault();if(!visibleListCache.length)return;let ni=currentIndex-1;if(ni<0)ni=visibleListCache.length-1;currentIndex=ni;play(visibleListCache[ni]);return}
    if(key==='ArrowDown'||code===40){e.preventDefault();if(!visibleListCache.length)return;let ni=currentIndex+1;if(ni>=visibleListCache.length)ni=0;currentIndex=ni;play(visibleListCache[ni]);return}
    if(key==='ArrowLeft'||code===37){e.preventDefault();setVolume(-0.08);return}
    if(key==='ArrowRight'||code===39){e.preventDefault();setVolume(0.08);return}
    return
  }

  // ANA EKRAN
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(key) || key===' ' || (code>=37&&code<=40) || code===13){
    e.preventDefault();

    const catTabs=[...document.querySelectorAll('.catTab')];
    const groups=[...document.querySelectorAll('#groupList.group')];
    const channels=[...document.querySelectorAll('#channelList.ch, #filmGrid.filmCard')];

    // OK MANTIGI
    if(key==='Enter'||key===' '||code===13){
      // 1. Kategorideysek -> Gruba geç
      if(focused && focused.classList.contains('catTab')){
        focusCol=1;
        if(groups[0]){groups[0].focus(); groups[0].scrollIntoView({block:'nearest'})}
        return;
      }
      // 2. Gruptaysak -> Kanala geç
      if(focused && focused.classList.contains('group')){
        focused.click(); // grubu seç
        focusCol=2;
        setTimeout(()=>{if(channels[0]){channels[0].focus(); channels[0].scrollIntoView({block:'nearest'})}},150);
        return;
      }
      // 3. Kanaldaysak -> Oynat / Tam Ekran
      if(focused && (focused.classList.contains('ch')||focused.classList.contains('filmCard'))){
        focused.click(); // handleChannelClick icinde 1.tik oynat 2.tik tam ekran
        return;
      }
      // 4. Videodaysak -> Tam ekran
      if(focused===video && currentChannel){openFullscreen(currentChannel);return}
      return;
    }

    if(key==='ArrowRight'||code===39){
      if(focusCol===0){focusCol=1;if(groups[0])groups[0].focus();}
      else if(focusCol===1){focusCol=2;if(channels[0])channels[0].focus();}
      else if(focusCol===2){focusCol=3;video.focus();}
      return;
    }
    if(key==='ArrowLeft'||code===37){
      if(focusCol===3){focusCol=2;if(channels[currentIndex>=0?currentIndex:0])channels[currentIndex>=0?currentIndex:0].focus();}
      else if(focusCol===2){focusCol=1;if(groups[0])groups[0].focus();}
      else if(focusCol===1){focusCol=0;if(catTabs[0])catTabs[0].focus();}
      return;
    }
    if(key==='ArrowDown'||code===40){
      let list=focusCol===0?catTabs:focusCol===1?groups:channels;
      if(!list.length)return;
      let idx=list.indexOf(focused);if(idx===-1)idx=-1;idx=Math.min(list.length-1,idx+1);if(list[idx]){list[idx].focus();list[idx].scrollIntoView({block:'nearest',behavior:'smooth'})}
      return;
    }
    if(key==='ArrowUp'||code===38){
      let list=focusCol===0?catTabs:focusCol===1?groups:channels;
      if(!list.length)return;
      let idx=list.indexOf(focused);if(idx===-1)idx=list.length;idx=Math.max(0,idx-1);if(list[idx]){list[idx].focus();list[idx].scrollIntoView({block:'nearest',behavior:'smooth'})}
      return;
    }
  }
  if(key==='Escape'||code===27){if(document.getElementById('settings').classList.contains('open')){toggleSettings();e.preventDefault()}}
});
window.addEventListener('load', ()=>{focusCol=0;setTimeout(()=>{const f=document.querySelector('.catTab.active');if(f){f.focus();log('OK Mantığı: OK=Sağa geç, Kanalda OK=Oynat, 2.OK=Tam Ekran')} },600);video.volume=1;fsVideo.volume=1;});
(async()=>{await renderSaved()})()
</script>
