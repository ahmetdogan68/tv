<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070b14;color:#fff;font-family:Arial;display:flex;height:100vh}
#sidebar{width:320px;background:#0e1424;border-right:2px solid #1a2744;display:flex;flex-direction:column}
#logo{text-align:center;padding:12px;border-bottom:1px solid #1a2744}
#logo h1{color:#ff0a16;letter-spacing:3px}
.box{margin:8px;padding:10px;background:#151d32;border-radius:8px;border:1px solid #1a2744}
.btn{width:100%;padding:10px;background:#ff0a16;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:6px}
.btn2{background:#1a2744;border:1px dashed #ff0a16;color:#ff0a16}
input{width:100%;padding:8px;border-radius:6px;border:none;background:#070b14;color:#fff;margin-top:6px}
#lists{padding:8px;max-height:120px;overflow-y:auto}
.list-item{padding:8px;background:#151d32;margin:3px 0;border-radius:6px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;border:1px solid #1a2744}
.list-item.active{background:#ff0a16}
#cats{padding:8px;display:flex;flex-direction:column;gap:5px;max-height:200px;overflow-y:auto;border-top:1px solid #1a2744;border-bottom:1px solid #1a2744}
.cat{padding:8px;background:#151d32;border-radius:6px;cursor:pointer;font-size:13px;border:1px solid #1a2744}
.cat.active{background:#ff0a16}
#channels{flex:1;overflow-y:auto;padding:8px}
.ch{padding:8px;background:#151d32;margin:4px 0;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid #1a2744}
.ch:hover,.ch.active{background:#ff0a16}
#main{flex:1;background:#000;display:flex;flex-direction:column;position:relative}
#player{flex:1;width:100%;background:#000}
#bar{padding:10px;background:#0e1424;display:flex;justify-content:space-between}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5a6a8a}
#empty img{width:180px;opacity:.5}
</style>
</head>
<body>
<div id="sidebar">
<div id="logo"><h1>MIRTI TV</h1><div style="font-size:10px;color:#5a6a8a">IPTV PLAYER</div></div>

<div class="box">
<label for="fileInput" style="display:block;text-align:center;color:#ff0a16;font-weight:bold;cursor:pointer;padding:6px;border:1px dashed #ff0a16;border-radius:6px">📁 DOSYA SEÇ (M3U)</label>
<input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" style="display:none">
<div style="font-size:10px;color:#5a6a8a;text-align:center;margin-top:6px">URL CORS yüzünden çalışmıyor, dosyayı indir</div>
<input type="text" id="listName" placeholder="Liste adı ver: Örn: Canlılar">
<button class="btn btn2" onclick="saveList()">💾 LİSTEYİ KAYDET (Silinmez)</button>
</div>

<div id="lists"></div>
<div id="cats"></div>
<input type="text" id="search" placeholder="Kanal ara..." style="margin:8px;width:94%">
<div id="count" style="padding:0 10px;font-size:11px;color:#5a6a8a">0 kanal</div>
<div id="channels"></div>
</div>

<div id="main">
<div id="empty"><img src="logo.png" onerror="this.style.display='none'"><h2 style="margin-top:10px">MIRTI TV</h2><p style="margin-top:6px;font-size:12px">Dosya seç ve izle - Liste otomatik kayıtlı kalır</p></div>
<video id="player" controls autoplay playsinline></video>
<div id="bar"><span id="now">Hazır</span><button class="btn" style="width:auto;padding:4px 12px" onclick="player.pause()">Durdur</button></div>
</div>

<script>
let all=[]; let hls=null; let activeGroup='Tümü';
let saved=JSON.parse(localStorage.getItem('MIRTI_LISTS_V2')||'{}');
const video=document.getElementById('player');

function parseM3U(text){
console.log('Parsing',text.length);
const lines=text.split(/\r?\n/);
const out=[];
let temp={name:'',logo:'',group:'Genel'};
for(let i=0;i<lines.length;i++){
let line=lines[i].trim();
if(!line) continue;
if(line.startsWith('#EXTINF')){
let name=line.split(',').pop().trim();
if(name) temp.name=name;
let g=(line.match(/group-title="([^"]+)"/)||[])[1];
if(g) temp.group=g;
let logo=(line.match(/tvg-logo="([^"]+)"/)||[])[1];
if(logo) temp.logo=logo;
}else if(line.startsWith('#')){ continue; }
else if(line.startsWith('http')){
let url=line.trim();
let group=temp.group||'Genel';
if(!temp.name) temp.name='Kanal '+(out.length+1);
out.push({name:temp.name,logo:temp.logo,group:group,url:url});
temp={name:'',logo:'',group:'Genel'};
}
}
return out;
}

function saveList(){
if(!all.length){alert('Önce DOSYA SEÇ ile liste yükle');return;}
let name=document.getElementById('listName').value.trim()||'Liste '+(Object.keys(saved).length+1);
saved[name]=all;
localStorage.setItem('MIRTI_LISTS_V2',JSON.stringify(saved));
currentList=name;
renderLists();
alert(name+' kaydedildi! Artık silinmeyecek, TV'yi kapat açsan bile duracak.');
}
function renderLists(){
const box=document.getElementById('lists');
box.innerHTML='';
Object.keys(saved).forEach(k=>{
const d=document.createElement('div'); d.className='list-item'+(k===currentList?' active':'');
d.innerHTML=`<span>📁 ${k} (${saved[k].length})</span><span onclick="delList('${k}')" style="color:#ff0a16">X</span>`;
d.onclick=(e)=>{ if(e.target.tagName!=='SPAN'||!e.target.textContent.includes('X')){ all=saved[k]; currentList=k; buildCats(); renderChannels(); renderLists(); document.getElementById('empty').style.display='none'; } };
box.appendChild(d);
});
}
function delList(k){ if(confirm(k+' silinsin mi?')){ delete saved[k]; localStorage.setItem('MIRTI_LISTS_V2',JSON.stringify(saved)); renderLists(); } }

function buildCats(){
const cats=document.getElementById('cats');
const groups=['Tümü',...new Set(all.map(c=>c.group))];
cats.innerHTML='';
groups.forEach(g=>{
const count=all.filter(c=>c.group===g).length||all.length;
if(g==='Tümü'){
const b=document.createElement('div'); b.className='cat'+(activeGroup===g?' active':''); b.textContent=`Tümü (${all.length})`; b.onclick=()=>{activeGroup=g; buildCats(); renderChannels();}; cats.appendChild(b);
}else{
const b=document.createElement('div'); b.className='cat'+(activeGroup===g?' active':''); b.textContent=`${g} (${all.filter(x=>x.group===g).length})`; b.onclick=()=>{activeGroup=g; buildCats(); renderChannels();}; cats.appendChild(b);
}
});
}

function renderChannels(){
const q=document.getElementById('search').value.toLowerCase();
const box=document.getElementById('channels');
let filtered=all.filter(c=>(activeGroup==='Tümü'||c.group===activeGroup)&&c.name.toLowerCase().includes(q));
document.getElementById('count').textContent=filtered.length+' kanal';
box.innerHTML='';
filtered.forEach(c=>{
const d=document.createElement('div'); d.className='ch'; d.textContent=c.name; d.title=c.group;
d.onclick=()=>{ document.querySelectorAll('.ch').forEach(x=>x.classList.remove('active')); d.classList.add('active'); play(c); };
box.appendChild(d);
});
}

function play(c){
if(hls){try{hls.destroy()}catch(e){} hls=null;}
document.getElementById('empty').style.display='none';
document.getElementById('now').textContent=c.name;
video.pause(); video.removeAttribute('src'); video.load();
if(Hls.isSupported()){
hls=new Hls(); hls.loadSource(c.url); hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
hls.on(Hls.Events.ERROR,(ev,data)=>{ if(data.fatal){ video.src=c.url; video.play().catch(()=>{ document.getElementById('now').textContent='Açılmadı: '+c.name; }); }});
}else{ video.src=c.url; video.play().catch(()=>{}); }
}

let currentList='';
document.getElementById('fileInput').addEventListener('change',e=>{
const f=e.target.files[0]; if(!f)return;
const r=new FileReader();
r.onload=ev=>{
const parsed=parseM3U(ev.target.result);
console.log('Parsed count',parsed.length);
if(parsed.length){ all=parsed; currentList=''; activeGroup='Tümü'; document.getElementById('listName').value=f.name.replace('.m3u','').replace('.m3u8',''); document.getElementById('empty').style.display='none'; buildCats(); renderChannels(); } else alert('Liste boş! M3U dosyası EXTINF formatında olmalı');
};
r.readAsText(f);
});
document.getElementById('search').addEventListener('input',renderChannels);
renderLists();
if(Object.keys(saved).length){ let k=Object.keys(saved)[0]; all=saved[k]; currentList=k; buildCats(); renderChannels(); document.getElementById('empty').style.display='none'; renderLists(); }
</script>
</body>
</html>
