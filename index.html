<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070b14;color:#fff;font-family:Arial;height:100vh;display:flex;overflow:hidden}
#left{width:260px;min-width:260px;background:#0b1120;border-right:2px solid #ff0a16;display:flex;flex-direction:column}
#mid{width:360px;min-width:360px;background:#0e1424;border-right:2px solid #1e2d4a;display:flex;flex-direction:column}
#playerArea{flex:1;background:#000;display:flex;flex-direction:column;position:relative;min-width:300px}
#logoTop{padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #1e2d4a;background:#080e1e}
#logoTop img{width:38px;height:38px;border-radius:6px;object-fit:contain;background:#000}
.mainCat{flex:1;padding:8px;background:#151d32;margin:2px;border-radius:5px;text-align:center;cursor:pointer;font-size:11px;border:1px solid #1e2d4a}.mainCat.active{background:#ff0a16}
#groupList{flex:1;overflow-y:auto;padding:6px}.group{padding:10px;background:#1a2340;margin:4px 0;border-radius:6px;cursor:pointer;font-size:12px;border:1px solid #1e2d4a;display:flex;justify-content:space-between}.group.active{background:#ff0a16}
#channelList{flex:1;overflow-y:auto;padding:6px}.ch{padding:10px;background:#1a2340;margin:4px 0;border-radius:8px;cursor:pointer;border:1px solid #1e2d4a;display:flex;gap:10px;align-items:center}.ch.active{background:#ff0a16}.ch img{width:42px;height:42px;border-radius:6px;background:#000;object-fit:contain;border:1px solid #2a3a5a}
#player{flex:1;width:100%;background:#000}#bar{padding:8px;background:#0b1120;display:flex;justify-content:space-between;font-size:11px;border-top:1px solid #1e2d4a;gap:8px}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070b14;z-index:10;padding:20px;text-align:center}
#empty img{width:160px;max-width:60%;margin-bottom:12px}
#settings{position:absolute;top:0;right:0;bottom:0;width:430px;background:#0b1120;border-left:3px solid #ff0a16;z-index:20;transform:translateX(100%);transition:.3s;padding:12px;overflow-y:auto}#settings.open{transform:translateX(0)}
.tabs{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.tab{flex:1;min-width:60px;padding:10px;background:#1a2744;border-radius:6px;text-align:center;cursor:pointer;font-size:11px}.tab.active{background:#ff0a16}
.box{display:none;margin-top:8px;padding:10px;background:#151d32;border-radius:8px;border:1px solid #1e2d4a}.box.active{display:block}
input{width:100%;padding:10px;border-radius:6px;border:1px solid #1e2d4a;background:#060a14;color:#fff;margin-top:5px}.btn{width:100%;padding:12px;background:#ff0a16;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:6px}
.epg{font-size:10px;color:#0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
@media(max-width:900px){body{flex-direction:column}#playerArea{order:1;height:35vh;min-height:220px}#left{order:2;width:100%;min-width:100%;height:28vh;border-right:none;border-top:2px solid #ff0a16}#mid{order:3;width:100%;min-width:100%;height:40vh;border-right:none;border-top:2px solid #1e2d4a}#settings{width:100%}}
</style>
</head>
<body>
<div id="left">
<div id="logoTop">
<img src="tv/logo.png" onerror="this.src='logo.png'; this.onerror=null; this.src='logo.jpg'" alt="MIRTI">
<div style="line-height:1"><b style="color:#fff">MIRTI</b> <b style="color:#ff0a16">TV</b><div style="font-size:9px;color:#8aa;letter-spacing:2px">IPTV</div></div>
<button onclick="toggleSet()" style="margin-left:auto;background:#ff0a16;border:none;color:#fff;padding:6px 10px;border-radius:4px">⚙️</button>
</div>
<div style="display:flex;padding:6px;gap:4px"><div class="mainCat active" onclick="setMain('Tümü')">Tümü</div><div class="mainCat" onclick="setMain('Canlı')">CANLI</div><div class="mainCat" onclick="setMain('Film')">FİLM</div><div class="mainCat" onclick="setMain('Dizi')">DİZİ</div></div>
<div style="padding:6px;background:#151d32;font-size:11px;color:#0f0;display:flex;justify-content:space-between"><span>LOGO ORİJİNAL</span><span id="groupCount">0</span></div>

</div>
<div id="playerArea">

<img src="tv/logo.png" onerror="this.src='logo.png'" alt="MIRTI TV">
<h3 style="color:#0f0;margin-top:6px">V6.6 ORİJİNAL LOGO</h3>
<p style="font-size:11px;color:#8aa;margin-top:6px">KRT KOZA SZC D-SMART + XTREAM fix</p>

</div>

<div id="bar"><span id="now">Hazır V6.6</span><span id="pType">V6.6</span><span id="epgNow" style="color:#0f0;flex:1;text-align:right;overflow:hidden"></span></div>
<div id="settings">
<div style="display:flex;justify-content:space-between"><b style="color:#0f0">V6.6 AYAR</b><button onclick="toggleSet()" style="background:#ff0a16;border:none;color:#fff;padding:6px 12px;border-radius:4px">X</button></div>

<div class="tabs"><div class="tab active" onclick="openTab(0)">URL</div><div class="tab" onclick="openTab(1)">DOSYA</div><div class="tab" onclick="openTab(2)">XTREAM</div><div class="tab" onclick="openTab(3)">EPG</div></div>
<div class="box active" id="b0"><input id="urlInput" value="" placeholder="https://.../liste.m3u BOŞ"><button class="btn" onclick="loadUrl()">LİSTE YÜKLE</button></div>
<div class="box" id="b1"><label for="fileInput" style="display:block;text-align:center;color:#ff0a16;border:2px dashed #ff0a16;padding:16px;border-radius:8px">📁 DOSYADAN SEÇ</label><input type="file" id="fileInput" accept=".m3u,.txt" style="display:none"></div>
<div class="box" id="b2"><input id="xtServer" value="http://20zp98.7039512.xyz:80"><input id="xtUser" value="ahmet:dogan"><input id="xtPass" value="XjFCm3ZHBq"><button class="btn" onclick="loadXtream()">XTREAM GİRİŞ</button><div id="xtInfo" style="font-size:10px;color:#ff0;margin-top:6px">Kullanıcı: ahmet:dogan ( : ile )</div></div>
<div class="box" id="b3"><input id="epgUrl" value="" placeholder="https://.../epg.xml"><button class="btn" onclick="loadEPG()">EPG YÜKLE</button><div id="epgInfo" style="font-size:10px;color:#8aa;margin-top:6px"></div></div>
<div id="status" style="font-size:11px;color:#0f0;margin-top:8px;padding:8px;background:#060a14;border-radius:6px">V6.6 Hazır - Orijinal logo</div>
</div>
</div>
<script>
const MY_PROXY = 'https://hidden-meadow-0d62.a-dogan.workers.dev';
let all=[]; let hls=null; let mpegPlayer=null; let mainCat='Tümü'; let activeGroup='Tümü'; let currentList=''; const video=document.getElementById('player');
let db; let epgData={}; let epgDataByName={};
const NATIONAL_REFS = {'kanal d':'https://www.kanald.com.tr/','star':'https://www.startv.com.tr/','show':'https://www.showtv.com.tr/','atv':'https://www.atv.com.tr/','tv8':'https://www.tv8.com.tr/','ntv':'https://www.ntv.com.tr/','szc':'https://www.sozcu.com.tr/'};
function getNationalRef(n){ let l=n.toLowerCase(); for(let k in NATIONAL_REFS) if(l.includes(k)) return NATIONAL_REFS[k]; return ''; }
function isBlockedByBrowser(u){ if(!u) return false; if(u.startsWith('http://')) return true; if(/:\d{2,5}\//.test(u)) return true; if(/\d+\.\d+\.\d+\.\d+/.test(u)) return true; if(u.includes('/play/')) return true; return false; }
function isRawTS(u){ if(!u) return false; let l=u.toLowerCase(); if(l.includes('.m3u8')) return false; if(l.includes('extension=ts')) return true; if(l.includes('/play/')) return true; if(/:\d{2,5}\//.test(u)) return true; return false; }
function openDB(){return new Promise((res)=>{let req=indexedDB.open('MirtiTV_V66',1);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('lists'))d.createObjectStore('lists',{keyPath:'name'});};req.onsuccess=e=>{db=e.target.result;res(db);};});}
async function saveToDB(n,c){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readwrite');tx.objectStore('lists').put({name:n,channels:c,count:c.length});tx.oncomplete=()=>r();});}
async function getAllFromDB(){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readonly');let q=tx.objectStore('lists').getAll();q.onsuccess=()=>r(q.result);});}
async function deleteFromDB(n){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readwrite');tx.objectStore('lists').delete(n);tx.oncomplete=()=>r();});}
function toggleSet(){document.getElementById('settings').classList.toggle('open');}
function openTab(i){document.querySelectorAll('.box').forEach((b,idx)=>b.classList.toggle('active',idx===i));document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));}
function catOf(n,g){let s=(n+' '+g).toLowerCase();if(/film|movie|vod/.test(s))return 'Film';if(/dizi|series/.test(s))return 'Dizi';return 'Canlı';}
function cleanUrl(u){ if(!u) return ''; return u.trim().replace(/\s+/g,''); }
function fixUsername(u){ if(!u) return u; u=u.trim(); if(u==='ahmet.dogan' || u.includes('.dogan')) return u.replace('.dogan',':dogan'); return u; }
function fixLogoUrl(url){ if(!url) return ''; url=cleanUrl(url); if(!url) return ''; if(url.startsWith('http://') || url.includes(':80') || url.includes(':25461')){ return `${MY_PROXY}/?url=${encodeURIComponent(url)}`; } return url; }
function parseM3U(text){
  const lines=text.split(/\r?\n/); const out=[]; let tmp={name:'',group:'Genel',logo:'',referrer:'',tvgId:'',tvgName:''};
  for(let l of lines){l=l.trim();if(!l)continue;
    if(l.startsWith('#EXTM3U')){ let m=l.match(/x-tvg-url="([^"]+)"/)||l.match(/url-tvg="([^"]+)"/); if(m &&!document.getElementById('epgUrl').value){ document.getElementById('epgUrl').value=m[1]; setTimeout(()=>loadEPG(),1000); } }
    if(l.startsWith('#EXTINF')){ tmp.name=l.split(',').pop().trim()||''; let gM=l.match(/group-title="([^"]+)"/); tmp.group=gM?gM[1].trim():'Genel'; tmp.logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||''; tmp.tvgId=(l.match(/tvg-id="([^"]+)"/)||[])[1]||''; tmp.tvgName=(l.match(/tvg-name="([^"]+)"/)||[])[1]||''; let r1=(l.match(/http-referrer="([^"]+)"/)||[])[1]||''; tmp.referrer=r1||''; }
    else if(!l.startsWith('#')&&l.startsWith('http')){ if(!tmp.name) tmp.name='Kanal '+(out.length+1); out.push({name:tmp.name,group:tmp.group,logo:tmp.logo,tvgId:tmp.tvgId,tvgName:tmp.tvgName,cat:catOf(tmp.name,tmp.group),url:cleanUrl(l.split('|')[0]),referrer:tmp.referrer}); tmp={name:'',group:'Genel',logo:'',referrer:'',tvgId:'',tvgName:''}; }
  } return {channels:out};
}
async function fetchDirect(url){ url=cleanUrl(url); let proxied = `${MY_PROXY}/?url=${encodeURIComponent(url)}`; try{ let r=await fetch(proxied,{cache:'no-store'}); if(r.ok){ let t=await r.text(); if(t.length>30) return t; } }catch(e){} try{ let r=await fetch(url,{cache:'no-store'}); if(r.ok){ let t=await r.text(); if(t.length>30) return t; } }catch(e){} throw 'CORS - Worker kapalı'; }
async function loadUrl(){ let u=document.getElementById('urlInput').value.trim(); if(!u){ document.getElementById('status').textContent='URL boş'; return; } u=cleanUrl(u); if(u.includes('output=ts')) u=u.replace('output=ts','output=m3u8'); let st=document.getElementById('status'); st.textContent='Yükleniyor...'; try{ let txt=await fetchDirect(u); if(!txt.includes('#EXTINF')) throw 'Liste değil'; let res=parseM3U(txt); if(res.channels.length){ all=res.channels; currentList='LISTE'; await saveToDB(currentList, all); await renderSaved(); apply(); document.getElementById('empty').style.display='none'; st.textContent=res.channels.length+' kanal ✅'; toggleSet(); } }catch(e){ st.textContent='Yüklenemedi: '+e; } }
async function renderSaved(){let lists=await getAllFromDB();const box=document.getElementById('savedLists');box.innerHTML='';lists.forEach(item=>{let d=document.createElement('div');d.style.cssText='padding:6px;background:#1a2340;margin:3px 0;border-radius:5px;display:flex;justify-content:space-between;border:1px solid #1e2d4a'+(item.name===currentList?';background:#ff0a16':'');d.innerHTML=`<span>📁 ${item.name} (${item.count})</span><span onclick="event.stopPropagation();delList('${item.name}')" style="color:#ff0a16">✕</span>`;d.onclick=()=>{all=item.channels;currentList=item.name;apply();document.getElementById('empty').style.display='none';toggleSet();};box.appendChild(d);});}
async function delList(k){if(confirm(k+' sil?')){await deleteFromDB(k);await renderSaved();}}
function apply(){buildGroups();}
function setMain(cat){mainCat=cat;document.querySelectorAll('.mainCat').forEach(t=>t.classList.toggle('active',t.textContent.includes(cat)));activeGroup='Tümü';buildGroups();}
function buildGroups(){ let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat); let groups=['Tümü',...new Set(base.map(c=>c.group))].filter(Boolean); const box=document.getElementById('groupList'); box.innerHTML=''; if(all.length===0){box.innerHTML='<div style="padding:10px;text-align:center;color:#5a6a8a;font-size:10px">Liste ekle</div>';document.getElementById('groupCount').textContent='0';return;} document.getElementById('groupCount').textContent=groups.length-1; groups.forEach(g=>{ let cnt=g==='Tümü'?base.length:base.filter(x=>x.group===g).length; let b=document.createElement('div'); b.className='group'+(activeGroup===g?' active':''); b.innerHTML=`<span>${g}</span><span style="background:#070b14;padding:2px 6px;border-radius:10px">${cnt}</span>`; b.onclick=()=>{activeGroup=g;document.querySelectorAll('.group').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderCh();}; box.appendChild(b); }); renderCh(); }
function getEPGTitle(c){ let id=c.tvgId||''; let name=c.tvgName||''; let ch=c.name||''; if(id && epgData[id]) return epgData[id][0].title; if(name && epgData[name]) return epgData[name][0].title; if(ch && epgData[ch]) return epgData[ch][0].title; let low=ch.toLowerCase(); for(let k in epgDataByName){ if(low.includes(k.toLowerCase())) return epgDataByName[k][0].title; } return ''; }
function renderCh(){ let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat); let list=base.filter(c=>activeGroup==='Tümü'||c.group===activeGroup); let q=document.getElementById('search').value.toLowerCase(); if(q) list=list.filter(c=>c.name.toLowerCase().includes(q)); const box=document.getElementById('channelList'); box.innerHTML=''; document.getElementById('midTitle').textContent=activeGroup; document.getElementById('midCount').textContent=list.length; list.forEach(c=>{ let epg=getEPGTitle(c); let logoFixed=fixLogoUrl(c.logo); let logoHtml = logoFixed? `<img src="${logoFixed}" onerror="this.style.display='none'">` : `<div style="width:42px;height:42px;background:#0b1120;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:bold;color:#ff0a16">${c.name.charAt(0)}</div>`; let d=document.createElement('div'); d.className='ch'; d.innerHTML=`${logoHtml}<div style="flex:1;min-width:0"><div style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold">${c.name}</div><div style="font-size:10px;color:#8aa">${c.group}</div>${epg?`<div class="epg">▶ ${epg}</div>`:''}</div><span>▶</span>`; d.onclick=()=>{document.querySelectorAll('.ch').forEach(x=>x.classList.remove('active'));d.classList.add('active');playV6(c);}; box.appendChild(d); }); }
function playV6(c){ document.getElementById('empty').style.display='none'; document.getElementById('now').textContent=c.name; let epg=getEPGTitle(c); document.getElementById('epgNow').textContent=epg?'▶ '+epg:''; if(hls){try{hls.destroy()}catch(e){} hls=null;} if(mpegPlayer){try{mpegPlayer.destroy()}catch(e){} mpegPlayer=null;} video.pause(); video.removeAttribute('src'); video.load(); let ref=c.referrer||getNationalRef(c.name)||''; let url=cleanUrl(c.url); let blocked=isBlockedByBrowser(url); let raw=isRawTS(url); let attempts=[]; if(ref){ attempts.push(`${MY_PROXY}/?url=${encodeURIComponent(url)}&ref=${encodeURIComponent(ref)}`); } else if(blocked||raw){ attempts.push(`${MY_PROXY}/?url=${encodeURIComponent(url)}`); } else{ attempts.push(url); attempts.push(`${MY_PROXY}/?url=${encodeURIComponent(url)}`); } tryPlay(attempts,0,c,ref,raw); }
function tryPlay(list, idx, c, ref, raw){ if(idx>=list.length){ document.getElementById('pType').textContent='Açılamadı'; return; } let finalUrl=list[idx]; document.getElementById('pType').textContent=`Deneniyor ${idx+1}/${list.length}`; if(raw && mpegts.isSupported()){ try{ if(mpegPlayer){try{mpegPlayer.destroy()}catch(e){}} mpegPlayer=mpegts.createPlayer({type:'mpegts',isLive:true,url:finalUrl},{enableWorker:true,enableStashBuffer:false,stashInitialSize:128}); mpegPlayer.attachMediaElement(video); mpegPlayer.load(); mpegPlayer.play(); let failed=false; mpegPlayer.on(mpegts.Events.MEDIA_INFO,()=>{ if(!failed){ video.play(); document.getElementById('pType').textContent='✅ TS'; }}); mpegPlayer.on(mpegts.Events.ERROR,()=>{ failed=true; try{mpegPlayer.destroy()}catch(e){} tryPlay(list, idx+1, c, ref, raw); }); setTimeout(()=>{ if(video.readyState===0 &&!failed){ try{mpegPlayer.destroy()}catch(e){} tryPlay(list, idx+1, c, ref, raw); } }, 7000); return; }catch(e){} } class SmartLoader extends Hls.DefaultConfig.loader{ load(ctx,cfg,cb){ let u=ctx.url; if(!u.includes(MY_PROXY) &&!u.startsWith('blob:')){ if(u.startsWith('http://') || u.includes('/play/') || u.includes('live.php')){ ctx.url=`${MY_PROXY}/?url=${encodeURIComponent(u)}`; } } super.load(ctx,cfg,cb); } } if(Hls.isSupported()){ hls=new Hls({enableWorker:true,loader:SmartLoader}); hls.loadSource(finalUrl); hls.attachMedia(video); let to=setTimeout(()=>{ hls.destroy(); tryPlay(list, idx+1, c, ref, raw); }, 10000); hls.on(Hls.Events.MANIFEST_PARSED,()=>{ clearTimeout(to); video.play().then(()=>{document.getElementById('pType').textContent='✅ '+c.name;}); }); hls.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal){ clearTimeout(to); hls.destroy(); tryPlay(list, idx+1, c, ref, raw); } }); }else{ video.src=finalUrl; video.play().catch(()=>{ tryPlay(list, idx+1, c, ref, raw); }); } }
async function loadXtream(){ let server=document.getElementById('xtServer').value.trim().replace(/\/$/,''); let user=document.getElementById('xtUser').value.trim(); let pass=document.getElementById('xtPass').value.trim(); user=fixUsername(user); document.getElementById('xtUser').value=user; let info=document.getElementById('xtInfo'); let st=document.getElementById('status'); if(!server||!user||!pass){ st.textContent='Boş olamaz'; return; } info.textContent='Yükleniyor...'; st.textContent='Xtream bağlanıyor...'; try{ server=cleanUrl(server); let catUrl=`${server}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&action=get_live_categories`; let catText=await fetchDirect(catUrl); let cats=JSON.parse(catText); let liveUrl=`${server}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&action=get_live_streams`; let liveText=await fetchDirect(liveUrl); let streams=JSON.parse(liveText); let catMap={}; cats.forEach(c=>catMap[c.category_id]=c.category_name); let channels=[]; streams.forEach(s=>{ let group=catMap[s.category_id]||'XTREAM'; let url=`${server}/live/${encodeURIComponent(user)}/${encodeURIComponent(pass)}/${s.stream_id}.m3u8`; channels.push({name:s.name, group:group, logo:s.stream_icon||'', tvgId:s.name, tvgName:s.name, cat:'Canlı', url:cleanUrl(url), referrer:''}); }); if(channels.length>0){ all=channels; currentList='XTREAM'; await saveToDB(currentList, all); await renderSaved(); apply(); document.getElementById('empty').style.display='none'; info.textContent=channels.length+' kanal ✅'; st.textContent=channels.length+' kanal'; toggleSet(); } }catch(e){ info.textContent='Hata: '+e; document.getElementById('status').textContent='Yüklenemedi: '+e; } }
async function loadEPG(){ let url=document.getElementById('epgUrl').value.trim(); if(!url) return; let info=document.getElementById('epgInfo'); info.textContent='EPG...'; try{ let xmlText=await fetchDirect(url); let parser=new DOMParser(); let xml=parser.parseFromString(xmlText,"text/xml"); epgData={}; epgDataByName={}; xml.querySelectorAll('programme').forEach(p=>{ let ch=p.getAttribute('channel'); let title=p.querySelector('title')?.textContent||''; if(!epgData[ch]) epgData[ch]=[]; epgData[ch].push({title}); if(!epgDataByName[ch]) epgDataByName[ch]=[]; epgDataByName[ch].push({title}); }); xml.querySelectorAll('channel').forEach(ch=>{ let id=ch.getAttribute('id'); let dname=ch.querySelector('display-name')?.textContent?.trim()||''; if(dname && epgData[id]){ epgData[dname]=epgData[id]; epgDataByName[dname]=epgData[id]; } }); info.textContent=Object.keys(epgData).length+' kanal EPG ✅'; renderCh(); }catch(e){ info.textContent='EPG hata: '+e; } }
document.getElementById('fileInput').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=async ev=>{ let res=parseM3U(ev.target.result); if(res.channels.length){ all=res.channels; currentList=f.name.slice(0,20); await saveToDB(currentList,all); await renderSaved(); apply(); document.getElementById('empty').style.display='none'; toggleSet(); document.getElementById('status').textContent=res.channels.length+' kanal'; } }; r.readAsText(f); });
document.getElementById('search').addEventListener('input',renderCh);
(async()=>{await openDB();await renderSaved(); buildGroups();})();
</script>
</body>
</html>
