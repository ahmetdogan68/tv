<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI TV - LOG FIX</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070b14;color:#fff;font-family:Arial;display:flex;height:100vh;overflow:hidden}
#left{width:230px;background:#0b1120;border-right:2px solid #1e2d4a;display:flex;flex-direction:column}
#mid{width:360px;background:#0e1424;border-right:2px solid #1e2d4a;display:flex;flex-direction:column}
#playerArea{flex:1;background:#000;display:flex;flex-direction:column;position:relative}
#logoTop{padding:10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #1e2d4a;background:#080e1e}
.mainCats{display:flex;padding:5px;gap:3px;border-bottom:1px solid #1e2d4a}
.mainCat{flex:1;padding:6px;background:#151d32;border-radius:5px;text-align:center;cursor:pointer;font-size:10px;border:1px solid #1e2d4a}
.mainCat.active{background:#ff0a16}
#groupList{flex:1;overflow-y:auto;padding:6px}
.group{padding:9px;background:#151d32;margin:3px 0;border-radius:6px;cursor:pointer;font-size:12px;border:1px solid #1e2d4a;display:flex;justify-content:space-between}
.group.active{background:#ff0a16}
#channelList{flex:1;overflow-y:auto;padding:6px}
.ch{padding:7px;background:#1a2340;margin:4px 0;border-radius:6px;cursor:pointer;border:1px solid #1e2d4a;display:flex;gap:8px;align-items:center}
.ch.active{background:#ff0a16}
.ch img{width:36px;height:36px;border-radius:4px;background:#000;object-fit:contain}
#player{flex:1;width:100%;background:#000}
#bar{padding:8px;background:#0b1120;display:flex;justify-content:space-between;font-size:11px;border-top:1px solid #1e2d4a}
#resInfo{padding:6px 10px;background:#151d32;font-size:10px;color:#8aa;display:flex;justify-content:space-between;border-top:1px solid #1e2d4a}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070b14;z-index:10}
#settings{position:absolute;top:0;right:0;bottom:0;width:340px;background:#0b1120;border-left:2px solid #ff0a16;z-index:30;transform:translateX(100%);transition:.3s;padding:10px;display:flex;flex-direction:column}
#settings.open{transform:translateX(0)}
.btn{width:100%;padding:8px;background:#ff0a16;color:#fff;border:none;border-radius:5px;font-weight:bold;cursor:pointer;margin-top:4px;font-size:11px}
input{width:100%;padding:7px;border-radius:5px;border:1px solid #1e2d4a;background:#060a14;color:#fff;margin-top:4px;font-size:11px}
.tabs{display:flex;gap:4px;margin-top:6px}
.tab{flex:1;padding:6px;background:#1a2744;border-radius:5px;text-align:center;cursor:pointer;font-size:10px}
.tab.active{background:#ff0a16}
.box{display:none;margin-top:6px;padding:8px;background:#151d32;border-radius:6px;border:1px solid #1e2d4a}
.box.active{display:block}
#logBox{margin-top:8px;background:#000;border:1px solid #ff0a16;border-radius:6px;padding:6px;flex:1;overflow-y:auto}
#log{font-size:10px;color:#ff5555;white-space:pre-wrap;line-height:14px}
#videoLog{position:absolute;top:10px;left:10px;right:10px;background:rgba(0,0,0,0.85);border:1px solid #ff0a16;border-radius:6px;padding:8px;font-size:11px;color:#ff5555;z-index:15;max-height:120px;overflow-y:auto;display:none}
</style>
</head>
<body>

<div id="left">
<div id="logoTop"><img src="logo.png" onerror="this.style.display='none'"><h1 style="color:#ff0a16;font-size:14px">MIRTI TV</h1><button onclick="toggleSet()" style="margin-left:auto;background:#1a2744;border:none;color:#fff;padding:4px 8px;border-radius:4px">⚙️ LOG</button></div>
<div class="mainCats">
<div class="mainCat active" onclick="setMain('Tümü')">Tümü</div>
<div class="mainCat" onclick="setMain('Canlı')">CANLI</div>
<div class="mainCat" onclick="setMain('Film')">FİLM</div>
<div class="mainCat" onclick="setMain('Dizi')">DİZİ</div>
</div>
<div id="groupList"></div>
</div>

<div id="mid">
<div style="padding:8px;background:#ff0a16;font-weight:bold;font-size:11px;display:flex;justify-content:space-between"><span id="midTitle">KANALLAR</span><span id="midCount">0</span></div>
<input id="search" placeholder="🔍 Ara..." style="margin:6px;width:95%">
<div id="channelList"></div>
</div>

<div id="playerArea">
<div id="videoLog"></div>
<div id="empty"><img src="logo.png" style="width:160px"><h2 style="color:#ff0a16;margin-top:10px">MIRTI TV</h2><p style="font-size:10px;color:#5a6a8a;margin-top:4px">⚙️'ye bas log'u gör</p><button class="btn" style="width:180px;margin-top:10px" onclick="toggleSet()">⚙️ URL EKLE + LOG</button></div>
<video id="player" controls autoplay playsinline crossorigin="anonymous"></video>
<div id="bar"><span id="now">Hazır</span><span id="pType" style="color:#ff0a16">-</span></div>
<div id="resInfo"><span id="resText">Çözünürlük: -</span><span id="epgInfo">EPG: -</span></div>

<div id="settings">
<div style="display:flex;justify-content:space-between"><b>⚙️ AYARLAR + LOG</b><button onclick="toggleSet()" style="background:#ff0a16;border:none;color:#fff;padding:4px 10px;border-radius:4px">X</button></div>
<div class="tabs"><div class="tab active" onclick="openTab(0)">URL</div><div class="tab" onclick="openTab(1)">DOSYA</div></div>
<div class="box active" id="b0"><input id="urlInput" placeholder="https://...m3u"><button class="btn" onclick="loadUrl()">YÜKLE</button></div>
<div class="box" id="b1"><label for="fileInput" style="display:block;text-align:center;color:#ff0a16;border:1px dashed #ff0a16;padding:10px;border-radius:6px;cursor:pointer">📁 DOSYA SEÇ</label><input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" style="display:none"></div>
<input id="epgInput" value="https://epgshare01.online/epgshare01/epg_ripper_TR1.xml" style="margin-top:8px"><button class="btn" style="background:#1a2744" onclick="loadEPG(document.getElementById('epgInput').value)">EPG</button>
<div id="status" style="font-size:10px;color:#5a6a8a;margin-top:6px">Hazır</div>

<!-- LOG BURDA ABİ -->
<div id="logBox">
<div style="font-size:11px;font-weight:bold;color:#ff0a16;margin-bottom:4px">📋 CANLI LOG (Neden açılmadı?)</div>
<div id="log">Log bekleniyor... Kanal tıkla, burda hata yazacak</div>
<button class="btn" style="background:#1a2744;margin-top:6px" onclick="document.getElementById('log').textContent=''">LOG'U TEMİZLE</button>
</div>
</div>
</div>

<script>
let all=[]; let epg={}; let hls=null; let mpegPlayer=null; let shakaPlayer=null;
let mainCat='Tümü'; let activeGroup='Tümü'; let saved=JSON.parse(localStorage.getItem('MIRTI_LOG')||'{}'); let currentList=''; const video=document.getElementById('player');

function addLog(t){
const time=new Date().toLocaleTimeString();
const line=`[${time}] ${t}`;
console.log(line);
document.getElementById('log').textContent=line+"\n"+document.getElementById('log').textContent;
document.getElementById('videoLog').style.display='block';
document.getElementById('videoLog').textContent=document.getElementById('log').textContent.slice(0,600);
setTimeout(()=>{ if(document.getElementById('pType').textContent.includes('✅')) document.getElementById('videoLog').style.display='none'; },4000);
}
function toggleSet(){ document.getElementById('settings').classList.toggle('open'); }
function openTab(i){ document.querySelectorAll('.box').forEach((b,idx)=>b.classList.toggle('active',idx===i)); document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i)); }
function catOf(n,g){ let s=(n+' '+g).toLowerCase(); if(/film|movie|vod|sinema/.test(s))return 'Film'; if(/dizi|series|sezon|bolum|bölüm/.test(s))return 'Dizi'; return 'Canlı'; }
function parseM3U(text){ const lines=text.split(/\r?\n/); const out=[]; let tmp={name:'',group:'Genel',logo:'',tvgId:'',tvgName:''}; for(let l of lines){ l=l.trim(); if(!l)continue; if(l.startsWith('#EXTINF')){ tmp.name=l.split(',').pop().trim()||''; let gM=l.match(/group-title="([^"]+)"/); tmp.group=gM?gM[1].trim():'Genel'; tmp.logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||''; tmp.tvgId=(l.match(/tvg-id="([^"]+)"/)||[])[1]||''; tmp.tvgName=(l.match(/tvg-name="([^"]+)"/)||[])[1]||''; }else if(!l.startsWith('#')&&l.startsWith('http')){ if(!tmp.name) tmp.name='Kanal '+(out.length+1); out.push({name:tmp.name,group:tmp.group,logo:tmp.logo,tvgId:tmp.tvgId,tvgName:tmp.tvgName||tmp.name,cat:catOf(tmp.name,tmp.group),url:l}); tmp={name:'',group:'Genel',logo:'',tvgId:'',tvgName:''}; } } return out; }
async function fetchProxy(url){ const ps=[url,'https://corsproxy.io/?'+encodeURIComponent(url),'https://api.allorigins.win/raw?url='+encodeURIComponent(url)]; for(let p of ps){ try{ let r=await fetch(p,{cache:'no-store'}); if(r.ok){ let t=await r.text(); if(t.length>100) return t; } }catch(e){} } throw 'CORS'; }
async function loadUrl(){ let url=document.getElementById('urlInput').value.trim(); if(!url)return; document.getElementById('status').textContent='Yükleniyor...'; addLog('M3U yükleniyor: '+url.slice(0,50)); try{ let txt=await fetchProxy(url); let chans=parseM3U(txt); if(chans.length){ all=chans; currentList=url.split('/').pop().slice(0,20); localStorage.setItem('MIRTI_LOG',JSON.stringify({[currentList]:all})); apply(); loadEPG('https://epgshare01.online/epgshare01/epg_ripper_TR1.xml'); toggleSet(); document.getElementById('status').textContent=chans.length+' kanal'; addLog(chans.length+' kanal yüklendi'); } }catch(e){ addLog('M3U yüklenemedi: '+e); alert('CORS'); } }
function apply(){ document.getElementById('empty').style.display='none'; buildGroups(); }
function setMain(cat){ mainCat=cat; document.querySelectorAll('.mainCat').forEach(t=>t.classList.toggle('active', t.textContent.includes(cat))); activeGroup='Tümü'; buildGroups(); }
function buildGroups(){ let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat); let groups=['Tümü',...new Set(base.map(c=>c.group))].filter(Boolean); const box=document.getElementById('groupList'); box.innerHTML=''; groups.forEach(g=>{ let cnt=g==='Tümü'?base.length:base.filter(x=>x.group===g).length; let b=document.createElement('div'); b.className='group'+(activeGroup===g?' active':''); b.innerHTML=`<span>${g}</span><span style="background:#070b14;padding:2px 6px;border-radius:10px;font-size:10px">${cnt}</span>`; b.onclick=()=>{ activeGroup=g; document.querySelectorAll('.group').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderCh(); }; box.appendChild(b); }); renderCh(); }
function renderCh(){ let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat); let list=base.filter(c=>activeGroup==='Tümü'||c.group===activeGroup); let q=document.getElementById('search').value.toLowerCase(); if(q) list=list.filter(c=>c.name.toLowerCase().includes(q)); const box=document.getElementById('channelList'); box.innerHTML=''; document.getElementById('midTitle').textContent=activeGroup; document.getElementById('midCount').textContent=list.length; list.forEach(c=>{ let prog=epg[c.tvgId]||epg[c.tvgName]||epg[c.name]||null; let d=document.createElement('div'); d.className='ch'; let logo=c.logo||''; d.innerHTML=`<img src="${logo}" onerror="this.src='https://via.placeholder.com/36x36/0b1120/ff0a16?text=TV'"><div style="flex:1;overflow:hidden"><div class="n">${c.name}</div><div class="e">${prog? '▶ '+prog.now : c.group}</div></div>`; d.onclick=()=>{ document.querySelectorAll('.ch').forEach(x=>x.classList.remove('active')); d.classList.add('active'); playChannel(c,0); }; box.appendChild(d); }); }

// GERÇEK OYNATICI
function destroyAll(){ if(hls){try{hls.destroy()}catch(e){} hls=null;} if(mpegPlayer){try{mpegPlayer.destroy()}catch(e){} mpegPlayer=null;} if(shakaPlayer){try{shakaPlayer.destroy()}catch(e){} shakaPlayer=null;} video.pause(); video.removeAttribute('src'); video.load(); }

function playChannel(c,attempt){
destroyAll();
document.getElementById('empty').style.display='none';
document.getElementById('now').textContent=c.name;
addLog('▶ TIKLANDI: '+c.name);
addLog('URL: '+c.url);

let url=c.url;
let useProxy = attempt>=1 || url.startsWith('http://');

if(useProxy){
url='https://corsproxy.io/?'+encodeURIComponent(c.url);
addLog('⚠️ http link veya retry -> PROXY ile sarıldı');
}

document.getElementById('pType').textContent='Deneniyor...';

// TS için
if(c.url.includes('.ts')||c.url.includes('live.php')||c.url.includes('extension=ts')){
addLog('TS tespit edildi -> mpegts.js deneniyor');
if(mpegts.isSupported()){
mpegPlayer=mpegts.createPlayer({type:'mse', isLive:true, url:url},{liveBufferLatencyChasing:true, enableStashBuffer:false});
mpegPlayer.attachMediaElement(video);
mpegPlayer.load();
mpegPlayer.play().then(()=>{
document.getElementById('pType').textContent='✅ MPEGTS ile açıldı';
addLog('✅ MPEGTS BAŞARILI');
document.getElementById('resText').textContent='Live TS';
}).catch(e=>{
addLog('❌ MPEGTS HATA: '+e.message+' -> HLS deneniyor');
tryHls(c,attempt,url);
});
return;
}else addLog('❌ mpegts desteklenmiyor');
}
tryHls(c,attempt,url);
}

function tryHls(c,attempt,url){
addLog('HLS.js deneniyor...');
document.getElementById('pType').textContent='HLS.js deneniyor...';
if(Hls.isSupported()){
hls=new Hls({enableWorker:true});
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>{
addLog('HLS manifest okundu, oynatılıyor...');
video.play().then(()=>{
document.getElementById('pType').textContent='✅ HLS.js ile açıldı';
addLog('✅ HLS BAŞARILI: '+video.videoWidth+'x'+video.videoHeight);
document.getElementById('resText').textContent='Çözünürlük: '+video.videoWidth+'x'+video.videoHeight;
}).catch(e=>{ addLog('❌ HLS play hata: '+e.message); tryShaka(c,attempt,url); });
});
hls.on(Hls.Events.ERROR,(e,d)=>{
addLog('❌ HLS ERROR: '+d.type+' - '+d.details);
if(d.fatal){
if(attempt<1){ addLog('Fatal -> Proxy ile tekrar denenecek'); setTimeout(()=>playChannel(c,attempt+1),600); }
else tryShaka(c,attempt,url);
}
});
}else{ addLog('HLS desteklenmiyor -> Shaka'); tryShaka(c,attempt,url); }
}

function tryShaka(c,attempt,url){
addLog('Shaka deneniyor...');
document.getElementById('pType').textContent='Shaka deneniyor...';
if(shaka.Player.isBrowserSupported()){
shakaPlayer=new shaka.Player(video);
shakaPlayer.load(url).then(()=>{
video.play(); document.getElementById('pType').textContent='✅ Shaka ile açıldı'; addLog('✅ SHAKA BAŞARILI');
}).catch(e=>{
addLog('❌ Shaka hata: Code '+e.code+' '+e.message+' -> Native');
tryNative(c,attempt,url);
});
}else tryNative(c,attempt,url);
}

function tryNative(c,attempt,url){
addLog('Native player deneniyor...');
document.getElementById('pType').textContent='Native deneniyor...';
video.src=url;
video.play().then(()=>{
document.getElementById('pType').textContent='✅ Native ile açıldı';
addLog('✅ NATIVE BAŞARILI');
}).catch(e=>{
addLog('❌ NATIVE HATA: '+e.message);
if(attempt<1){
addLog('🔄 Tüm oynatıcılar fail -> PROXY ile son kez deniyorum');
setTimeout(()=>playChannel(c,attempt+1),800);
}else{
addLog('❌❌ TÜM OYNATICILAR BAŞARISIZ');
addLog('Sebep: 1) Token ölmüş 2) CORS 3) http engeli');
addLog('VLC açar çünkü VLC bu engelleri takmaz');
document.getElementById('pType').textContent='❌ Açılamadı';
}
});
}

async function loadEPG(url){ try{ let txt=await fetchProxy(url); let parser=new DOMParser(); let xml=parser.parseFromString(txt,'text/xml'); let progs=xml.querySelectorAll('programme'); let now=new Date(); let tmp={}; let cnt=0; progs.forEach(p=>{ let ch=p.getAttribute('channel'); let s=p.getAttribute('start'); let title=p.querySelector('title')?.textContent||''; if(!ch||!s)return; let y=parseInt(s.substring(0,4)), mo=parseInt(s.substring(4,6))-1, d=parseInt(s.substring(6,8)), h=parseInt(s.substring(8,10)), mi=parseInt(s.substring(10,12)); let sDate=new Date(y,mo,d,h,mi); if(Math.abs(sDate-now)<4*60*60*1000){ tmp[ch]={now:title}; cnt++; } }); epg=tmp; document.getElementById('epgInfo').textContent='EPG: '+cnt; renderCh(); addLog('EPG yüklendi: '+cnt+' program'); }catch(e){ addLog('EPG hata: '+e); } }
video.addEventListener('loadedmetadata',()=>{ if(video.videoWidth) document.getElementById('resText').textContent='Çözünürlük: '+video.videoWidth+'x'+video.videoHeight; });
document.getElementById('fileInput').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{ let chans=parseM3U(ev.target.result); if(chans.length){ all=chans; currentList=f.name.slice(0,20); apply(); loadEPG('https://epgshare01.online/epgshare01/epg_ripper_TR1.xml'); toggleSet(); document.getElementById('empty').style.display='none'; addLog(chans.length+' kanal dosyadan yüklendi'); } }; r.readAsText(f); });
document.getElementById('search').addEventListener('input',renderCh);
</script>
</body>
</html>
