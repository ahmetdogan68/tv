<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial;display:flex;height:100vh}
#sidebar{width:280px;background:#111;border-right:1px solid #222;overflow-y:auto;padding:10px}
#sidebar h2{color:#ff0000;text-align:center;padding:15px;font-size:22px;letter-spacing:2px}
.channel{padding:12px;background:#1a1a1a;margin:6px 0;border-radius:8px;cursor:pointer;border:1px solid #222}
.channel:hover{background:#ff0000;color:#fff}
.channel.active{background:#ff0000}
#main{flex:1;display:flex;flex-direction:column;background:#000}
#player{flex:1;width:100%;background:#000}
#info{padding:12px;background:#111;text-align:center}
input{width:90%;margin:10px 5%;padding:10px;border-radius:8px;border:none;background:#222;color:#fff}
</style>
</head>
<body>
<div id="sidebar">
<h2>MIRTI TV</h2>
<input type="text" id="search" placeholder="Kanal ara..." onkeyup="filterChannels()">
<div id="list"></div>
</div>
<div id="main">
<video id="player" controls autoplay></video>
<div id="info">Kanal seç ve izle - MIRTI</div>
</div>
<script>
const channels=[
{name:"TRT 1",url:"https://tv-trt1.medya.trt.com.tr/master.m3u8"},
{name:"ATV",url:"https://a3a5fb5a.static.cdn.cdn.tv/tv/atv/master.m3u8"},
{name:"Kanal D",url:"https://ciner-live.ercdn.net/kanald/kanald.m3u8"},
{name:"Show TV",url:"https://ciner-live.ercdn.net/showtv/showtv.m3u8"},
{name:"Star TV",url:"https://dogus-live.ercdn.net/startv/startv.m3u8"},
{name:"TV8",url:"https://tv8-live.ercdn.net/tv8/tv8.m3u8"},
{name:"TRT Spor",url:"https://tv-trtspor1.medya.trt.com.tr/master.m3u8"},
{name:"A Spor",url:"https://a2a3efb5.static.cdn.cdn.tv/tv/aspor/master.m3u8"},
{name:"TGRT Haber",url:"https://tgrthaber-live.ercdn.net/tgrthaber/tgrthaber.m3u8"},
{name:"Halk TV",url:"https://halktv-live.ercdn.net/halktv/halktv.m3u8"},
];
const video=document.getElementById('player');
const list=document.getElementById('list');
function render(arr){
list.innerHTML='';
arr.forEach((c,i)=>{
const d=document.createElement('div');
d.className='channel';
d.textContent=c.name;
d.onclick=()=>play(c,d);
list.appendChild(d);
});
}
function play(c,el){
document.querySelectorAll('.channel').forEach(e=>e.classList.remove('active'));
if(el)el.classList.add('active');
document.getElementById('info').textContent='Oynatılıyor: '+c.name;
if(Hls.isSupported()){
const hls=new Hls({enableWorker:true});
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else if(video.canPlayType('application/vnd.apple.mpegurl')){
video.src=c.url;
video.play();
}
}
function filterChannels(){
const q=document.getElementById('search').value.toLowerCase();
render(channels.filter(c=>c.name.toLowerCase().includes(q)));
}
render(channels);
play(channels[0]);
</script>
</body>
</html>
