<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI TV - FIX GRUP</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070b14;color:#fff;font-family:Arial;display:flex;height:100vh;overflow:hidden}
#left{width:220px;background:#0b1120;border-right:2px solid #1e2d4a;display:flex;flex-direction:column}
#mid{width:320px;background:#0e1424;border-right:2px solid #1e2d4a;display:flex;flex-direction:column}
#right{flex:1;background:#000;display:flex;flex-direction:column;position:relative}
#logo{padding:10px;text-align:center;border-bottom:1px solid #1e2d4a;background:#080e1e}
#logo h1{color:#ff0a16;font-size:18px;letter-spacing:2px}
.tabs{display:flex;padding:6px;gap:4px}
.tab{flex:1;padding:6px;background:#1a2744;border-radius:5px;text-align:center;cursor:pointer;font-size:10px}
.tab.active{background:#ff0a16}
.box{margin:6px;padding:8px;background:#151d32;border-radius:6px;border:1px solid #1e2d4a;display:none}
.box.active{display:block}
.btn{width:100%;padding:8px;background:#ff0a16;color:#fff;border:none;border-radius:5px;font-weight:bold;cursor:pointer;margin-top:4px;font-size:11px}
input{width:100%;padding:7px;border-radius:5px;border:1px solid #1e2d4a;background:#060a14;color:#fff;margin-top:4px;font-size:11px}
.mainCat{padding:9px;background:#151d32;margin:3px 0;border-radius:6px;cursor:pointer;border:1px solid #1e2d4a;display:flex;justify-content:space-between;font-size:12px}
.mainCat.active{background:#ff0a16}
#groupList{flex:1;overflow-y:auto;padding:6px;border-top:2px solid #ff0a16;background:#0b1120}
.group{padding:9px;background:#151d32;margin:3px 0;border-radius:6px;cursor:pointer;font-size:12px;border:1px solid #1e2d4a;display:flex;justify-content:space-between}
.group:hover{background:#1e2d4a}
.group.active{background:#ff0a16;border-color:#ff0a16;font-weight:bold}
#channelList{flex:1;overflow-y:auto;padding:6px}
.ch{padding:8px;background:#1a2340;margin:4px 0;border-radius:6px;cursor:pointer;border:1px solid #1e2d4a}
.ch:hover{background:#1e2d4a}
.ch.active{background:#ff0a16}
.ch.n{font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch.g{font-size:10px;color:#8aa;margin-top:2px}
.ch.active.g{color:#fff}
#player{flex:1;width:100%;background:#000}
#bar{padding:8px;background:#0b1120;display:flex;justify-content:space-between;font-size:12px}
#epgBar{padding:8px;background:#151d32;border-top:1px solid #1e2d4a;font-size:11px}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070b14;color:#5a6a8a;z-index:5}
#epgStatus{font-size:9px;color:#ff0a16;padding:4px 8px;background:#151d32}
</style>
</head>
<body>
<div id="left">
<div id="logo"><h1>MIRTI TV</h1><div style="font-size:8px;color:#5a6a8a">GRUP FIX + EPG</div></div>
<div class="tabs"><div class="tab active" onclick="openTab(0)">URL</div><div class="tab" onclick="openTab(1)">XTREAM</div><div class="tab" onclick="openTab(2)">DOSYA</div></div>
<div class="box active" id="b0"><input id="urlInput" placeholder="m3u linki"><button class="btn" onclick="loadUrl()">YÜKLE</button></div>
<div class="box" id="b1"><input id="xHost" placeholder="http://host:port"><input id="xUser" placeholder="Kullanıcı"><input id="xPass" placeholder="Şifre"><button class="btn" onclick="loadXtream()">XTREAM</button></div>
<div class="box" id="b2"><label for="fileInput" style="display:block;text-align:center;color:#ff0a16;border:1px dashed #ff0a16;padding:8px;border-radius:5px;cursor:pointer">📁 DOSYA SEÇ</label><input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" style="display:none"></div>
<div style="padding:6px">
<div class="mainCat active" data-cat="Tümü" onclick="setMain('Tümü')">Tümü <span id="cAll">0</span></div>
<div class="mainCat" data-cat="Canlı" onclick="setMain('Canlı')">📺 Canlı TV <span id="cLive">0</span></div>
<div class="mainCat" data-cat="Film" onclick="setMain('Film')">🎬 Film <span id="cFilm">0</span></div>
<div class="mainCat" data-cat="Dizi" onclick="setMain('Dizi')">🎞️ Dizi <span id="cDizi">0</span></div>
</div>
<div id="epgStatus">EPG: epgshare01 otomatik</div>
<div id="savedLists" style="padding:5px;max-height:80px;overflow-y:auto;border-top:1px solid #1e2d4a"></div>
</div>

<div id="mid">
<div style="padding:8px;background:#ff0a16;color:#fff;display:flex;justify-content:space-between;font-size:12px;font-weight:bold"><span id="midTitle">GRUPLAR</span><span id="midCnt">0</span></div>
<div id="groupList"><div style="padding:20px;text-align:center;color:#5a6a8a;font-size:11px">Liste yükleyince<br>gruplar burada görünecek</div></div>
<input id="search" placeholder="🔍 Kanal ara..." style="margin:6px;width:95%">
<div id="channelList"></div>
</div>

<div id="right">
<div id="empty"><h2>MIRTI TV</h2><p style="margin-top:6px;font-size:11px">Grup boşluğunu düzelttim</p></div>
<video id="player" controls autoplay playsinline></video>
<div id="bar"><span id="now">Hazır</span><span style="color:#ff0a16;font-size:10px">PRO PLAYER</span></div>
<div id="epgBar">📅 <b id="epgNow">EPG bekleniyor</b> <div id="epgNext" style="font-size:10px;color:#8aa;margin-top:2px"></div></div>
</div>

<script>
let all=[]; let epg={}; let hls=null; let mainCat='Tümü'; let activeGroup='Tümü'; let saved=JSON.parse(localStorage.getItem('MIRTI_FIX_V7')||'{}'); let currentList=''; const video=document.getElementById('player');
const EPG_DEFAULT='https://epgshare01.online/epgshare01/epg_ripper_TR1.xml';

function openTab(i){document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));document.querySelectorAll('.box').forEach((b,idx)=>b.classList.toggle('active',idx===i));}
function catOf(n,g){ let s=(n+' '+g).toLowerCase(); if(s.includes('film')||s.includes('movie')||s.includes('sinema'))return 'Film'; if(s.includes('dizi')||s.includes('series')||s.includes('sezon')||s.includes('bolum')||s.includes('bölüm')||s.includes('episode'))return 'Dizi'; return 'Canlı'; }

function parseM3U(text){
const lines=text.split(/\r?\n/); const out=[]; let tmp={name:'',group:'Genel',logo:'',tvgId:'',tvgName:''}; let epgFrom='';
let head=text.slice(0,800); let m=head.match(/x-tvg-url="([^"]+)"/) || head.match(/url-tvg="([^"]+)"/); if(m) epgFrom=m[1];
for(let i=0;i<lines.length;i++){
let l=lines[i].trim(); if(!l)continue;
if(l.startsWith('#EXTINF')){
let name=l.split(',').pop().trim();
if(name) tmp.name=name;
// GRUP ÇÖZÜMÜ - her türlü tırnak tipini dene
let gMatch=l.match(/group-title="([^"]+)"/) || l.match(/group-title='([^']+)'/) || l.match(/group-title=([^ \s]+)/);
tmp.group=gMatch?gMatch[1].replace(/"/g,'').trim():'Genel';
if(tmp.group==='') tmp.group='Genel';
tmp.logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||'';
tmp.tvgId=(l.match(/tvg-id="([^"]+)"/)||[])[1]||'';
tmp.tvgName=(l.match(/tvg-name="([^"]+)"/)||[])[1]||'';
}else if(!l.startsWith('#') && l.startsWith('http')){
if(!tmp.name) tmp.name='Kanal '+(out.length+1);
out.push({name:tmp.name,group:tmp.group,logo:tmp.logo,tvgId:tmp.tvgId,tvgName:tmp.tvgName||tmp.name,cat:catOf(tmp.name,tmp.group),url:l});
tmp={name:'',group:'Genel',logo:'',tvgId:'',tvgName:''};
}
}
return {channels:out, epgFrom:epgFrom};
}

async function fetchProxy(url){
const proxies=[url,'https://corsproxy.io/?'+encodeURIComponent(url),'https://api.allorigins.win/raw?url='+encodeURIComponent(url)];
for(let p of proxies){ try{ let r=await fetch(p,{cache:'no-store'}); if(r.ok){ let t=await r.text(); if(t.length>100) return t; } }catch(e){} }
throw 'CORS';
}

async function loadUrl(){
let url=document.getElementById('urlInput').value.trim(); if(!url)return alert('URL gir');
try{
document.getElementById('epgStatus').textContent='Yükleniyor...';
let txt=await fetchProxy(url);
let res=parseM3U(txt);
if(res.channels.length){ all=res.channels; currentList=url.split('/').pop().slice(0,20); saveAuto(); apply(); loadEPG(res.epgFrom||EPG_DEFAULT); alert(res.channels.length+' kanal + '+new Set(res.channels.map(c=>c.group)).size+' grup yüklendi'); }
}catch{ alert('CORS - https link kullan veya DOSYA SEÇ'); }
}

async function loadXtream(){
let host=document.getElementById('xHost').value.trim().replace(/\/$/,''); let u=document.getElementById('xUser').value.trim(); let p=document.getElementById('xPass').value.trim();
if(!host||!u||!p)return alert('Bilgileri gir');
let m3u=`${host}/get.php?username=${u}&password=${p}&type=m3u_plus&output=mpegts`;
document.getElementById('urlInput').value=m3u;
try{ let txt=await fetchProxy(m3u); let res=parseM3U(txt); if(res.channels.length){ all=res.channels; currentList='Xtream-'+u; saveAuto(); apply(); loadEPG(res.epgFrom||EPG_DEFAULT); } }catch{ alert('Xtream CORS'); }
}

function saveAuto(){ if(!all.length)return; let name=currentList||'Liste '+(Object.keys(saved).length+1); saved[name]=all; localStorage.setItem('MIRTI_FIX_V7',JSON.stringify(saved)); renderSaved(); }
function renderSaved(){ const box=document.getElementById('savedLists'); box.innerHTML=''; Object.keys(saved).forEach(k=>{ let d=document.createElement('div'); d.style.cssText='padding:5px;background:#151d32;margin:2px 0;border-radius:5px;cursor:pointer;font-size:10px;display:flex;justify-content:space-between;border:1px solid #1e2d4a'+(k===currentList?';background:#ff0a16':''); d.innerHTML=`<span>📁 ${k} (${saved[k].length})</span><span onclick="delList('${k}')" style="color:#ff0a16">✕</span>`; d.onclick=()=>{ if(event.target.textContent!=='✕'){ all=saved[k]; currentList=k; apply(); } }; box.appendChild(d); }); }
function delList(k){ if(confirm(k+' sil?')){ delete saved[k]; localStorage.setItem('MIRTI_FIX_V7',JSON.stringify(saved)); renderSaved(); } }

function apply(){ document.getElementById('empty').style.display='none'; updateCounts(); buildGroups(); }
function updateCounts(){ document.getElementById('cAll').textContent=all.length; document.getElementById('cLive').textContent=all.filter(c=>c.cat==='Canlı').length; document.getElementById('cFilm').textContent=all.filter(c=>c.cat==='Film').length; document.getElementById('cDizi').textContent=all.filter(c=>c.cat==='Dizi').length; }
function setMain(cat){ mainCat=cat; document.querySelectorAll('.mainCat').forEach(el=>el.classList.toggle('active',el.dataset.cat===cat)); activeGroup='Tümü'; buildGroups(); }

function buildGroups(){
let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat);
let groups=['Tümü',...new Set(base.map(c=>c.group))].filter(g=>g);
console.log('Groups found:',groups);
const box=document.getElementById('groupList'); box.innerHTML='';
document.getElementById('midTitle').textContent=mainCat+' GRUPLARI';
document.getElementById('midCnt').textContent=groups.length-1+' grup';
groups.forEach(g=>{
let cnt=g==='Tümü'?base.length:base.filter(x=>x.group===g).length;
let b=document.createElement('div'); b.className='group'+(activeGroup===g?' active':'');
b.innerHTML=`<span>${g}</span><span style="background:#0b1120;padding:2px 6px;border-radius:10px;font-size:10px">${cnt}</span>`;
b.onclick=()=>{ activeGroup=g; document.querySelectorAll('.group').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderCh(); };
box.appendChild(b);
});
if(groups.length>0){ activeGroup='Tümü'; renderCh(); } else { box.innerHTML='<div style="padding:10px;color:#ff0a16">Grup bulunamadı, film/dizi/canli olarak ayrıldı</div>'; renderCh(); }
}

function renderCh(){
let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat);
let list=base.filter(c=>activeGroup==='Tümü'||c.group===activeGroup);
let q=document.getElementById('search').value.toLowerCase(); if(q) list=list.filter(c=>c.name.toLowerCase().includes(q));
const box=document.getElementById('channelList'); box.innerHTML='';
list.forEach(c=>{
let prog=epg[c.tvgId]||epg[c.tvgName]||null;
let d=document.createElement('div'); d.className='ch';
d.innerHTML=`<div class="n">${c.name}</div><div class="g">${prog? '▶ '+prog.now : c.group}${prog?.next? ' | '+prog.next:''}</div>`;
d.onclick=()=>{ document.querySelectorAll('.ch').forEach(x=>x.classList.remove('active')); d.classList.add('active'); play(c); };
box.appendChild(d);
});
}

function play(c){
if(hls){try{hls.destroy()}catch(e){} hls=null;}
document.getElementById('now').textContent=c.name;
let prog=epg[c.tvgId]||epg[c.tvgName];
if(prog){ document.getElementById('epgNow').textContent=prog.now; document.getElementById('epgNext').textContent=prog.next?'Sonra: '+prog.next:''; }
else{ document.getElementById('epgNow').textContent=c.name+' - '+c.group; document.getElementById('epgNext').textContent=''; }
video.pause(); video.removeAttribute('src'); video.load();
if(Hls.isSupported()){ hls=new Hls(); hls.loadSource(c.url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{})); }else{ video.src=c.url; video.play().catch(()=>{}); }
}

async function loadEPG(url){
if(!url) url=EPG_DEFAULT;
document.getElementById('epgStatus').textContent='EPG: Yükleniyor...';
try{
let txt=await fetchProxy(url);
let parser=new DOMParser(); let xml=parser.parseFromString(txt,'text/xml');
let progs=xml.querySelectorAll('programme'); let now=new Date(); let tmp={};
progs.forEach(p=>{
let ch=p.getAttribute('channel'); let s=p.getAttribute('start'); let title=p.querySelector('title')?.textContent||'';
if(!ch||!s) return;
let y=parseInt(s.substring(0,4)), mo=parseInt(s.substring(4,6))-1, d=parseInt(s.substring(6,8)), h=parseInt(s.substring(8,10)), mi=parseInt(s.substring(10,12));
let sDate=new Date(y,mo,d,h,mi);
if(Math.abs(sDate-now)<180*60*1000){ tmp[ch]={now:title, next:''}; }
});
epg=tmp;
document.getElementById('epgStatus').textContent=`EPG: ${Object.keys(epg).length} program yüklendi`;
renderCh();
}catch{ document.getElementById('epgStatus').textContent='EPG: Yüklenemedi'; }
}

document.getElementById('fileInput').addEventListener('change',e=>{
const f=e.target.files[0]; if(!f)return; const r=new FileReader();
r.onload=ev=>{ let res=parseM3U(ev.target.result); if(res.channels.length){ all=res.channels; currentList=f.name.replace('.m3u','').slice(0,20); saveAuto(); apply(); loadEPG(res.epgFrom||EPG_DEFAULT); alert(res.channels.length+' kanal, '+new Set(res.channels.map(c=>c.group)).size+' grup'); } else alert('Dosya boş'); };
r.readAsText(f);
});
document.getElementById('search').addEventListener('input',renderCh);
renderSaved();
if(Object.keys(saved).length){ let k=Object.keys(saved)[0]; all=saved[k]; currentList=k; apply(); loadEPG(EPG_DEFAULT); }
</script>
</body>
</html>
