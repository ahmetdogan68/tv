<style>

.tabs{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}.tab{flex:1;min-width:60px;padding:8px;background:#222;border:1px solid #333;border-radius:6px;color:#fff;font-size:10px;font-weight:900;cursor:pointer}.tab.active{background:#e50914}
.box{display:none;margin-top:10px;padding:11px;background:#050505;border:1px solid #222;border-radius:7px}.box.active{display:block}
textarea,input{width:100%;margin-top:6px;padding:11px;background:#171717;color:#fff;border:1px solid #444;border-radius:6px;box-sizing:border-box}
.btn{width:100%;padding:12px;background:#e50914;color:#fff;border:0;border-radius:6px;font-weight:900;margin-top:6px;cursor:pointer}.btn.blue{background:#08a9e8}.btn.green{background:#12b85a;color:#000}
.log{white-space:pre-wrap;word-break:break-all;font-size:11px;background:#000;color:#9cff9c;padding:10px;border-radius:6px;margin-top:8px;max-height:200px;overflow:auto}
.savedItem{padding:9px;background:#222;margin:4px 0;border-radius:6px;display:flex;justify-content:space-between;font-size:11px;cursor:pointer;min-width:0;overflow:hidden}
.savedItem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
@media(max-width:900px){body{flex-direction:column;height:auto;min-height:100vh;overflow:auto}#playerArea{order:1;height:48vh;position:sticky;top:0;z-index:5}#left{order:2;width:100%;min-width:100%;max-width:100%;max-height:240px}#groupList{display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;max-height:90px;flex-wrap:nowrap}.group{flex:none;white-space:nowrap}#mid{order:3;width:100%;min-width:100%;max-width:100%;min-height:55vh}#filmGrid{grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}#settings{position:fixed;top:0;bottom:0}}
</style>

    <div class="brandname">MIRTI<br><small>V39 CANLI FIX</small></div>

  </div>
  <div class="catTabs">

    <div class="box active" id="b0"><textarea id="urlInput" rows="3">https://dpaste.com/4QW2YVTSP.txt</textarea><button class="btn" onclick="loadUrl()">URL YÜKLE</button><button class="btn blue" onclick="loadUrl(true)">PROXY İLE DENE</button><div id="urlLog" class="log">V39 - Canlı sağa kayma fix - gap 4px</div></div>

    <div class="box" id="b3"><textarea id="manualPaste" rows="8"></textarea><button class="btn" onclick="loadManual()">YAPIŞTIR YÜKLE</button></div>
    <input id="proxyInput" type="url" placeholder="Proxy"><button class="btn blue" onclick="saveProxy()">KAYDET</button><button class="btn" style="background:#333" onclick="clearSaved()">SİL</button>
  </section>
</main>
<script>
const DEFAULT_PROXY='https://hidden-meadow-0d62.a-dogan.workers.dev/?url=';
const ALLORIGINS='https://api.allorigins.win/raw?url=';const CODETABS='https://api.codetabs.com/v1/proxy?quest=';
let proxyBase=localStorage.getItem('mirtiProxyBase')||DEFAULT_PROXY;
let all=[],hls=null,mpegPlayer=null,dashPlayer=null,activeGroup='Tümü',activeCat='CANLI',playerMode='tv',currentChannel=null;
let epgData={},epgChannels={};
const video=document.getElementById('player');const logBox=document.getElementById('urlLog');
document.getElementById('proxyInput').value=proxyBase;
const savedEpgUrl=localStorage.getItem('mirtiEpgUrl'); if(savedEpgUrl) document.getElementById('epgUrl').value=savedEpgUrl;
function toggleSet(){document.getElementById('settings').classList.toggle('open');}
function openTab(i){document.querySelectorAll('.box').forEach((x,j)=>x.classList.toggle('active',i===j));document.querySelectorAll('.tab').forEach((x,j)=>x.classList.toggle('active',i===j));}
function log(s){logBox.textContent=s;} function epgLog(s){document.getElementById('epgLog').textContent=s;}
function setPlayerMode(p){playerMode=p;document.querySelectorAll('.pBtn').forEach(x=>x.classList.toggle('active',x.dataset.p===p));}
function setCat(c){activeCat=c;activeGroup='Tümü';document.querySelectorAll('.catTab').forEach(x=>x.classList.toggle('active',x.dataset.cat===c));buildGroups();}
function saveProxy(){let v=document.getElementById('proxyInput').value.trim();proxyBase=v||DEFAULT_PROXY;localStorage.setItem('mirtiProxyBase',proxyBase);alert('Kaydedildi');}
function proxyUrl(u,b=proxyBase){return b?b+encodeURIComponent(u):u;}
function cleanUrl(u){return u.trim().split('|')[0].split(';')[0].replace(/\s+/g,'').replace(/&amp;/g,'&');}
function cleanGroupName(g){return (g||'Genel').replace(/^[^\wİıŞşĞğÜüÖöÇç]+/,'').trim();}
function inferCat(n,g){let a=(g||'').toLowerCase(),b=(n||'').toLowerCase();if(/film|movie|sinema|kemal/.test(a)||/\(\s*(19|20)\d/.test(b))return 'FILM';if(/dizi|yerli|güncel|series/.test(a)||/bölüm/.test(b))return 'DIZI';return 'CANLI';}
function parseM3U(t){const l=t.replace(/^\uFEFF/,'').split(/\r?\n/),o=[];let tmp=null;for(const r of l){const s=r.trim();if(!s)continue;if(s.startsWith('#EXTINF')){const c=s.indexOf(',');const name=c>=0?s.slice(c+1).trim():'Kanal '+(o.length+1);const attr=k=>{const m=s.match(new RegExp("(?:^|\\s)"+k+"=[\"']([^\"']*)[\"']","i"));return m?m[1].trim():'';};tmp={name,group:attr('group-title')||'Genel',logo:attr('tvg-logo'),tvgId:attr('tvg-id'),tvgName:attr('tvg-name')};}else if(!s.startsWith('#')&&/^https?:\/\//i.test(s)&&tmp){let logo=tmp.logo;if(logo&&logo.startsWith('http://'))logo=logo.replace(/^http:/,'https:');o.push({...tmp,url:cleanUrl(s),logo,cat:inferCat(tmp.name,tmp.group)});tmp=null;}}return o;}
function decodePaste(t){let x=t;if(/<html/i.test(x)){let m=x.match(/<pre[^>]*>([\s\S]*?)<\/pre>/i)||x.match(/<textarea[^>]*>([\s\S]*?)<\/textarea>/i);if(m)x=m[1];x=x.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"');}return x;}
async function fetchText(u,f=false){const c=f?[proxyUrl(u),CODETABS+encodeURIComponent(u),ALLORIGINS+encodeURIComponent(u)]:[u,proxyUrl(u),CODETABS+encodeURIComponent(u),ALLORIGINS+encodeURIComponent(u)];let last='';for(const q of [...new Set(c)]){try{const r=await fetch(q,{cache:'no-store'});if(!r.ok){last='HTTP '+r.status;continue;}let t=decodePaste(await r.text());if(t.length>20)return t;last='M3U değil';}catch(e){last=e.message;}}throw new Error(last);}
async function acceptList(t,n='Liste'){const ch=parseM3U(t);if(!ch.length)throw new Error('Kanal yok');all=ch;activeGroup='Tümü';await saveList(n,ch);buildGroups();document.getElementById('empty').style.display='flex';log('✅ '+ch.length+' yayın: '+n);await renderSaved();}
async function loadUrl(f=false){const u=document.getElementById('urlInput').value.trim();if(!u){log('URL boş');return;}log('İndiriliyor…');try{const t=await fetchText(u,f);await acceptList(t,'LISTE');toggleSet();}catch(e){log('HATA: '+e.message);}}
function loadFile(){const f=document.getElementById('fileInput').files[0];if(!f){log('Dosya seç');return;}const r=new FileReader();r.onload=async()=>{try{await acceptList(String(r.result),f.name);toggleSet();}catch(e){log('HATA: '+e.message);}};r.readAsText(f);}
async function loadManual(){try{await acceptList(document.getElementById('manualPaste').value,'MANUEL');toggleSet();}catch(e){log('HATA: '+e.message);}}
function parseXmltvDate(s){try{const m=s.match(/(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})?\s*([+-]\d{4})?/);if(!m)return new Date();let y=+m[1],mo=+m[2]-1,d=+m[3],h=+m[4],mi=+m[5],sec=+(m[6]||0);let dt=new Date(Date.UTC(y,mo,d,h,mi,sec));if(m[7]){let sign=m[7][0]==='+'?1:-1;let offH=+m[7].slice(1,3),offM=+m[7].slice(3,5);let offMin=sign*(offH*60+offM);dt=new Date(dt.getTime()-offMin*60000);}return dt;}catch(e){return new Date();}}
function parseEpgXml(xmlText){const parser=new DOMParser();const xml=parser.parseFromString(xmlText,"text/xml");const channels=xml.querySelectorAll("channel");const chanMap={};channels.forEach(ch=>{const id=ch.getAttribute("id");if(!id)return;const names=[...ch.querySelectorAll("display-name")].map(n=>n.textContent.trim());chanMap[id]=names;});const progs=xml.querySelectorAll("programme");const data={};progs.forEach(p=>{const chId=p.getAttribute("channel");const start=parseXmltvDate(p.getAttribute("start"));const stop=parseXmltvDate(p.getAttribute("stop"));const titleEl=p.querySelector("title");const descEl=p.querySelector("desc");const title=titleEl?titleEl.textContent.trim():'';const desc=descEl?descEl.textContent.trim():'';if(!data[chId])data[chId]=[];data[chId].push({start,stop,title,desc});});Object.keys(data).forEach(k=>{data[k].sort((a,b)=>a.start-b.start);});return {chanMap,data};}
function loadEpgMap(xmlText){try{const {chanMap,data}=parseEpgXml(xmlText);epgData=data;epgChannels=chanMap;const total=Object.values(data).reduce((s,a)=>s+a.length,0);epgLog(`✅ EPG: ${Object.keys(chanMap).length} kanal, ${total} program`);localStorage.setItem('mirtiEpgData',JSON.stringify({chanMap,data:Object.fromEntries(Object.entries(data).map(([k,v])=>[k,v.slice(0,200).map(x=>({...x,start:x.start.toISOString(),stop:x.stop.toISOString()}))]))}));render();}catch(e){epgLog('EPG Hata: '+e.message);}}
async function loadEpg(fp=false){let url=document.getElementById('epgUrl').value.trim();if(!url){epgLog('EPG URL boş');return;}localStorage.setItem('mirtiEpgUrl',url);epgLog('EPG indiriliyor…');try{const txt=await fetchText(url,fp);loadEpgMap(txt);}catch(e){epgLog('EPG HATA: '+e.message);}}
function loadEpgFile(){const f=document.getElementById('epgFile').files[0];if(!f){epgLog('Dosya seç');return;}const r=new FileReader();r.onload=()=>{loadEpgMap(String(r.result));};r.readAsText(f);}
function findEpgForChannel(ch){if(!ch)return null;const ids=[ch.tvgId,ch.tvgName,ch.name].filter(Boolean);for(let id of ids){if(epgData[id])return {id,progs:epgData[id]};let found=Object.keys(epgData).find(k=>k.toLowerCase()===id.toLowerCase());if(found)return {id:found,progs:epgData[found]};}for(let k of Object.keys(epgChannels)){let names=epgChannels[k]||[];if(names.some(n=>ids.some(i=>i&& (n.toLowerCase().includes(i.toLowerCase())||i.toLowerCase().includes(n.toLowerCase()))))){if(epgData[k])return {id:k,progs:epgData[k]};}}return null;}
function getNowNext(progs){const now=new Date();let cur=null,nxt=null;for(let i=0;i<progs.length;i++){if(progs[i].start<=now&&progs[i].stop>now){cur=progs[i];nxt=progs[i+1]||null;break;}if(progs[i].start>now){nxt=progs[i];break;}}return {cur,nxt};}
function openDB(){return new Promise((res,rej)=>{const req=indexedDB.open('MirtiTV_V39',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('lists'))d.createObjectStore('lists',{keyPath:'name'});};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});}
async function saveList(n,ch){try{const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction('lists','readwrite');tx.objectStore('lists').put({name:n,channels:ch,count:ch.length,time:Date.now()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){}}
async function renderSaved(){const box=document.getElementById('savedLists');try{const db=await openDB();const items=await new Promise((res,rej)=>{const q=db.transaction('lists','readonly').objectStore('lists').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});box.innerHTML='<b>KAYITLI LİSTELER</b>';items.sort((a,b)=>b.time-a.time).forEach(item=>{const d=document.createElement('div');d.className='savedItem';const s=document.createElement('span');s.textContent='📁 '+item.name+' ('+item.count+')';const go=document.createElement('b');go.textContent='▶';d.append(s,go);d.onclick=()=>{all=item.channels||[];activeGroup='Tümü';buildGroups();document.getElementById('empty').style.display='flex';toggleSet();};box.appendChild(d);});if(!items.length)box.innerHTML='<b>KAYITLI</b><p style="color:#777;font-size:11px">Yok</p>';}catch(e){box.textContent='Okunamadı';}}
async function clearSaved(){if(!confirm('Sil?'))return;const db=await openDB();await new Promise(r=>{const tx=db.transaction('lists','readwrite');tx.objectStore('lists').clear();tx.oncomplete=r;});renderSaved();}
function buildGroups(){const base=activeCat==='TUMU'?all:all.filter(c=>c.cat===activeCat);const raw=[...new Set(base.map(c=>c.group||'Genel'))];const display=['Tümü',...raw];const box=document.getElementById('groupList');box.innerHTML='';display.forEach(g=>{const cnt=g==='Tümü'?base.length:base.filter(c=> (c.group||'Genel')===g || cleanGroupName(c.group)===cleanGroupName(g) ).length;if(cnt===0&&g!=='Tümü')return;const b=document.createElement('div');b.className='group'+(activeGroup===g||cleanGroupName(activeGroup)===cleanGroupName(g)?' active':'');const a=document.createElement('span');a.textContent=g==='Tümü'?g:cleanGroupName(g);const n=document.createElement('span');n.textContent=cnt;n.style.cssText='background:#000;padding:2px 6px;border-radius:4px;font-size:10px;flex-shrink:0';b.append(a,n);b.onclick=()=>{activeGroup=g;buildGroups();};box.appendChild(b);});render();}
function safeImg(u){return /^https?:\/\//i.test(u||'');}
function render(){
 const base=activeCat==='TUMU'?all:all.filter(c=>c.cat===activeCat);
 const q=document.getElementById('search').value.toLowerCase();
 const list=base.filter(c=>{const gm=activeGroup==='Tümü'||(c.group||'Genel')===activeGroup||cleanGroupName(c.group)===cleanGroupName(activeGroup);const sm=(c.name||'').toLowerCase().includes(q)||(c.group||'').toLowerCase().includes(q);return gm&&sm;});
 const cl=document.getElementById('channelList'),fg=document.getElementById('filmGrid');
 if(activeCat==='CANLI'){cl.style.display='flex';fg.style.display='none';}else{cl.style.display='none';fg.style.display='grid';}
 cl.innerHTML='';fg.innerHTML='';
 list.forEach(c=>{
  if(activeCat==='FILM'||activeCat==='DIZI'||activeCat==='TUMU'){
   const d=document.createElement('div');d.className='filmCard';const w=document.createElement('div');w.className='posterWrap';
   if(safeImg(c.logo)){const img=document.createElement('img');img.className='poster';img.loading='lazy';img.src=c.logo;img.onerror=()=>{img.onerror=null;const p=proxyUrl(c.logo);if(img.src!==p){img.src=p;}else{w.innerHTML='';w.appendChild(makePoster(c.name));}};w.appendChild(img);}else w.appendChild(makePoster(c.name));
   const info=document.createElement('div');info.className='filmInfo';const t=document.createElement('div');t.className='filmTitle';t.textContent=c.name;const m=document.createElement('div');m.className='filmMeta';m.textContent=cleanGroupName(c.group);info.append(t,m);d.append(w,info);d.onclick=()=>play(c);fg.appendChild(d);
  }else{
   const epgMatch=findEpgForChannel(c);let cur=null,nxt=null,prog=0;if(epgMatch){const {cur:cc,nxt:nn}=getNowNext(epgMatch.progs);cur=cc;nxt=nn;if(cur){const tot=cur.stop-cur.start;const el=new Date()-cur.start;prog=Math.max(0,Math.min(100,(el/tot)*100));}}
   const d=document.createElement('div');d.className='ch'+(currentChannel&&currentChannel.url===c.url?' active':'');
   if(safeImg(c.logo)){const img=document.createElement('img');img.className='ch-logo';img.loading='lazy';img.src=c.logo;img.onerror=()=>{img.replaceWith(makeLogo(c.name))};d.appendChild(img);}else d.appendChild(makeLogo(c.name));
   const inf=document.createElement('div');inf.className='ch-info';const nm=document.createElement('div');nm.className='ch-name';nm.textContent=c.name;const epgEl=document.createElement('div');epgEl.className='ch-epg';epgEl.textContent=cur?`▶ ${cur.title}`:'';const nextEl=document.createElement('div');nextEl.className='ch-epg-next';nextEl.textContent=nxt?`Sonra: ${nxt.title}`:'';const pw=document.createElement('div');pw.className='ch-progress';const pb=document.createElement('div');pb.className='ch-progress-bar';pb.style.width=prog+'%';pw.appendChild(pb);inf.append(nm,epgEl,nextEl,pw);
   const ic=document.createElement('span');ic.className='ch-play';ic.textContent='▶';d.append(inf,ic);d.onclick=()=>play(c);cl.appendChild(d);
  }
 });
}
function makeLogo(n){const e=document.createElement('div');e.className='ch-fb';e.textContent=(n||'?').slice(0,1).toUpperCase();return e;}
function makePoster(n){const e=document.createElement('div');e.className='posterFb';e.textContent=(n||'?').slice(0,1).toUpperCase();return e;}
document.getElementById('search').addEventListener('input',render);
function detectFormat(u){let p='';try{p=new URL(u).pathname.toLowerCase();}catch(_){return 'unknown';}if(p.endsWith('.m3u8'))return 'hls';if(p.endsWith('.mpd'))return 'dash';if(/\.(ts|m2ts)$/.test(p))return 'mpegts';if(/\.(mp4|m4v|webm)$/.test(p))return 'native';return 'unknown';}
function stopPlayback(){if(hls){try{hls.destroy();}catch(_){}hls=null;}if(mpegPlayer){try{mpegPlayer.destroy();}catch(_){}mpegPlayer=null;}if(dashPlayer){try{dashPlayer.reset();}catch(_){}dashPlayer=null;}video.pause();video.removeAttribute('src');video.load();}
function play(c){currentChannel=c;document.getElementById('empty').style.display='none';document.getElementById('now').textContent=c.name;const epgMatch=findEpgForChannel(c);if(epgMatch){const {cur,nxt}=getNowNext(epgMatch.progs);document.getElementById('nowEpg').textContent=cur?`Şimdi: ${cur.title}`:'';document.getElementById('nowEpgNext').textContent=nxt?`Sonra: ${nxt.start.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})} - ${nxt.title}`:'';if(cur){const tot=cur.stop-cur.start;const el=new Date()-cur.start;const pct=Math.max(0,Math.min(100,(el/tot)*100));document.getElementById('epgProgressBar').style.width=pct+'%';}else document.getElementById('epgProgressBar').style.width='0%';}else{document.getElementById('nowEpg').textContent='';document.getElementById('nowEpgNext').textContent='';document.getElementById('epgProgressBar').style.width='0%';}const fmt=detectFormat(c.url);const routes=fmt==='hls'?['hls-direct','hls-proxy']:fmt==='dash'?['dash-direct','dash-proxy']:fmt==='mpegts'?['ts-direct','ts-proxy']:['native-direct','native-proxy','hls-direct','hls-proxy'];tryRoute(c.url,routes,0);}
function tryRoute(o,r,i){if(i>=r.length){document.getElementById('pType').textContent='Açılamadı';document.getElementById('empty').style.display='flex';return;}stopPlayback();const m=r[i];const prox=m.endsWith('-proxy');const u=prox?proxyUrl(o):o;document.getElementById('pType').textContent=m;let done=false;const to=setTimeout(()=>fin(false),18000);function fin(ok){if(done)return;done=true;clearTimeout(to);video.removeEventListener('playing',onP);video.removeEventListener('error',onE);if(ok){document.getElementById('pType').textContent='▶ '+m;}else tryRoute(o,r,i+1);}function onP(){fin(true)}function onE(){fin(false)}video.addEventListener('playing',onP);video.addEventListener('error',onE);try{if(m.startsWith('hls-')){if(Hls.isSupported()){hls=new Hls();hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)fin(false);});hls.loadSource(u);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));}else{video.src=u;video.play().catch(()=>{});}}else if(m.startsWith('dash-')){dashPlayer=dashjs.MediaPlayer().create();dashPlayer.initialize(video,u,false);video.play().catch(()=>{});}else if(m.startsWith('ts-')){if(mpegts.getFeatureList().mseLivePlayback){mpegPlayer=mpegts.createPlayer({type:'mpegts',isLive:true,url:u});mpegPlayer.attachMediaElement(video);mpegPlayer.load();mpegPlayer.play().catch(()=>{});}else fin(false);}else{video.src=u;video.load();video.play().catch(()=>{});}}catch(e){fin(false);}}
try{const saved=localStorage.getItem('mirtiEpgData');if(saved){const obj=JSON.parse(saved);epgChannels=obj.chanMap||{};const d={};Object.entries(obj.data||{}).forEach(([k,v])=>{d[k]=v.map(x=>({title:x.title,desc:x.desc,start:new Date(x.start),stop:new Date(x.stop)}));});epgData=d;epgLog(`Kaydedilmiş EPG: ${Object.keys(d).length} kanal`);}}catch(e){}
setInterval(()=>{if(Object.keys(epgData).length) render();},60000);
(async()=>{await renderSaved();})();
</script>
