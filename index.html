<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI TV Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@latest/dist/dash.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.10/shaka-player.compiled.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,Arial}
body{background:#0a0a0f;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{background:#111118;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #222}
header h1{font-size:22px;color:#e50914;font-weight:900;letter-spacing:1px;display:flex;align-items:center;gap:10px}
header h1 img{width:36px;height:36px;border-radius:8px;object-fit:cover}
header input{flex:1;min-width:250px;padding:10px 12px;border-radius:8px;border:1px solid #333;background:#1a1a24;color:#fff}
header button{padding:10px 16px;border:none;border-radius:8px;background:#e50914;color:#fff;font-weight:700;cursor:pointer}
header label.fileBtn{background:#222;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:14px}
main{flex:1;display:flex;overflow:hidden}
#sidebar{width:360px;min-width:300px;background:#111118;border-right:1px solid #222;display:flex;flex-direction:column}
#list{flex:1;overflow-y:auto}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;border-bottom:1px solid #1a1a24}
.item:hover{background:#1c1c28}.item.active{background:#e50914}
.item img{width:44px;height:44px;border-radius:8px;object-fit:contain;background:#000;border:1px solid #333}
#playerArea{flex:1;display:flex;flex-direction:column;background:#000}
video{width:100%;height:100%;background:#000}
#nowPlaying{padding:12px 16px;background:#111118;border-top:1px solid #222}
</style>
</head>
<body>
<header>
<h1><img src="https://raw.githubusercontent.com/ahmetdogan68/tv/main/logo.jpg" onerror="this.src='https://i.imgur.com/5R5Jp1L.png'"> MIRTI</h1>
<input id="urlInput" placeholder="M3U / M3U8 Linki yapıştır" />
<button onclick="loadFromUrl()">Yükle</button>
<label class="fileBtn">📁 Dosya <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" style="display:none"></label>
</header>
<main>
<div id="sidebar"><div id="list"><div style="padding:40px;text-align:center;color:#666">Liste yükleyin</div></div></div>
<div id="playerArea"><video id="video" controls autoplay playsinline></video><div id="nowPlaying"><div id="npName" style="font-weight:800">Kanal seçin</div><div id="info" style="font-size:12px;color:#888">MIRTI - Tüm formatlar desteklenir</div></div></div>
</main>
<script>
let channels=[]; let hls=null; let dashPlayer=null;
function parseM3U(text){
  channels=[]; const lines=text.split(/\r?\n/); let meta=null;
  for(let line of lines){
    line=line.trim();
    if(line.startsWith('#EXTINF')){
      const name=(line.match(/,(.*)$/)||[])[1]||"Bilinmeyen").trim();
      const logo=(line.match(/tvg-logo="([^"]*)"/)||[])[1]||"";
      const group=(line.match(/group-title="([^"]*)"/)||[])[1]||"Genel";
      meta={name,logo,group};
    }else if(line &&!line.startsWith('#') && meta){
      channels.push({...meta,url:line}); meta=null;
    }
  }
  renderList();
}
function renderList(){
  const list=document.getElementById('list'); let html='';
  channels.forEach((ch,i)=>{
    html+=`<div class="item" onclick="playChannel(${i})"><img src="${ch.logo}" onerror="this.style.display='none'"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ch.name}</div></div>`;
  });
  list.innerHTML=html;
}
function playChannel(idx){
  const ch=channels[idx]; if(!ch) return;
  document.getElementById('npName').innerText=ch.name;
  document.getElementById('info').innerText=ch.url;
  const video=document.getElementById('video');
  if(hls){hls.destroy();hls=null}
  if(dashPlayer){dashPlayer.reset();dashPlayer=null}
  const url=ch.url;
  // 1. DASH
  if(url.includes('.mpd')){
    dashPlayer=dashjs.MediaPlayer().create(); dashPlayer.initialize(video, url, true);
  // 2. HLS
  }else if(url.includes('.m3u8')){
    if(Hls.isSupported()){hls=new Hls({lowLatencyMode:true});hls.loadSource(url);hls.attachMedia(video);}
    else{video.src=url;}
  // 3. MP4, MP3, TS, her şey
  }else{
    video.src=url;
  }
  video.play().catch(()=>{});
}
async function loadFromUrl(){
  const url=document.getElementById('urlInput').value.trim();
  if(!url) return;
  try{
    let text;
    try{ text=await (await fetch(url)).text(); }catch{
      text=await (await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url))).text();
    }
    parseM3U(text);
  }catch(e){ alert('Yüklenemedi, dosyayı indirip manuel yükleyin'); }
}
document.getElementById('fileInput').addEventListener('change',e=>{
  const reader=new FileReader(); reader.onload=ev=>parseM3U(ev.target.result);
  reader.readAsText(e.target.files[0]);
});
</script>
</body>
</html>
