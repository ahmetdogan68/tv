<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI TV - SON FIX</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070b14;color:#fff;font-family:Arial;display:flex;height:100vh;overflow:hidden}
#left{width:230px;background:#0b1120;border-right:2px solid #1e2d4a;display:flex;flex-direction:column}
#mid{flex:1;background:#0e1424;display:flex;flex-direction:column}
#playerArea{width:520px;background:#000;display:flex;flex-direction:column;position:relative;border-left:2px solid #1e2d4a}
#logoTop{padding:10px;display:flex;align-items:center;gap:8px;background:#080e1e;border-bottom:1px solid #1e2d4a}
.mainCats{display:flex;padding:5px;gap:3px;border-bottom:1px solid #1e2d4a}
.mainCat{flex:1;padding:7px;background:#151d32;border-radius:5px;text-align:center;cursor:pointer;font-size:10px;border:1px solid #1e2d4a}
.mainCat.active{background:#ff0a16}
#groupList{flex:1;overflow-y:auto;padding:6px}
.group{padding:9px;background:#151d32;margin:3px 0;border-radius:6px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;border:1px solid #1e2d4a}
.group.active{background:#ff0a16}
#channelList{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px}
#channelList.posterView{flex-direction:row;flex-wrap:wrap;gap:8px}
.ch{padding:8px;background:#1a2340;border-radius:6px;cursor:pointer;border:1px solid #1e2d4a;display:flex;gap:8px;align-items:center;width:100%}
.ch.active{background:#ff0a16}
.ch img{width:36px;height:36px;border-radius:4px;background:#000;object-fit:contain}
.poster{width:130px;background:#151d32;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid #1e2d4a}
.poster img{width:100%;height:180px;object-fit:cover}
.poster div{padding:5px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poster.active{border-color:#ff0a16}
#player{flex:1;width:100%;background:#000}
#bar{padding:8px;background:#0b1120;display:flex;justify-content:space-between;font-size:11px}
#resInfo{padding:6px 10px;background:#151d32;font-size:10px;color:#8aa;display:flex;justify-content:space-between}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070b14;z-index:10}
#settings{position:absolute;top:0;right:0;bottom:0;width:340px;background:#0b1120;border-left:2px solid #ff0a16;z-index:20;transform:translateX(100%);transition:.3s;padding:10px}
#settings.open{transform:translateX(0)}
.btn{width:100%;padding:8px;background:#ff0a16;color:#fff;border:none;border-radius:5px;font-weight:bold;cursor:pointer;margin-top:4px;font-size:11px}
input{width:100%;padding:7px;border-radius:5px;border:1px solid #1e2d4a;background:#060a14;color:#fff;margin-top:4px;font-size:11px}
.tabs{display:flex;gap:4px}
.tab{flex:1;padding:6px;background:#1a2744;border-radius:5px;text-align:center;cursor:pointer;font-size:10px}
.tab.active{background:#ff0a16}
.box{display:none;margin-top:6px;padding:8px;background:#151d32;border-radius:6px;border:1px solid #1e2d4a}
.box.active{display:block}
#debug{font-size:9px;color:#ff7070;margin-top:6px;background:#000;padding:4px;border-radius:4px;max-height:90px;overflow-y:auto;white-space:pre-wrap}
</style>
</head>
<body>

<div id="left">
<div id="logoTop"><img src="logo.png" style="width:32px;height:32px;border-radius:6px" onerror="this.style.display='none'"><h1 style="color:#ff0a16;font-size:14px">MIRTI TV</h1><button onclick="toggleSet()" style="margin-left:auto;background:#1a2744;border:none;color:#fff;padding:4px 8px;border-radius:4px">⚙️</button></div>
<div class="mainCats"><div class="mainCat active" onclick="setMain('Tümü')">Tümü</div><div class="mainCat" onclick="setMain('Canlı')">CANLI</div><div class="mainCat" onclick="setMain('Film')">FİLM</div><div class="mainCat" onclick="setMain('Dizi')">DİZİ</div></div>
<div id="groupList"></div>
</div>

<div id="mid">
<div style="padding:8px;background:#ff0a16;font-size:11px;font-weight:bold;display:flex;justify-content:space-between"><span id="midTitle">KANALLAR</span><span id="midCount">0</span></div>
<input id="search" placeholder="🔍 Ara..." style="margin:6px;width:95%">
<div id="channelList"></div>
</div>

<div id="playerArea">
<div id="empty"><img src="logo.png" style="width:170px"><h2 style="color:#ff0a16;margin-top:8px">MIRTI TV</h2><button class="btn" style="width:160px;margin-top:10px" onclick="toggleSet()">⚙️ LİSTE YÜKLE</button><p style="font-size:9px;color:#5a6a8a;margin-top:6px">TS + HLS + Proxy fix aktif</p></div>
<video id="player" controls autoplay playsinline></video>
<div id="bar"><span id="now">Hazır</span><span id="pType" style="color:#ff0a16">-</span></div>
<div id="resInfo"><span id="resText">Çözünürlük: -</span><span id="epgInfo">EPG: -</span></div>

<div id="settings">
<div style="display:flex;justify-content:space-between"><b>AYARLAR</b><button onclick="toggleSet()" style="background:#ff0a16;border:none;color:#fff;padding:4px 10px;border-radius:4px">X</button></div>
<div class="tabs" style="margin-top:8px"><div class="tab active" onclick="openTab(0)">URL</div><div class="tab" onclick="openTab(1)">DOSYA</div><div class="tab" onclick="openTab(2)">TEST</div></div>
<div class="box active" id="b0"><input id="urlInput" placeholder="m3u link"><button class="btn" onclick="loadUrl()">YÜKLE</button></div>
<div class="box" id="b1"><label for="fileInput" style="display:block;text-align:center;color:#ff0a16;border:1px dashed #ff0a16;padding:10px;border-radius:6px;cursor:pointer">📁 DOSYA SEÇ</label><input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" style="display:none"></div>
<div class="box" id="b2"><button class="btn" onclick="loadTestList()">📺 SENİN 7 KANALI YÜKLE</button><div style="font-size:9px;color:#8aa;margin-top:4px">TRT1, ATV, SHOW, KANAL D, STAR, NOW, HALK - fix ile</div></div>
<input id="epgInput" value="https://epgshare01.online/epgshare01/epg_ripper_TR1.xml" style="margin-top:8px"><button class="btn" style="background:#1a2744" onclick="loadEPG(document.getElementById('epgInput').value)">EPG YENİLE</button>
<div id="status" style="font-size:10px;color:#5a6a8a;margin-top:6px"></div>
<div id="debug">Hazır</div>
</div>
</div>

<script>
let all=[]; let epg={}; let hls=null; let mpegPlayer=null; let mainCat='Tümü'; let activeGroup='Tümü';
const video=document.getElementById('player');
function log(t){ document.getElementById('debug').textContent=t+"\n"+document.getElementById('debug').textContent.slice(0,400); }
function toggleSet(){ document.getElementById('settings').classList.toggle('open'); }
function openTab(i){ document.querySelectorAll('.box').forEach((b,idx)=>b.classList.toggle('active',idx===i)); document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i)); }
function catOf(n,g){ let s=(n+' '+g).toLowerCase(); if(/film|movie|vod|sinema/.test(s))return 'Film'; if(/dizi|series|sezon|bolum|bölüm/.test(s))return 'Dizi'; return 'Canlı'; }
function parseM3U(text){
const lines=text.split(/\r?\n/); const out=[]; let tmp={name:'',group:'Genel',logo:'',tvgId:'',tvgName:''}; let epgFrom='';
for(let l of lines){ l=l.trim(); if(!l)continue; if(l.startsWith('#EXTINF')){ tmp.name=l.split(',').pop().trim()||''; let gM=l.match(/group-title="([^"]+)"/); tmp.group=gM?gM[1].trim():'Genel'; tmp.logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||''; tmp.tvgId=(l.match(/tvg-id="([^"]+)"/)||[])[1]||''; tmp.tvgName=(l.match(/tvg-name="([^"]+)"/)||[])[1]||''; }else if(!l.startsWith('#')&&l.startsWith('http')){ if(!tmp.name) tmp.name='Kanal '+(out.length+1); out.push({name:tmp.name,group:tmp.group,logo:tmp.logo,tvgId:tmp.tvgId,tvgName:tmp.tvgName||tmp.name,cat:catOf(tmp.name,tmp.group),url:l}); tmp={name:'',group:'Genel',logo:'',tvgId:'',tvgName:''}; } }
return {channels:out, epgFrom};
}
async function fetchProxy(url){
const proxies=[
url,
'https://corsproxy.io/?'+encodeURIComponent(url),
'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(url)
];
for(let p of proxies){ try{ let r=await fetch(p,{cache:'no-store'}); if(r.ok){ let t=await r.text(); if(t.length>100) return t; } }catch(e){} }
throw 'CORS';
}

// SENİN LİSTEN - FIX'Lİ VERSİYON
function loadTestList(){
const raw = `#EXTINF:-1 tvg-id="trt 1.tr" tvg-name="TRT 1.tr" tvg-logo="https://www.trt.net.tr/_nuxt/img/trt-1-televizyon-kanali.4c9c3dd.png" group-title="📺 ULUSAL",TRT 1
https://tv-trt1.medya.trt.com.tr/master.m3u8
#EXTINF:-1 tvg-name="atv" tvg-logo="https://www.dsmart.com.tr/epg/images/0x60/59f19761cfef0b221f7da844" group-title="📺 ULUSAL",ATV
http://line.tivi-one.net:80/play/live.php?mac=00:1A:79:88:CC:0E&stream=196698&extension=ts&play_token=6k77AngOgl
#EXTINF:-1 tvg-id="show tv" tvg-name="show TV" tvg-logo="https://www.dsmart.com.tr/epg/images/0x60/59f19761cfef0b221f7da88e" group-title="📺 ULUSAL",SHOW
https://rmtftbjlne.turknet.ercdn.net/bpeytmnqyp/showtv/showtv_1080p.m3u8
#EXTINF:-1 tvg-id="kanal d.tr" tvg-name="kanal d" tvg-logo="https://www.dsmart.com.tr/epg/images/0x60/59f19761cfef0b221f7da806" group-title="📺 ULUSAL",KANAL D
https://demiroren.daioncdn.net/kanald/kanald.m3u8?app=kanald_web&ce=3
#EXTINF:-1 tvg-id="Star tv" tvg-name="Star tv" tvg-logo="https://github.com/tv-logo/tv-logos/blob/main/countries/turkey/star-tv-tr.png?raw=true" group-title="📺 ULUSAL",STAR
https://dogus.daioncdn.net/startv/startv_720p.m3u8?&sid=8l4w3lst4co5&app=a20ac41e-bdc3-4aa1-934d-26b484480ac9&ce=3
#EXTINF:-1 tvg-id="Fox.tr" tvg-name="Fox tr" tvg-logo="https://raw.githubusercontent.com/46tv/mix/main/logo/NOW.png" group-title="📺 ULUSAL",NOW
https://dogus.tecostream.xyz/now.m3u8
#EXTINF:-1 tvg-name="halk TV" tvg-logo="https://github.com/tv-logo/tv-logos/blob/main/countries/turkey/halk-tv-tr.png?raw=true" group-title="📰 HABER",HALK
https://halktv-live.daioncdn.net/halktv/halktv.m3u8`;
let res=parseM3U(raw);
all=res.channels;
apply();
loadEPG('https://epgshare01.online/epgshare01/epg_ripper_TR1.xml');
toggleSet();
log('7 kanal yüklendi - proxy fix aktif');
}

function playChannel(c){
document.getElementById('empty').style.display='none';
document.getElementById('now').textContent=c.name;
log('Oynat: '+c.name+' -> '+c.url.slice(0,70));
if(hls){try{hls.destroy()}catch(e){} hls=null;}
if(mpegPlayer){try{mpegPlayer.destroy()}catch(e){} mpegPlayer=null;}
video.pause(); video.removeAttribute('src'); video.load();

let url=c.url;

// ATV gibi http TS için https proxy kullan
if(url.startsWith('http://')){
url='https://corsproxy.io/?'+encodeURIComponent(url);
log('http -> https proxy: '+url.slice(0,60));
}

// TS uzantılı ise mpegts.js dene
if(c.url.includes('.ts')||c.url.includes('extension=ts')||c.url.includes('live.php')){
log('TS tespit -> mpegts.js');
if(mpegts.isSupported()){
mpegPlayer=mpegts.createPlayer({type:'mse', isLive:true, url:url}, {liveBufferLatencyChasing:true, enableStashBuffer:false});
mpegPlayer.attachMediaElement(video);
mpegPlayer.load();
mpegPlayer.play().then(()=>{ document.getElementById('pType').textContent='MPEG-TS'; log('MPEG-TS OK'); }).catch(e=>{ log('MPEG-TS fail '+e+' -> HLS'); tryHls(c,url); });
return;
}
}
tryHls(c,url);
}

function tryHls(c,url){
log('HLS deneniyor');
if(Hls.isSupported()){
hls=new Hls({
enableWorker:true,
lowLatencyMode:false,
xhrSetup:function(xhr, url){
xhr.withCredentials=false;
// Kanal D / Star için referer header proxy üzerinden
if(url.includes('demiroren')||url.includes('daioncdn')||url.includes('tecostream')){
xhr.setRequestHeader('Referer','https://www.kanald.com.tr/');
}
}
});
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>{ video.play().then(()=>{ document.getElementById('pType').textContent='HLS.js'; log('HLS OK '+video.videoWidth+'x'+video.videoHeight); document.getElementById('resText').textContent='Çözünürlük: '+video.videoWidth+'x'+video.videoHeight; }).catch(e=>log('Play error '+e)); });
hls.on(Hls.Events.ERROR,(e,d)=>{ log('HLS ERR '+d.details+' '+d.type); if(d.fatal){ log('HLS fatal -> Native'); tryNative(url); } });
}else tryNative(url);
}
function tryNative(url){
log('Native deneniyor');
video.src=url;
video.play().then(()=>{ document.getElementById('pType').textContent='Native'; log('Native OK'); }).catch(e=>{ log('Native fail '+e.message); document.getElementById('pType').textContent='Açılamadı'; document.getElementById('resText').textContent='Token süresi dolmuş olabilir - linki yenile'; });
}

async function loadEPG(url){
document.getElementById('status').textContent='EPG yükleniyor...';
log('EPG: '+url);
try{
let txt=await fetchProxy(url);
let parser=new DOMParser(); let xml=parser.parseFromString(txt,'text/xml');
let progs=xml.querySelectorAll('programme'); let now=new Date(); let tmp={}; let cnt=0;
progs.forEach(p=>{
let ch=p.getAttribute('channel'); let s=p.getAttribute('start'); let title=p.querySelector('title')?.textContent||''; if(!ch||!s)return;
let y=parseInt(s.substring(0,4)), mo=parseInt(s.substring(4,6))-1, d=parseInt(s.substring(6,8)), h=parseInt(s.substring(8,10)), mi=parseInt(s.substring(10,12));
let sDate=new Date(y,mo,d,h,mi);
if(Math.abs(sDate-now)<4*60*60*1000){ tmp[ch]=tmp[ch]||{now:title}; cnt++; }
});
epg=tmp;
document.getElementById('status').textContent=`EPG: ${cnt} program`;
document.getElementById('epgInfo').textContent=`EPG: ${cnt} yüklendi`;
log('EPG OK '+cnt);
renderCh();
}catch(e){ log('EPG fail '+e); }
}
function loadUrl(){ let url=document.getElementById('urlInput').value.trim(); if(!url)return; fetchProxy(url).then(txt=>{ let res=parseM3U(txt); if(res.channels.length){ all=res.channels; apply(); loadEPG('https://epgshare01.online/epgshare01/epg_ripper_TR1.xml'); toggleSet(); } }).catch(()=>alert('CORS')); }
function apply(){ document.getElementById('empty').style.display='none'; buildGroups(); }
function setMain(cat){ mainCat=cat; document.querySelectorAll('.mainCat').forEach(t=>t.classList.toggle('active', t.textContent.includes(cat.toUpperCase()) || (cat==='Tümü'&&t.textContent==='Tümü'))); activeGroup='Tümü'; buildGroups(); }
function buildGroups(){ let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat); let groups=['Tümü',...new Set(base.map(c=>c.group))].filter(Boolean); const box=document.getElementById('groupList'); box.innerHTML=''; groups.forEach(g=>{ let cnt=g==='Tümü'?base.length:base.filter(x=>x.group===g).length; let b=document.createElement('div'); b.className='group'+(activeGroup===g?' active':''); b.innerHTML=`<span>${g}</span><span style="background:#070b14;padding:2px 6px;border-radius:10px;font-size:10px">${cnt}</span>`; b.onclick=()=>{ activeGroup=g; document.querySelectorAll('.group').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderCh(); }; box.appendChild(b); }); renderCh(); }
function renderCh(){ let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat); let list=base.filter(c=>activeGroup==='Tümü'||c.group===activeGroup); let q=document.getElementById('search').value.toLowerCase(); if(q) list=list.filter(c=>c.name.toLowerCase().includes(q)); const box=document.getElementById('channelList'); box.innerHTML=''; document.getElementById('midTitle').textContent=activeGroup==='Tümü'?mainCat: activeGroup; document.getElementById('midCount').textContent=list.length; if(mainCat==='Film'||mainCat==='Dizi') box.classList.add('posterView'); else box.classList.remove('posterView'); list.forEach(c=>{ let prog=epg[c.tvgId]||epg[c.tvgName]||epg[c.name]||null; let logo=c.logo||''; if(mainCat==='Film'||mainCat==='Dizi'){ let d=document.createElement('div'); d.className='poster'; d.innerHTML=`<img src="${logo}" onerror="this.src='https://via.placeholder.com/130x180/151d32/ff0a16?text=TV'"><div>${c.name}</div>`; d.onclick=()=>playChannel(c); box.appendChild(d); }else{ let d=document.createElement('div'); d.className='ch'; d.innerHTML=`<img src="${logo}" onerror="this.src='https://via.placeholder.com/36x36/0b1120/ff0a16?text=TV'"><div><div class="n">${c.name}</div><div class="e">${prog? '▶ '+prog.now : c.group}</div></div>`; d.onclick=()=>{ document.querySelectorAll('.ch').forEach(x=>x.classList.remove('active')); d.classList.add('active'); playChannel(c); }; box.appendChild(d); } }); }
video.addEventListener('loadedmetadata',()=>{ document.getElementById('resText').textContent=`Çözünürlük: ${video.videoWidth}x${video.videoHeight}`; });
document.getElementById('fileInput').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{ let res=parseM3U(ev.target.result); if(res.channels.length){ all=res.channels; apply(); loadEPG('https://epgshare01.online/epgshare01/epg_ripper_TR1.xml'); toggleSet(); document.getElementById('empty').style.display='none'; } }; r.readAsText(f); });
document.getElementById('search').addEventListener('input',renderCh);
loadTestList();
</script>
</body>
</html>
