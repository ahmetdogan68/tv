<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRTI TV FIXED - FINAL</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070b14;color:#fff;font-family:Arial;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#playerArea{background:#000;position:relative;height:36vh;min-height:200px}
#player{width:100%;height:100%;background:#000}
#bar{position:absolute;bottom:0;left:0;right:0;padding:6px 10px;background:rgba(0,0,0,0.85);display:flex;justify-content:space-between;font-size:11px;z-index:2}
#topBar{padding:8px;background:#0b1120;border-bottom:2px solid #ff0a16;display:flex;align-items:center;gap:8px}
#main{flex:1;display:flex;overflow:hidden}
#left{width:120px;min-width:120px;background:#0b1120;border-right:1px solid #1e2d4a;display:flex;flex-direction:column}
#mid{flex:1;background:#0e1424;display:flex;flex-direction:column}
.mainCat{padding:8px 2px;background:#151d32;margin:2px;border-radius:6px;text-align:center;cursor:pointer;font-size:10px;border:1px solid #1e2d4a}
.mainCat.active{background:#ff0a16}
#groupList{flex:1;overflow-y:auto;padding:4px}
.group{padding:10px 4px;background:#1a2340;margin:3px 0;border-radius:6px;cursor:pointer;font-size:11px;border:1px solid #1e2d4a;text-align:center}
.group.active{background:#ff0a16}
#channelHeader{padding:8px;background:#ff0a16;font-weight:bold;display:flex;justify-content:space-between;font-size:12px}
#channelList{flex:1;overflow-y:auto;padding:5px}
.ch{padding:12px;background:#1a2340;margin:5px 0;border-radius:8px;cursor:pointer;border:1px solid #1e2d4a;display:flex;gap:10px;align-items:center}
.ch.active{background:#ff0a16}
.ch img{width:46px;height:46px;border-radius:6px;background:#000;object-fit:contain}
#settings{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:400px;background:#0b1120;border-left:3px solid #ff0a16;z-index:50;transform:translateX(100%);transition:.3s;padding:12px;overflow-y:auto}
#settings.open{transform:translateX(0)}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;padding:8px;background:#1a2744;border-radius:6px;text-align:center;cursor:pointer;font-size:11px}
.tab.active{background:#ff0a16}
.box{display:none;margin-top:8px;padding:10px;background:#151d32;border-radius:8px;border:1px solid #1e2d4a}
.box.active{display:block}
input{width:100%;padding:10px;border-radius:6px;border:1px solid #1e2d4a;background:#060a14;color:#fff;margin-top:5px}
.btn{width:100%;padding:10px;background:#ff0a16;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:5px}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070b14;z-index:5;text-align:center;padding:20px}
#debug{position:absolute;top:5px;left:5px;background:rgba(0,0,0,0.9);padding:6px 10px;border-radius:6px;font-size:10px;color:#0f0;z-index:10;max-width:90%;display:none}
</style>
</head>
<body>
<div id="playerArea">
<div id="empty"><h2 style="color:#ff0a16">MIRTI TV FIXED</h2><p style="font-size:11px;color:#8aa">Pipe'lı linkler ve referer fixlendi</p><button class="btn" style="width:160px" onclick="toggleSet()">⚙️ LİSTE EKLE</button></div>
<div id="debug"></div>
<video id="player" controls playsinline webkit-playsinline referrerpolicy="no-referrer"></video>
<div id="bar"><span id="now">Kanal seç</span><span id="pType">Hazır</span></div>
</div>

<div id="topBar">
<b style="color:#ff0a16">MIRTI TV</b><span id="failInfo" style="font-size:10px;color:#ff0a16;margin-left:10px"></span>
<button onclick="toggleSet()" style="margin-left:auto;background:#ff0a16;border:none;color:#fff;padding:6px 12px;border-radius:5px">⚙️ LİSTE</button>
</div>

<div id="main">
<div id="left">
<div class="mainCat active" onclick="setMain('Tümü')">Tümü</div>
<div class="mainCat" onclick="setMain('Canlı')">CANLI</div>
<div class="mainCat" onclick="setMain('Film')">FİLM</div>
<div class="mainCat" onclick="setMain('Dizi')">DİZİ</div>
<div id="groupList"></div>
</div>
<div id="mid">
<div id="channelHeader"><span id="midTitle">KANALLAR</span><span id="midCount">0</span></div>
<input id="search" placeholder="🔍 Ara..." style="margin:5px;padding:10px;background:#060a14;border:1px solid #1e2d4a;border-radius:6px;color:#fff">
<div id="channelList"></div>
</div>
</div>

<div id="settings">
<div style="display:flex;justify-content:space-between"><b style="color:#ff0a16">AYARLAR - FIXED</b><button onclick="toggleSet()" style="background:#ff0a16;border:none;color:#fff;padding:6px 12px;border-radius:5px">X</button></div>
<div id="savedLists" style="margin-top:8px;max-height:120px;overflow-y:auto;background:#151d32;padding:6px;border-radius:6px"></div>
<div class="tabs"><div class="tab active" onclick="openTab(0)">URL</div><div class="tab" onclick="openTab(1)">DOSYA</div></div>
<div class="box active" id="b0"><input id="urlInput" value="https://dpaste.com/4T2DNM3J3.txt"><button class="btn" onclick="loadUrl()">YÜKLE</button></div>
<div class="box" id="b1"><label for="fileInput" style="display:block;text-align:center;color:#ff0a16;border:2px dashed #ff0a16;padding:16px;border-radius:8px">📁 DOSYADAN SEÇ</label><input type="file" id="fileInput" accept=".m3u,.txt" style="display:none"></div>
<div id="status" style="font-size:11px;color:#0f0;margin-top:8px;padding:8px;background:#060a14;border-radius:6px;white-space:pre-wrap">Hazır</div>
</div>

<script>
let all=[]; let hls=null; let mpegPlayer=null; let mainCat='Tümü'; let activeGroup='Tümü'; let currentList=''; const video=document.getElementById('player');
let db;
function openDB(){return new Promise((res)=>{let req=indexedDB.open('MirtiTV_FIX',1);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('lists'))d.createObjectStore('lists',{keyPath:'name'});};req.onsuccess=e=>{db=e.target.result;res(db);};});}
async function saveToDB(name, channels){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readwrite');tx.objectStore('lists').put({name,channels,count:channels.length});tx.oncomplete=()=>r();});}
async function getAllFromDB(){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readonly');let q=tx.objectStore('lists').getAll();q.onsuccess=()=>r(q.result);});}
async function deleteFromDB(name){if(!db) await openDB();return new Promise((r)=>{let tx=db.transaction('lists','readwrite');tx.objectStore('lists').delete(name);tx.oncomplete=()=>r();});}
function toggleSet(){document.getElementById('settings').classList.toggle('open');}
function openTab(i){document.querySelectorAll('.box').forEach((b,idx)=>b.classList.toggle('active',idx===i));document.querySelectorAll('.tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));}
function catOf(n,g){let s=(n+' '+g).toLowerCase();if(/film|movie|vod/.test(s))return 'Film';if(/dizi|series/.test(s))return 'Dizi';return 'Canlı';}
function splitPipe(url){
  if(!url.includes('|')) return {url, headers:{}};
  let [base, query] = url.split('|');
  let headers={};
  query.split('&').forEach(p=>{
    let [k,v]=p.split('=');
    if(k&&v) headers[k.trim().toLowerCase()]=decodeURIComponent(v.trim());
  });
  return {url:base.trim(), headers};
}
function parseM3U(text){
  const lines=text.split(/\r?\n/); const out=[]; let tmp={name:'',group:'Genel',logo:'',referrer:''}; let lastRef='';
  for(let l of lines){l=l.trim();if(!l)continue;
    if(l.startsWith('#EXTVLCOPT:http-referrer=')){lastRef=l.split('=')[1]||'';continue;}
    if(l.startsWith('#EXTINF')){
      tmp.name=l.split(',').pop().trim()||'';
      let gM=l.match(/group-title="([^"]+)"/); tmp.group=gM?gM[1].trim():'Genel';
      tmp.logo=(l.match(/tvg-logo="([^"]+)"/)||[])[1]||'';
      let r1=(l.match(/http-referrer="([^"]+)"/)||[])[1]||''; let r2=(l.match(/referrer="([^"]+)"/)||[])[1]||'';
      tmp.referrer=r1||r2||lastRef||''; if(lastRef) lastRef='';
    }else if(!l.startsWith('#')&&l.startsWith('http')){
      if(!tmp.name) tmp.name='Kanal '+(out.length+1);
      let parsed=splitPipe(l);
      out.push({name:tmp.name,group:tmp.group,logo:tmp.logo,cat:catOf(tmp.name,tmp.group),url:parsed.url,referrer:tmp.referrer||parsed.headers.referrer||parsed.headers.referer||''});
      tmp={name:'',group:'Genel',logo:'',referrer:''};
    }
  } return {channels:out};
}
async function fetchDirect(url){
  try{let r=await fetch(url,{cache:'no-store'});if(r.ok){let t=await r.text();if(t.length>50) return t;}}catch(e){}
  const ps=['https://api.allorigins.win/raw?url='+encodeURIComponent(url),'https://corsproxy.io/?'+encodeURIComponent(url)];
  for(let p of ps){try{let r=await fetch(p);if(r.ok){let t=await r.text();if(t.length>50) return t;}}catch(e){}}
  throw 'CORS';
}
async function loadUrl(){
  let u=document.getElementById('urlInput').value.trim(); if(!u) return;
  let st=document.getElementById('status'); st.textContent='Yükleniyor...';
  try{
    let txt=await fetchDirect(u);
    let res=parseM3U(txt);
    if(res.channels.length){
      all=res.channels; currentList=u.split('/').pop().slice(0,25);
      await saveToDB(currentList, all);
      await renderSaved();
      apply();
      document.getElementById('empty').style.display='none';
      st.textContent=res.channels.length+' kanal yüklendi';
      toggleSet();
    }else{ st.textContent='Kanal bulunamadı - içerik: '+txt.slice(0,100); }
  }catch(e){ st.textContent='Yüklenemedi: '+e+' - Dosyadan dene'; }
}
async function renderSaved(){let lists=await getAllFromDB();const box=document.getElementById('savedLists');box.innerHTML='';lists.forEach(item=>{let d=document.createElement('div');d.style.cssText='padding:6px;background:#1a2340;margin:3px 0;border-radius:5px;display:flex;justify-content:space-between;border:1px solid #1e2d4a'+(item.name===currentList?';background:#ff0a16':'');d.innerHTML=`<span>📁 ${item.name} (${item.count})</span><span onclick="event.stopPropagation();delList('${item.name}')" style="color:#ff0a16">✕</span>`;d.onclick=()=>{all=item.channels;currentList=item.name;apply();document.getElementById('empty').style.display='none';toggleSet();};box.appendChild(d);});}
async function delList(k){if(confirm(k+' sil?')){await deleteFromDB(k);await renderSaved();}}
function apply(){buildGroups();}
function setMain(cat){mainCat=cat;document.querySelectorAll('.mainCat').forEach(t=>t.classList.toggle('active',t.textContent.includes(cat)));activeGroup='Tümü';buildGroups();}
function buildGroups(){
  let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat);
  let groups=['Tümü',...new Set(base.map(c=>c.group))].filter(Boolean);
  const box=document.getElementById('groupList'); box.innerHTML='';
  if(all.length===0){box.innerHTML='<div style="padding:10px;text-align:center;color:#5a6a8a;font-size:10px">Liste yok</div>';return;}
  groups.forEach(g=>{
    let cnt=g==='Tümü'?base.length:base.filter(x=>x.group===g).length;
    let b=document.createElement('div'); b.className='group'+(activeGroup===g?' active':''); b.textContent=g+' ('+cnt+')';
    b.onclick=()=>{activeGroup=g;document.querySelectorAll('.group').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderCh();};
    box.appendChild(b);
  });
  renderCh();
}
function renderCh(){
  let base=all.filter(c=>mainCat==='Tümü'||c.cat===mainCat);
  let list=base.filter(c=>activeGroup==='Tümü'||c.group===activeGroup);
  let q=document.getElementById('search').value.toLowerCase(); if(q) list=list.filter(c=>c.name.toLowerCase().includes(q));
  const box=document.getElementById('channelList'); box.innerHTML='';
  document.getElementById('midTitle').textContent=activeGroup; document.getElementById('midCount').textContent=list.length;
  list.forEach(c=>{
    let d=document.createElement('div'); d.className='ch';
    d.innerHTML=`<img src="${c.logo}" onerror="this.src='https://via.placeholder.com/46/0b1120/ff0a16?text=TV'"><div style="flex:1;min-width:0"><div style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold">${c.name}</div><div style="font-size:10px;color:#8aa">${c.group} ${c.referrer?'•Ref':''}</div></div><span>▶</span>`;
    d.onclick=()=>{document.querySelectorAll('.ch').forEach(x=>x.classList.remove('active'));d.classList.add('active');playWithRetry(c,0);};
    box.appendChild(d);
  });
}
const PROXIES=[u=>u, u=>'https://corsproxy.io/?'+encodeURIComponent(u), u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)];
function playWithRetry(c, attempt){
  if(attempt===0){document.getElementById('empty').style.display='none'; document.getElementById('now').textContent=c.name;}
  if(attempt>=PROXIES.length){document.getElementById('pType').textContent='Açılamadı'; return;}
  let url=PROXIES[attempt](c.url); let ref=c.referrer||''; document.getElementById('pType').textContent='Deneme '+(attempt+1)+'/3...';
  if(hls){try{hls.destroy()}catch(e){} hls=null;} if(mpegPlayer){try{mpegPlayer.destroy()}catch(e){} mpegPlayer=null;}
  video.pause(); video.removeAttribute('src'); video.load();
  if(Hls.isSupported()){
    let cfg={enableWorker:true}; if(ref){cfg.xhrSetup=xhr=>{try{xhr.setRequestHeader('Referer',ref);xhr.setRequestHeader('Origin',new URL(ref).origin);}catch(e){}};}
    hls=new Hls(cfg); hls.loadSource(url); hls.attachMedia(video);
    let to=setTimeout(()=>{hls.destroy(); playWithRetry(c, attempt+1);},7000);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{clearTimeout(to); video.play().then(()=>{document.getElementById('pType').textContent='Oynatılıyor';}).catch(()=>{document.getElementById('pType').textContent='Dokun';});});
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){clearTimeout(to); hls.destroy(); playWithRetry(c, attempt+1);}});
  }else{video.src=url; video.play().catch(()=>playWithRetry(c, attempt+1));}
}
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async ev=>{
    let res=parseM3U(ev.target.result);
    if(res.channels.length){
      all=res.channels; currentList=f.name.slice(0,20);
      await saveToDB(currentList,all); await renderSaved(); apply();
      document.getElementById('empty').style.display='none'; toggleSet();
      document.getElementById('status').textContent=res.channels.length+' kanal dosyadan yüklendi';
    }
  };
  r.readAsText(f);
});
document.getElementById('search').addEventListener('input',renderCh);
(async()=>{await openDB();await renderSaved(); buildGroups();})();
</script>
</body>
</html>
